<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aumtara — Timetable Module</title>
<style>
:root{--navy:#1F3864;--blue:#2f5fd0;--accent:#7030A0;--green:#0e9f6e;--amber:#c98a00;--red:#c0392b;--bg:#f4f7fc;--line:#e2e6ee;--muted:#6b7280;}
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{margin:0;background:var(--bg);color:#222;}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px;}
header .logo{width:30px;height:30px;background:linear-gradient(135deg,#4f8cff,#7030A0);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;}
header h1{font-size:18px;margin:0;} header .sub{font-size:12px;opacity:.8;}
.langsel{margin-left:auto;background:#2c4a7c;color:#fff;border:1px solid #3f5f95;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;}
.langsel option{background:#fff;color:#222;}
.savebadge{font-size:12px;background:#0e9f6e;color:#fff;padding:4px 10px;border-radius:20px;opacity:0;transition:.3s;}
.savebadge.show{opacity:1;}
.tabs{display:flex;gap:2px;background:#fff;padding:0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tab{padding:12px 13px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;}
.tab.active{color:var(--navy);border-bottom-color:var(--blue);}
.wrap{max-width:1240px;margin:0 auto;padding:22px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
.kpi .n{font-size:26px;font-weight:800;color:var(--navy);} .kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.kpi.g .n{color:var(--green);}.kpi.a .n{color:var(--amber);}.kpi.p .n{color:var(--accent);}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;}
.card h2{margin:0 0 4px;font-size:16px;color:var(--navy);} .card .desc{color:var(--muted);font-size:13px;margin-bottom:14px;}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
button{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);} button.green{background:var(--green);}button.purple{background:var(--accent);}button.red{background:var(--red);}
button.mini{padding:4px 9px;font-size:12px;} button:hover{opacity:.92;}
table{border-collapse:collapse;width:100%;font-size:12.5px;} th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle;}
th{background:var(--navy);color:#fff;} td.ph{background:#eef2fb;font-weight:700;color:var(--navy);}
.cell{min-width:118px;} .cell select{width:100%;font-size:11px;padding:3px;border:none;background:transparent;margin:1px 0;}
.subj{font-weight:700;color:var(--navy);font-size:11.5px;} .tch{font-size:10.5px;color:var(--muted);} .rm{font-size:9.5px;color:var(--accent);}
.conflict{background:#ffe1e1 !important;outline:2px solid var(--red);}
.free{color:#bbb;font-style:italic;}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.pill.live{background:#d1fae5;color:#065f46;}.pill.break{background:#fef3c7;color:#92400e;}.pill.idle{background:#e5e7eb;color:#374151;}.pill.proxy{background:#ede9fe;color:#5b21b6;}
.mon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.mon{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;border-left:5px solid var(--line);}
.mon.live{border-left-color:var(--green);}.mon.break{border-left-color:var(--amber);}.mon.idle{border-left-color:#9ca3af;}.mon.proxy{border-left-color:var(--accent);}
.mon .cn{font-weight:800;color:var(--navy);font-size:15px;} .mon .info{font-size:12.5px;color:var(--muted);margin-top:6px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 16px;}
.note{background:#fff8e1;border-left:4px solid #f1c40f;padding:9px 12px;border-radius:0 6px 6px 0;font-size:12.5px;margin-bottom:16px;}
.hours-row{display:flex;justify-content:space-between;padding:10px 12px;border-left:4px solid var(--green);background:#f6fbff;border-radius:6px;margin-bottom:8px;} .hours-row.sat{border-left-color:var(--blue);}
.tag{background:#eef2fb;color:var(--navy);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin:2px;display:inline-block;}
.small{font-size:11px;color:var(--muted);} .badge-bad{color:var(--red);font-weight:700;font-size:10px;}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;} .feat div{background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;} .feat b{color:var(--navy);}
.setcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;} @media(max-width:820px){.setcols{grid-template-columns:1fr;}.kpis{grid-template-columns:1fr 1fr;}}
.listrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f2f6;} .listrow input{flex:1;}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#eef2fb;padding:3px 7px;border-radius:12px;margin:2px;cursor:pointer;} .chk input{margin:0;}
.guide{counter-reset:step;} .step{display:flex;gap:12px;margin-bottom:14px;} .step .no{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;} .step .txt b{color:var(--navy);} .step .txt{font-size:13.5px;}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);}
.okmsg{background:#d1fae5;color:#065f46;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;}
.errmsg{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;}
#printhead{display:none;}
@media print{
  header,.tabs,.savebadge{display:none !important;}
  .wrap{padding:0;max-width:100%;}
  .card{border:none;box-shadow:none;padding:0;margin:0;}
  .row,.desc,button,.note,.card>h2{display:none !important;}
  #diaryreport{border:1px solid #999 !important;padding:16px !important;}
  #printhead{display:block;text-align:center;margin-bottom:10px;} #printhead h3{margin:0;color:#000;} #printhead .sub{font-size:12px;color:#444;}
  table{font-size:11px;} th{background:#1F3864 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .conflict{outline:none;}
}
</style>
</head>

function DD(){return (I18N[LANG]&&I18N[LANG]._days)||I18N.en._days;}

const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];

const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json();};
function toast(msg){const e=document.getElementById('saved');e.textContent=msg||t('saved');e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>{e.classList.remove('show');e.textContent=t('saved');},msg?2800:1200);}

async function loadAll(){
  [classes,subjects,teachers,rooms,config,TT,absence,conflicts,chaptersAll]=await Promise.all([
    api('GET','/api/classes'),api('GET','/api/subjects'),api('GET','/api/teachers'),api('GET','/api/rooms'),
    api('GET','/api/timetable/config'),api('GET','/api/timetable'),api('GET','/api/timetable/absence'),api('GET','/api/timetable/conflicts'),api('GET','/api/chapters')]);
  if(!curClass||!classes.find(c=>c.id===curClass))curClass=classes[0]?.id;
  if(!curTeacher||!teachers.find(t=>t.id===curTeacher))curTeacher=teachers[0]?.id;
  render();
}
function addMin(h,m){let[a,b]=h.split(":").map(Number);let d=new Date(2020,0,1,a,b+m);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function slotsFor(di){const end=di===5?config.saturday_end:config.weekday_end;let s=[],t=config.weekday_start,i=0;while(true){const e=addMin(t,config.period_minutes);s.push({i,label:"P"+(i+1),start:t,end:e,brk:false});i++;if(e>=end||i>=10)break;t=e;if(i===config.break_after_period){const be=addMin(t,config.break_minutes);s.push({brk:true,label:"Break",start:t,end:be});t=be;}}return s;}
const sName=id=>(subjects.find(s=>s.id===id)||{}).name||"";
const tName=id=>(teachers.find(t=>t.id===id)||{}).name||"";
const rName=id=>(rooms.find(r=>r.id===id)||{}).name||"";
const tForSub=sid=>teachers.filter(t=>t.subjects.includes(sid));
const cell=(cid,d,p)=>TT.find(r=>r.class_id===cid&&r.day_of_week===d&&r.period_index===p);
function conflictAt(cid,d,p){const c=cell(cid,d,p);if(!c)return null;const out={};
  if(c.teacher_id){const o=TT.find(r=>r.class_id!==cid&&r.day_of_week===d&&r.period_index===p&&r.teacher_id===c.teacher_id);if(o)out.t=(classes.find(x=>x.id===o.class_id)||{}).name;}
  if(c.room_id){const o=TT.find(r=>r.class_id!==cid&&r.day_of_week===d&&r.period_index===p&&r.room_id===c.room_id);if(o)out.r=(classes.find(x=>x.id===o.class_id)||{}).name;}
  return (out.t||out.r)?out:null;}
function completed(){let n=0;classes.forEach(c=>{let f=0,tot=0;DAYS.forEach((_,di)=>{slotsFor(di).filter(s=>!s.brk).forEach((_,pi)=>{tot++;const cc=cell(c.id,di,pi);if(cc&&cc.subject_id)f++;});});if(tot&&f===tot)n++;});return n;}
const absentDay=tid=>absence.filter(a=>a.teacher_id===tid).map(a=>a.day_of_week);
const conflictCount=()=>conflicts.teacher.length+conflicts.room.length;

const TABKEYS=[["dash","nav_dash"],["setup","nav_setup"],["hours","nav_hours"],["quota","nav_quota"],["build","nav_build"],["class","nav_class"],["teacher","nav_teacher"],["diary","nav_diary"],["school","nav_school"],["sub","nav_sub"],["monitor","nav_monitor"],["data","nav_data"],["help","nav_help"]];
function render(){
  document.getElementById("tabs").innerHTML=TABKEYS.map(([k,lk])=>`<div class="tab ${k===tab?'active':''}" onclick="setTab('${k}')">${t(lk)}</div>`).join("");
  document.getElementById("view").innerHTML=({dash,setup,hours,quota:quotaView,build:builder,class:classView,teacher:teacherView,diary:diaryView,school:schoolView,sub:subView,monitor,data:dataView,help}[tab])();
  if(tab==="monitor")refreshMonitor(); if(tab==="sub")loadCover(); if(tab==="quota")loadQuota(); if(tab==="diary")loadDiary();
}

function setup(){
  const classList=classes.map(c=>`<div class="listrow"><input value="${c.name}" onchange="upd('classes',${c.id},{name:this.value})"><button class="ghost mini red" onclick="del('classes',${c.id})">✕</button></div>`).join('');
  const subList=subjects.map(s=>`<div class="listrow"><input value="${s.name}" onchange="upd('subjects',${s.id},{name:this.value})"><button class="ghost mini red" onclick="del('subjects',${s.id})">✕</button></div>`).join('');
  const roomList=rooms.map(r=>`<div class="listrow"><input value="${r.name}" onchange="upd('rooms',${r.id},{name:this.value})"><input type="number" style="width:70px" value="${r.capacity||''}" placeholder="${t('ph_cap')}" onchange="upd('rooms',${r.id},{capacity:+this.value})"><button class="ghost mini red" onclick="del('rooms',${r.id})">✕</button></div>`).join('');
  const tchList=teachers.map(t2=>`<div style="padding:8px 0;border-bottom:1px solid #f0f2f6">
     <div class="listrow"><input value="${t2.name}" onchange="updTeacher(${t2.id},{name:this.value})"><button class="ghost mini red" onclick="delTeacher(${t2.id})">✕</button></div>
     <div class="row" style="gap:8px;margin:4px 0">
       <input style="flex:1;min-width:120px" value="${t2.qualification||''}" placeholder="${t('ph_qualification')}" onchange="updTeacher(${t2.id},{qualification:this.value})">
       <select onchange="updTeacher(${t2.id},{main_subject_id:this.value?+this.value:null})"><option value="">${t('opt_main_subject')}</option>${subjects.map(s=>`<option value="${s.id}" ${t2.main_subject_id===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
       <input type="number" style="width:110px" value="${t2.max_load||''}" placeholder="${t('ph_weekly_load')}" onchange="updTeacher(${t2.id},{max_load:+this.value||null})"></div>
     <div><span class="small">${t('can_teach')} </span>${subjects.map(s=>`<label class="chk"><input type="checkbox" ${t2.subjects.includes(s.id)?'checked':''} onchange="toggleSub(${t2.id},${s.id},this.checked)">${s.name}</label>`).join('')}</div></div>`).join('');
  return `<div class="setcols">
   <div class="card"><h2>${t('setup_classes')}</h2>${classList||'<span class="small">'+t('none')+'</span>'}<div class="row" style="margin-top:8px"><input id="ncls" placeholder="${t('ph_new_class')}"><button onclick="add('classes','ncls')">${t('add')}</button></div></div>
   <div class="card"><h2>${t('setup_subjects')}</h2>${subList||'<span class="small">'+t('none')+'</span>'}<div class="row" style="margin-top:8px"><input id="nsub" placeholder="${t('ph_new_subject')}"><button onclick="add('subjects','nsub')">${t('add')}</button></div></div>
   <div class="card"><h2>${t('setup_rooms')}</h2>${roomList||'<span class="small">'+t('none')+'</span>'}<div class="row" style="margin-top:8px"><input id="nroom" placeholder="${t('ph_room_name')}"><input id="ncap" type="number" style="width:70px" placeholder="${t('ph_cap')}"><button onclick="addRoom()">${t('add')}</button></div></div>
   <div class="card"><h2>${t('setup_teachers')}</h2><div class="desc">${t('teachers_desc')}</div>${tchList||'<span class="small">'+t('none')+'</span>'}<div class="row" style="margin-top:8px"><input id="ntch" placeholder="${t('ph_new_teacher')}"><button onclick="addTeacher()">${t('add')}</button></div></div>
   <div class="card"><h2>${t('chapters_title')}</h2><div class="desc">${t('chapters_desc')}</div>
     <div class="row" style="margin-bottom:8px"><select onchange="setupSubj=+this.value;render()">${subjects.map(s=>`<option value="${s.id}" ${s.id===(setupSubj||(subjects[0]||{}).id)?'selected':''}>${s.name}</option>`).join('')}</select></div>
     ${(()=>{const sid=setupSubj||(subjects[0]||{}).id;const list=chaptersForSubject(sid);return list.length?list.map(c=>`<div class="listrow"><input value="${c.name.replace(/"/g,'&quot;')}" disabled><button class="ghost mini red" onclick="delChapter(${c.id})">✕</button></div>`).join(''):'<span class="small">'+t('no_chapters')+'</span>';})()}
     <div class="row" style="margin-top:8px"><input id="nchap" placeholder="${t('ph_new_chapter')}"><button onclick="addChapter()">${t('add')}</button></div></div></div>`;
}

function builder(){const di=buildDay,slots=slotsFor(di);
  let head=`<th>${t('th_class_period')}</th>`+slots.map(s=>`<th>${s.brk?'☕':s.label}<br><span style="font-weight:400;font-size:10px">${s.start}-${s.end}</span></th>`).join("");
  let rows=classes.map(c=>{let pi=0,cells=`<td class="ph">${c.name}</td>`;
    slots.forEach(sl=>{if(sl.brk){cells+=`<td style="background:#fff7e6">☕</td>`;return;}
      const cc=cell(c.id,di,pi),conf=conflictAt(c.id,di,pi);
      const sopt=`<option value="">${t('opt_free')}</option>`+subjects.map(s=>`<option value="${s.id}" ${cc&&cc.subject_id===s.id?'selected':''}>${s.name}</option>`).join("");
      const tl=cc&&cc.subject_id?tForSub(cc.subject_id):teachers;
      const topt=`<option value="">${t('opt_teacher')}</option>`+tl.map(t2=>`<option value="${t2.id}" ${cc&&cc.teacher_id===t2.id?'selected':''}>${t2.name}</option>`).join("");
      const ropt=`<option value="">${t('opt_room')}</option>`+rooms.map(r=>`<option value="${r.id}" ${cc&&cc.room_id===r.id?'selected':''}>${r.name}</option>`).join("");
      cells+=`<td class="cell ${conf?'conflict':''}"><select onchange="setSub_(${c.id},${di},${pi},this.value)">${sopt}</select>
        <select onchange="setTea(${c.id},${di},${pi},this.value)">${topt}</select>
        <select onchange="setRoom(${c.id},${di},${pi},this.value)">${ropt}</select>
        ${conf?`<div class="badge-bad">${conf.t?t('warn_teacher')+' '+conf.t:''} ${conf.r?t('warn_room')+' '+conf.r:''}</div>`:''}</td>`;pi++;});
    return `<tr>${cells}</tr>`;}).join("");
  return `<div class="card"><h2>${t('builder_title')}</h2><div class="desc">${t('builder_desc')}</div>
   <div class="row" style="margin-bottom:12px"><div><label>${t('day')}</label><select onchange="buildDay=+this.value;render()">${DAYS.map((d,i)=>`<option value="${i}" ${i===di?'selected':''}>${DD()[i]}</option>`).join("")}</select></div>
     <button class="green" onclick="autoGen()">${t('btn_autogen_all')}</button></div>
   <div style="overflow:auto"><table><tr>${head}</tr>${rows}</table></div></div>`;}

function renderQuota(){ const box=document.getElementById('quotabox'); if(!box)return;
  let totalSlots=0; DAYS.forEach((_,di)=>totalSlots+=slotsFor(di).filter(s=>!s.brk).length);
  const q={}; quotaData.forEach(x=>q[x.subject_id]=x.per_week);
  let sum=Object.values(q).reduce((a,b)=>a+(+b||0),0);
  box.innerHTML=`<table><tr><th>${t('subject')}</th><th>${t('th_periods_week')}</th></tr>${subjects.map(s=>`<tr><td>${s.name}</td>
     <td><input type="number" min="0" style="width:90px" value="${q[s.id]||0}" onchange="setQuota(${s.id},+this.value)"></td></tr>`).join('')}
     <tr><td class="ph">${t('total_assigned')}</td><td class="ph" style="${sum>totalSlots?'color:#991b1b':''}">${t('weekly_slots',{sum,total:totalSlots})}</td></tr></table>
     ${sum>totalSlots?'<div class="errmsg">'+t('err_over_slots')+'</div>':''}`;
}

// ---------- TEACHER DIARY (official format) ----------
let diaryDate=null, diaryEntries=[], diaryMode='entry', diaryClass='';
const DFIELDS=[['lesson','f_lesson'],['topic','f_topic'],['learning_outcome','f_lo'],['assessment_lo','f_assess'],['homework','f_hw'],['teaching_aids','f_aids']];
function dowFromDate(d){ return (new Date(d+'T00:00:00').getDay()+6)%7; }
function longDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function diaryView(){ if(!diaryDate)diaryDate=new Date().toISOString().slice(0,10);
  return `<div class="card"><h2>${t('diary_title')}</h2><div class="desc">${t('diary_desc')}</div>
   <div class="row" style="margin-bottom:12px">
     <div><label>${t('teacher')}</label><select onchange="curTeacher=+this.value;loadDiary()">${teachers.map(t2=>`<option value="${t2.id}" ${t2.id===curTeacher?'selected':''}>${t2.name}</option>`).join('')}</select></div>
     <div><label>${t('day')}</label><select onchange="diaryDate=dateForDay(+this.value);loadDiary()">${DAYS.map((d,i)=>`<option value="${i}" ${i===dowFromDate(diaryDate)?'selected':''}>${DD()[i]}</option>`).join('')}</select></div>
     <div><label>${t('r_date').replace(':','')}</label><input type="date" value="${diaryDate}" onchange="diaryDate=this.value;loadDiary()"></div>
     <div style="align-self:flex-end"><button class="${diaryMode==='entry'?'':'ghost'}" onclick="diaryMode='entry';loadDiary()">${t('btn_fill')}</button>
       <button class="${diaryMode==='report'?'purple':'ghost'}" onclick="diaryMode='report';loadDiary()">${t('btn_report')}</button></div>
   </div>
   <div id="diarybody">Loading…</div></div>`;
}
const chaptersForSubject=sid=>chaptersAll.filter(c=>c.subject_id===sid);
function dateForDay(dow){ const d=new Date(diaryDate+'T00:00:00'); const cur=(d.getDay()+6)%7; d.setDate(d.getDate()-cur+dow); return d.toISOString().slice(0,10); }
function subjOptions(sel){ return subjects.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${s.name}</option>`).join(''); }
function onSubjChange(selEl){ const card=selEl.closest('.card'); const sid=+selEl.value; card.querySelectorAll('input[data-listsub]').forEach(inp=>inp.setAttribute('list','chap_'+sid)); }
function chapDatalists(){ return subjects.map(s=>`<datalist id="chap_${s.id}">${chaptersForSubject(s.id).map(c=>`<option value="${c.name.replace(/"/g,'&quot;')}">`).join('')}</datalist>`).join(''); }
async function loadDiary(){ const box=document.getElementById('diarybody'); if(!box){render();return;}
  const dow=dowFromDate(diaryDate);
  diaryEntries=await api('GET',`/api/diary?teacher_id=${curTeacher}&date=${diaryDate}`);
  if(diaryMode==='report'){ box.innerHTML=diaryReport(dow); return; }
  const periods=TT.filter(r=>r.teacher_id===curTeacher && r.day_of_week===dow).sort((a,b)=>a.period_index-b.period_index);
  const ex=(cid,pi)=>diaryEntries.find(e=>e.class_id===cid && e.period_index===pi)||{};
  const esc=s=>(s||'').replace(/</g,'&lt;'); const av=s=>(s||'').replace(/"/g,'&quot;');
  const inS='width:100%;border:1px solid var(--line);border-radius:6px;padding:6px;font-size:12px';
  const combo=(e,f,sid,ph)=>`<input data-f="${f}" data-listsub list="chap_${sid}" value="${av(e[f])}" placeholder="${ph}" style="${inS}">`;
  const ta=(e,f)=>`<textarea rows="2" data-f="${f}" style="${inS};resize:vertical">${esc(e[f])}</textarea>`;
  let html;
  if(!periods.length){ html=`<div class="note">${t('no_periods',{day:DD()[dow]})}</div>`+freeForm(dow); }
  else html=periods.map(p=>{const e=ex(p.class_id,p.period_index);const cls=(classes.find(c=>c.id===p.class_id)||{}).name;const sid=p.subject_id;
    return `<div class="card" style="margin-bottom:12px;border-left:4px solid var(--blue)">
      <div class="row" style="gap:12px;align-items:flex-end;margin-bottom:4px">
        <div><label>${t('lbl_period')}</label><div style="font-weight:700;color:var(--navy)">P${p.period_index+1} · ${cls}</div></div>
        <div><label>${t('subject')}</label><select data-sel="subject" onchange="onSubjChange(this)">${subjOptions(sid)}</select></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
        <div><label>${t('lbl_lesson_chapter')}</label>${combo(e,'lesson',sid,t('ph_pick_chapter'))}</div>
        <div><label>${t('f_topic')}</label>${combo(e,'topic',sid,t('ph_topic'))}</div>
        <div><label>${t('f_lo')}</label>${ta(e,'learning_outcome')}</div>
        <div><label>${t('f_assess')}</label>${ta(e,'assessment_lo')}</div>
        <div><label>${t('f_hw')}</label>${ta(e,'homework')}</div>
        <div><label>${t('f_aids')}</label>${ta(e,'teaching_aids')}</div></div>
      <div style="margin-top:8px"><button onclick="saveDiary(this,${p.class_id},${p.period_index},${dow})">${t('btn_save')}</button></div></div>`;}).join('');
  box.innerHTML=chapDatalists()+html;
}
function freeForm(dow){ const inS='width:100%;border:1px solid var(--line);border-radius:6px;padding:6px';
  const cl=`<option value="">${t('opt_class')}</option>`+classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  const sb=`<option value="">${t('opt_subject')}</option>`+subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const firstSid=subjects[0]?subjects[0].id:'';
  return `<div class="card" style="border-left:4px solid var(--accent)"><div class="row"><div><label>${t('class_')}</label><select id="fcls">${cl}</select></div>
     <div><label>${t('subject')}</label><select id="fsub" onchange="document.querySelectorAll('#ff_lesson,#ff_topic').forEach(x=>x.setAttribute('list','chap_'+this.value))">${sb}</select></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:8px">
      <div><label>${t('lbl_lesson_chapter')}</label><input id="ff_lesson" list="chap_${firstSid}" style="${inS}"></div>
      <div><label>${t('f_topic')}</label><input id="ff_topic" list="chap_${firstSid}" style="${inS}"></div>
      ${['learning_outcome','assessment_lo','homework','teaching_aids'].map(f=>`<div><label>${t(DFIELDS.find(x=>x[0]===f)[1])}</label><textarea rows="2" id="ff_${f}" style="${inS}"></textarea></div>`).join('')}</div>
    <div style="margin-top:8px"><button onclick="saveFree(${dow})">${t('btn_save_entry')}</button></div></div>`;
}
async function saveDiary(btn,class_id,period_index,dow){ const card=btn.closest('.card');
  const g=f=>(card.querySelector(`[data-f="${f}"]`)||{}).value||'';
  const subject_id=+(card.querySelector('[data-sel="subject"]')||{}).value||null;
  const body={teacher_id:curTeacher,entry_date:diaryDate,day_of_week:dow,class_id,subject_id,period_index}; DFIELDS.forEach(([f])=>body[f]=g(f));
  await api('POST','/api/diary',body); toast(); btn.textContent=t('saved'); setTimeout(()=>btn.textContent=t('btn_save'),1200);
}
async function saveFree(dow){ const v=id=>(document.getElementById(id)||{}).value;
  if(!v('fcls')){alert(t('alert_pick_class'));return;}
  const body={teacher_id:curTeacher,entry_date:diaryDate,day_of_week:dow,class_id:+v('fcls'),subject_id:+v('fsub')||null,period_index:null}; DFIELDS.forEach(([f])=>body[f]=v('ff_'+f));
  await api('POST','/api/diary',body); toast(); loadDiary();
}
// ----- official printable report -----
function diaryReport(dow){
  const tName2=(teachers.find(t2=>t2.id===curTeacher)||{}).name||'';
  let rows=diaryEntries.slice().sort((a,b)=>(a.period_index??99)-(b.period_index??99));
  if(diaryClass)rows=rows.filter(r=>r.class_id===+diaryClass);
  const esc=s=>(s||'').replace(/</g,'&lt;');
  const single=diaryClass?(classes.find(c=>c.id===+diaryClass)||{}).name:'';
  const singleSub=diaryClass&&rows[0]?sName(rows[0].subject_id):'';
  const cols=diaryClass?DFIELDS:[['class','class_'],['subject','subject'],...DFIELDS];
  const cellFor=(r,f)=> f==='class'?( (classes.find(c=>c.id===r.class_id)||{}).name||'') : f==='subject'?sName(r.subject_id) : esc(r[f]);
  const clsFilter=`<select onchange="diaryClass=this.value;loadDiary()"><option value="">${t('all_classes')}</option>${classes.map(c=>`<option value="${c.id}" ${diaryClass==String(c.id)?'selected':''}>${c.name}</option>`).join('')}</select>`;
  return `<div class="row" style="margin-bottom:10px"><div><label>${t('class_')}</label>${clsFilter}</div>
     <div style="align-self:flex-end">
       <button class="ghost" onclick="printPlain()">${t('print_pdf')}</button>
       <button class="ghost" onclick="location.href='/api/export/diary.xlsx?teacher_id='+curTeacher+'&date='+diaryDate">${t('btn_export_excel')}</button>
       <button onclick="diaryMode='entry';loadDiary()">${t('btn_edit')}</button></div></div>
   <div id="diaryreport" style="border:1px solid var(--line);border-radius:8px;padding:18px">
     <div style="text-align:center;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:10px">
       <div style="font-size:20px;font-weight:800;color:var(--navy)">${esc(config.school_name||t('school_name_ph'))}</div>
       <div style="font-size:15px;font-weight:700;letter-spacing:.5px">${t('diary_title')}</div></div>
     <div style="display:flex;flex-wrap:wrap;gap:20px;font-size:13px;margin-bottom:12px">
       <div><b>${t('r_teacher')}</b> ${esc(tName2)}</div>${diaryClass?`<div><b>${t('r_class')}</b> ${esc(single)}</div><div><b>${t('r_subject')}</b> ${esc(singleSub)}</div>`:''}
       <div><b>${t('r_date')}</b> ${longDate(diaryDate)}</div><div><b>${t('r_day')}</b> ${DD()[dow]}</div></div>
     ${rows.length?`<table><tr>${cols.map(c=>`<th>${t(c[1])}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td style="text-align:left;vertical-align:top">${cellFor(r,c[0])}</td>`).join('')}</tr>`).join('')}</table>`
       :'<div class="note">'+t('no_entries')+'</div>'}
   </div>`;
}
async function delDiary(id){ await api('DELETE','/api/diary/'+id); toast(); loadDiary(); }

// ---------- SUBSTITUTION ----------
function subView(){return `<div class="card"><h2>${t('sub_title')}</h2><div class="desc">${t('sub_desc')}</div>
   <div class="row" style="margin-bottom:12px"><div><label>${t('day')}</label><select onchange="subDay=+this.value;loadCover()">${DAYS.map((d,i)=>`<option value="${i}" ${i===subDay?'selected':''}>${DD()[i]}</option>`).join("")}</select></div>
     <span class="small">${t('sub_hint')}</span></div>
   <div id="coverbox">Loading…</div></div>`;}
async function loadCover(){const box=document.getElementById('coverbox');if(!box)return;cover=await api('GET','/api/timetable/cover?day='+subDay);
  if(!cover.need.length){box.innerHTML='<div class="note">'+t('no_cover',{day:DD()[subDay]})+'</div>';return;}
  box.innerHTML=`<table><tr><th>${t('class_')}</th><th>${t('th_period')}</th><th>${t('subject')}</th><th>${t('th_absent_teacher')}</th><th>${t('th_assign_proxy')}</th></tr>${
    cover.need.map(n=>`<tr><td>${(classes.find(c=>c.id===n.class_id)||{}).name}</td><td>P${n.period_index+1}</td><td>${n.subj}</td>
      <td><span class="pill proxy">${tName(n.teacher_id)}</span></td>
      <td><select onchange="assignProxy(${n.class_id},${n.period_index},this.value)"><option value="">${t('opt_pick_free')}</option>${n.free.map(f=>`<option value="${f.id}" ${n.proxy_teacher_id===f.id?'selected':''}>${f.name}</option>`).join('')}</select></td></tr>`).join('')}</table>
    <div class="small" style="margin-top:8px">${t('proxy_note')}</div>`;}
async function assignProxy(class_id,period,v){await api('POST','/api/timetable/substitute',{day:subDay,class_id,period,proxy_teacher_id:v===''?null:+v});toast();loadCover();}

// ---------- LIVE MONITOR ----------
function monitor(){return `<div class="card"><h2>${t('monitor_title')}</h2>
   <div class="desc">${t('monitor_desc')}</div>
   <div class="row" style="margin-bottom:6px">
     <div><label>${t('lbl_sim_day')}</label><select id="mday" onchange="monDay=this.value===''?null:+this.value;refreshMonitor()"><option value="">${t('opt_now')}</option>${DAYS.map((d,i)=>`<option value="${i}" ${monDay===i?'selected':''}>${DD()[i]}</option>`).join("")}</select></div>
     <div><label>${t('lbl_sim_time')}</label><input type="time" id="mtime" value="${monTime||''}" onchange="monTime=this.value;refreshMonitor()"></div>
     <button class="ghost" onclick="monDay=null;monTime=null;refreshMonitor()">${t('btn_real_time')}</button></div>
   <div class="legend"><span><span class="pill live">${t('st_live')}</span> ${t('legend_running')}</span><span><span class="pill break">${t('st_break')}</span></span><span><span class="pill idle">${t('st_idle')}</span></span><span><span class="pill proxy">${t('st_proxy')}</span> ${t('legend_absent_covered')}</span></div>
   <div class="mon-grid" id="mongrid">Loading…</div></div>`;}
async function refreshMonitor(){const g=document.getElementById('mongrid');if(!g)return;let u='/api/timetable/monitor';if(monDay!=null&&monTime)u+=`?day=${monDay}&time=${monTime}`;const d=await api('GET',u);
  g.innerHTML=d.classes.map(c=>`<div class="mon ${c.status}"><div class="cn">${c.name}</div><div><span class="pill ${c.status}">${t('st_'+c.status)}</span></div><div class="info">${c.text}</div></div>`).join("");}

/* ============================ boot ============================ */
document.documentElement.lang=LANG;
buildLangSel();
applyChrome();
loadAll();
</script>

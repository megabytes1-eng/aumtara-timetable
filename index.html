<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aumtara — Timetable Module</title>
<style>
:root{--navy:#1F3864;--blue:#2f5fd0;--accent:#7030A0;--green:#0e9f6e;--amber:#c98a00;--red:#c0392b;--bg:#f4f7fc;--line:#e2e6ee;--muted:#6b7280;}
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{margin:0;background:var(--bg);color:#222;}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px;}
header .logo{width:30px;height:30px;background:linear-gradient(135deg,#4f8cff,#7030A0);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;}
header h1{font-size:18px;margin:0;} header .sub{font-size:12px;opacity:.8;}
.savebadge{margin-left:auto;font-size:12px;background:#0e9f6e;padding:4px 10px;border-radius:20px;opacity:0;transition:.3s;}
.savebadge.show{opacity:1;}
.tabs{display:flex;gap:2px;background:#fff;padding:0 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tab{padding:12px 13px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;}
.tab.active{color:var(--navy);border-bottom-color:var(--blue);}
.wrap{max-width:1240px;margin:0 auto;padding:22px;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;}
.kpi .n{font-size:26px;font-weight:800;color:var(--navy);} .kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
.kpi.g .n{color:var(--green);}.kpi.a .n{color:var(--amber);}.kpi.p .n{color:var(--accent);}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;}
.card h2{margin:0 0 4px;font-size:16px;color:var(--navy);} .card .desc{color:var(--muted);font-size:13px;margin-bottom:14px;}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
button{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);} button.green{background:var(--green);}button.purple{background:var(--accent);}button.red{background:var(--red);}
button.mini{padding:4px 9px;font-size:12px;} button:hover{opacity:.92;}
table{border-collapse:collapse;width:100%;font-size:12.5px;} th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle;}
th{background:var(--navy);color:#fff;} td.ph{background:#eef2fb;font-weight:700;color:var(--navy);}
.cell{min-width:118px;} .cell select{width:100%;font-size:11px;padding:3px;border:none;background:transparent;margin:1px 0;}
.subj{font-weight:700;color:var(--navy);font-size:11.5px;} .tch{font-size:10.5px;color:var(--muted);} .rm{font-size:9.5px;color:var(--accent);}
.conflict{background:#ffe1e1 !important;outline:2px solid var(--red);}
.free{color:#bbb;font-style:italic;}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.pill.live{background:#d1fae5;color:#065f46;}.pill.break{background:#fef3c7;color:#92400e;}.pill.idle{background:#e5e7eb;color:#374151;}.pill.proxy{background:#ede9fe;color:#5b21b6;}
.mon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.mon{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;border-left:5px solid var(--line);}
.mon.live{border-left-color:var(--green);}.mon.break{border-left-color:var(--amber);}.mon.idle{border-left-color:#9ca3af;}.mon.proxy{border-left-color:var(--accent);}
.mon .cn{font-weight:800;color:var(--navy);font-size:15px;} .mon .info{font-size:12.5px;color:var(--muted);margin-top:6px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 16px;}
.note{background:#fff8e1;border-left:4px solid #f1c40f;padding:9px 12px;border-radius:0 6px 6px 0;font-size:12.5px;margin-bottom:16px;}
.hours-row{display:flex;justify-content:space-between;padding:10px 12px;border-left:4px solid var(--green);background:#f6fbff;border-radius:6px;margin-bottom:8px;} .hours-row.sat{border-left-color:var(--blue);}
.tag{background:#eef2fb;color:var(--navy);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin:2px;display:inline-block;}
.small{font-size:11px;color:var(--muted);} .badge-bad{color:var(--red);font-weight:700;font-size:10px;}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;} .feat div{background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;} .feat b{color:var(--navy);}
.setcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;} @media(max-width:820px){.setcols{grid-template-columns:1fr;}.kpis{grid-template-columns:1fr 1fr;}}
.listrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f2f6;} .listrow input{flex:1;}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:#eef2fb;padding:3px 7px;border-radius:12px;margin:2px;cursor:pointer;} .chk input{margin:0;}
.guide{counter-reset:step;} .step{display:flex;gap:12px;margin-bottom:14px;} .step .no{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;} .step .txt b{color:var(--navy);} .step .txt{font-size:13.5px;}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);}
.okmsg{background:#d1fae5;color:#065f46;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;}
.errmsg{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;}
#printhead{display:none;}
@media print{
  header,.tabs,.savebadge{display:none !important;}
  .wrap{padding:0;max-width:100%;}
  .card{border:none;box-shadow:none;padding:0;margin:0;}
  .row,.desc,button,.note,.card>h2{display:none !important;}
  #diaryreport{border:1px solid #999 !important;padding:16px !important;}
  #printhead{display:block;text-align:center;margin-bottom:10px;} #printhead h3{margin:0;color:#000;} #printhead .sub{font-size:12px;color:#444;}
  table{font-size:11px;} th{background:#1F3864 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .conflict{outline:none;}
}
</style>
</head>
<body>
<header>
  <div class="logo">A</div>
  <div><h1>Aumtara — Timetable Module</h1><div class="sub">Create &amp; manage class schedules · live data from your database</div></div>
  <div class="savebadge" id="saved">✓ Saved</div>
</header>
<div class="tabs" id="tabs"></div>
<div class="wrap"><div id="printhead"></div><div id="view">Loading…</div></div>

<script>
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"];
let classes=[],subjects=[],teachers=[],rooms=[],config={},TT=[],absence=[],conflicts={teacher:[],room:[]},chaptersAll=[];
let tab="dash",curClass=null,curTeacher=null,buildDay=0,monDay=null,monTime=null,subDay=0,cover=null;

const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json();};
function toast(){const e=document.getElementById('saved');e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1200);}

async function loadAll(){
  [classes,subjects,teachers,rooms,config,TT,absence,conflicts,chaptersAll]=await Promise.all([
    api('GET','/api/classes'),api('GET','/api/subjects'),api('GET','/api/teachers'),api('GET','/api/rooms'),
    api('GET','/api/timetable/config'),api('GET','/api/timetable'),api('GET','/api/timetable/absence'),api('GET','/api/timetable/conflicts'),api('GET','/api/chapters')]);
  if(!curClass||!classes.find(c=>c.id===curClass))curClass=classes[0]?.id;
  if(!curTeacher||!teachers.find(t=>t.id===curTeacher))curTeacher=teachers[0]?.id;
  render();
}
function addMin(h,m){let[a,b]=h.split(":").map(Number);let d=new Date(2020,0,1,a,b+m);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function slotsFor(di){const end=di===5?config.saturday_end:config.weekday_end;let s=[],t=config.weekday_start,i=0;while(true){const e=addMin(t,config.period_minutes);s.push({i,label:"P"+(i+1),start:t,end:e,brk:false});i++;if(e>=end||i>=10)break;t=e;if(i===config.break_after_period){const be=addMin(t,config.break_minutes);s.push({brk:true,label:"Break",start:t,end:be});t=be;}}return s;}
const sName=id=>(subjects.find(s=>s.id===id)||{}).name||"";
const tName=id=>(teachers.find(t=>t.id===id)||{}).name||"";
const rName=id=>(rooms.find(r=>r.id===id)||{}).name||"";
const tForSub=sid=>teachers.filter(t=>t.subjects.includes(sid));
const cell=(cid,d,p)=>TT.find(r=>r.class_id===cid&&r.day_of_week===d&&r.period_index===p);
function conflictAt(cid,d,p){const c=cell(cid,d,p);if(!c)return null;const out={};
  if(c.teacher_id){const o=TT.find(r=>r.class_id!==cid&&r.day_of_week===d&&r.period_index===p&&r.teacher_id===c.teacher_id);if(o)out.t=(classes.find(x=>x.id===o.class_id)||{}).name;}
  if(c.room_id){const o=TT.find(r=>r.class_id!==cid&&r.day_of_week===d&&r.period_index===p&&r.room_id===c.room_id);if(o)out.r=(classes.find(x=>x.id===o.class_id)||{}).name;}
  return (out.t||out.r)?out:null;}
function completed(){let n=0;classes.forEach(c=>{let f=0,tot=0;DAYS.forEach((_,di)=>{slotsFor(di).filter(s=>!s.brk).forEach((_,pi)=>{tot++;const cc=cell(c.id,di,pi);if(cc&&cc.subject_id)f++;});});if(tot&&f===tot)n++;});return n;}
const absentDay=tid=>absence.filter(a=>a.teacher_id===tid).map(a=>a.day_of_week);
const conflictCount=()=>conflicts.teacher.length+conflicts.room.length;

const TABS=[["dash","Dashboard"],["setup","Setup"],["hours","Academic Hours"],["quota","Quota"],["build","Builder"],["class","Class"],["teacher","Teacher"],["diary","Teacher Diary"],["school","School View"],["sub","Substitution"],["monitor","Live Monitor"],["data","Import / Export"],["help","Help & Guide"]];
function render(){
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<div class="tab ${k===tab?'active':''}" onclick="setTab('${k}')">${l}</div>`).join("");
  document.getElementById("view").innerHTML=({dash,setup,hours,quota:quotaView,build:builder,class:classView,teacher:teacherView,diary:diaryView,school:schoolView,sub:subView,monitor,data:dataView,help}[tab])();
  if(tab==="monitor")refreshMonitor(); if(tab==="sub")loadCover(); if(tab==="quota")loadQuota(); if(tab==="diary")loadDiary();
}
function printDoc(title,sub){document.getElementById('printhead').innerHTML=`<h3>${title}</h3><div class="sub">${sub||''}</div>`;window.print();}
function printPlain(){document.getElementById('printhead').innerHTML='';window.print();}
function setTab(t){tab=t;render();}

// ---------- DASHBOARD ----------
function dash(){return `<div class="kpis">
   <div class="kpi"><div class="n">${classes.length}</div><div class="l">Classrooms</div></div>
   <div class="kpi g"><div class="n">${subjects.length}</div><div class="l">Subjects</div></div>
   <div class="kpi a"><div class="n">${teachers.length}</div><div class="l">Teachers</div></div>
   <div class="kpi p"><div class="n">${completed()}/${classes.length}</div><div class="l">Completed</div></div></div>
   <div class="card"><h2>Timetable Management</h2><div class="desc">Full module — everything saves to the database. ${rooms.length} rooms · ${conflictCount()} active clash(es).</div>
   <div class="row"><button class="green" onclick="autoGen()">⚡ Auto-generate timetable</button>
     <button class="ghost" onclick="setTab('setup')">Manage classes/teachers</button>
     <button class="ghost" onclick="setTab('build')">Build timetable</button>
     <button class="purple" onclick="setTab('sub')">Substitution</button>
     <button class="ghost" onclick="setTab('monitor')">▶ Live Monitor</button></div>
   <div class="feat">
     <div><b>Period optimization</b><br><span class="small">Slots + quota-aware auto-generate.</span></div>
     <div><b>Conflict management</b><br><span class="small">Teacher & room clashes flagged (${conflictCount()} now).</span></div>
     <div><b>Substitution</b><br><span class="small">Absent teacher → assign a free proxy.</span></div></div></div>`;}
async function autoGen(){await api('POST','/api/timetable/auto-generate');toast();await loadAll();}

// ---------- SETUP (CRUD) ----------
function setup(){
  const classList=classes.map(c=>`<div class="listrow"><input value="${c.name}" onchange="upd('classes',${c.id},{name:this.value})"><button class="ghost mini red" onclick="del('classes',${c.id})">✕</button></div>`).join('');
  const subList=subjects.map(s=>`<div class="listrow"><input value="${s.name}" onchange="upd('subjects',${s.id},{name:this.value})"><button class="ghost mini red" onclick="del('subjects',${s.id})">✕</button></div>`).join('');
  const roomList=rooms.map(r=>`<div class="listrow"><input value="${r.name}" onchange="upd('rooms',${r.id},{name:this.value})"><input type="number" style="width:70px" value="${r.capacity||''}" placeholder="cap" onchange="upd('rooms',${r.id},{capacity:+this.value})"><button class="ghost mini red" onclick="del('rooms',${r.id})">✕</button></div>`).join('');
  const tchList=teachers.map(t=>`<div style="padding:8px 0;border-bottom:1px solid #f0f2f6">
     <div class="listrow"><input value="${t.name}" onchange="updTeacher(${t.id},{name:this.value})"><button class="ghost mini red" onclick="delTeacher(${t.id})">✕</button></div>
     <div class="row" style="gap:8px;margin:4px 0">
       <input style="flex:1;min-width:120px" value="${t.qualification||''}" placeholder="Qualification" onchange="updTeacher(${t.id},{qualification:this.value})">
       <select onchange="updTeacher(${t.id},{main_subject_id:this.value?+this.value:null})"><option value="">Main subject…</option>${subjects.map(s=>`<option value="${s.id}" ${t.main_subject_id===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
       <input type="number" style="width:110px" value="${t.max_load||''}" placeholder="Weekly load" onchange="updTeacher(${t.id},{max_load:+this.value||null})"></div>
     <div><span class="small">Can teach: </span>${subjects.map(s=>`<label class="chk"><input type="checkbox" ${t.subjects.includes(s.id)?'checked':''} onchange="toggleSub(${t.id},${s.id},this.checked)">${s.name}</label>`).join('')}</div></div>`).join('');
  return `<div class="setcols">
   <div class="card"><h2>Classes</h2>${classList||'<span class="small">none</span>'}<div class="row" style="margin-top:8px"><input id="ncls" placeholder="New class name"><button onclick="add('classes','ncls')">+ Add</button></div></div>
   <div class="card"><h2>Subjects</h2>${subList||'<span class="small">none</span>'}<div class="row" style="margin-top:8px"><input id="nsub" placeholder="New subject"><button onclick="add('subjects','nsub')">+ Add</button></div></div>
   <div class="card"><h2>Rooms</h2>${roomList||'<span class="small">none</span>'}<div class="row" style="margin-top:8px"><input id="nroom" placeholder="Room name"><input id="ncap" type="number" style="width:70px" placeholder="cap"><button onclick="addRoom()">+ Add</button></div></div>
   <div class="card"><h2>Teachers</h2><div class="desc">Name, qualification, main subject, teachable subjects &amp; weekly period load. Bulk-add many at once from the <b>Import / Export</b> tab.</div>${tchList||'<span class="small">none</span>'}<div class="row" style="margin-top:8px"><input id="ntch" placeholder="New teacher name"><button onclick="addTeacher()">+ Add</button></div></div>
   <div class="card"><h2>Chapters (per subject)</h2><div class="desc">Chapters show as a <b>pulldown</b> while filling the Teacher's Diary — fast &amp; consistent.</div>
     <div class="row" style="margin-bottom:8px"><select onchange="setupSubj=+this.value;render()">${subjects.map(s=>`<option value="${s.id}" ${s.id===(setupSubj||(subjects[0]||{}).id)?'selected':''}>${s.name}</option>`).join('')}</select></div>
     ${(()=>{const sid=setupSubj||(subjects[0]||{}).id;const list=chaptersForSubject(sid);return list.length?list.map(c=>`<div class="listrow"><input value="${c.name.replace(/"/g,'&quot;')}" disabled><button class="ghost mini red" onclick="delChapter(${c.id})">✕</button></div>`).join(''):'<span class="small">No chapters yet.</span>';})()}
     <div class="row" style="margin-top:8px"><input id="nchap" placeholder="New chapter name"><button onclick="addChapter()">+ Add</button></div></div></div>`;
}
async function add(route,inp){const v=document.getElementById(inp).value.trim();if(!v)return;await api('POST','/api/'+route,{name:v});toast();await loadAll();}
async function addRoom(){const v=document.getElementById('nroom').value.trim();if(!v)return;await api('POST','/api/rooms',{name:v,capacity:+document.getElementById('ncap').value||null});toast();await loadAll();}
async function upd(route,id,body){await api('PUT','/api/'+route+'/'+id,body);toast();await loadAll();}
async function del(route,id){await api('DELETE','/api/'+route+'/'+id);toast();await loadAll();}
async function addTeacher(){const v=document.getElementById('ntch').value.trim();if(!v)return;await api('POST','/api/teachers',{name:v,subjects:[]});toast();await loadAll();}
async function updTeacher(id,body){await api('PUT','/api/teachers/'+id,body);toast();await loadAll();}
async function delTeacher(id){await api('DELETE','/api/teachers/'+id);toast();await loadAll();}
async function toggleSub(tid,sid,on){const t=teachers.find(x=>x.id===tid);const subs=new Set(t.subjects);on?subs.add(sid):subs.delete(sid);await api('PUT','/api/teachers/'+tid,{subjects:[...subs]});toast();await loadAll();}
let setupSubj=null;
async function addChapter(){const sid=setupSubj||(subjects[0]||{}).id;const el=document.getElementById('nchap');const v=(el.value||'').trim();if(!v||!sid)return;await api('POST','/api/chapters',{subject_id:sid,name:v});toast();await loadAll();}
async function delChapter(id){await api('DELETE','/api/chapters/'+id);toast();await loadAll();}

// ---------- HOURS ----------
function hours(){const wd=slotsFor(0);return `<div class="card"><h2>Academic Hours <span class="tag">Configuration</span></h2>
   <div class="desc">Period slots are generated from this and saved to DB.</div>
   <div class="row" style="margin-bottom:14px"><div style="flex:1;min-width:280px"><label>School name (shown on diary &amp; reports)</label><input style="width:100%" value="${(config.school_name||'').replace(/"/g,'&quot;')}" onchange="cfg('school_name',this.value)"></div></div>
   <div class="row" style="margin-bottom:14px">
     <div><label>Weekday start</label><input type="time" value="${config.weekday_start}" onchange="cfg('weekday_start',this.value)"></div>
     <div><label>Weekday end</label><input type="time" value="${config.weekday_end}" onchange="cfg('weekday_end',this.value)"></div>
     <div><label>Saturday end</label><input type="time" value="${config.saturday_end}" onchange="cfg('saturday_end',this.value)"></div>
     <div><label>Period (min)</label><input type="number" value="${config.period_minutes}" style="width:80px" onchange="cfg('period_minutes',+this.value)"></div>
     <div><label>Break after period</label><input type="number" value="${config.break_after_period}" style="width:80px" onchange="cfg('break_after_period',+this.value)"></div>
     <div><label>Break (min)</label><input type="number" value="${config.break_minutes}" style="width:80px" onchange="cfg('break_minutes',+this.value)"></div></div>
   <div class="hours-row"><div><b>Weekdays</b><br><span class="small">${wd.filter(s=>!s.brk).length} periods · ${config.period_minutes} min</span></div><div><b>${config.weekday_start} – ${config.weekday_end}</b></div></div>
   <div class="hours-row sat"><div><b>Saturdays</b><br><span class="small">${slotsFor(5).filter(s=>!s.brk).length} periods</span></div><div><b>${config.weekday_start} – ${config.saturday_end}</b></div></div>
   <div style="margin-top:10px"><b class="small">Weekday slots:</b><br>${wd.map(s=>`<span class="tag">${s.brk?'☕ Break':s.label} ${s.start}-${s.end}</span>`).join("")}</div></div>`;}
async function cfg(k,v){config[k]=v;await api('PUT','/api/timetable/config',config);toast();render();}

// ---------- BUILDER (with rooms) ----------
function builder(){const di=buildDay,slots=slotsFor(di);
  let head=`<th>Class \\ Period</th>`+slots.map(s=>`<th>${s.brk?'☕':s.label}<br><span style="font-weight:400;font-size:10px">${s.start}-${s.end}</span></th>`).join("");
  let rows=classes.map(c=>{let pi=0,cells=`<td class="ph">${c.name}</td>`;
    slots.forEach(sl=>{if(sl.brk){cells+=`<td style="background:#fff7e6">☕</td>`;return;}
      const cc=cell(c.id,di,pi),conf=conflictAt(c.id,di,pi);
      const sopt=`<option value="">— free —</option>`+subjects.map(s=>`<option value="${s.id}" ${cc&&cc.subject_id===s.id?'selected':''}>${s.name}</option>`).join("");
      const tl=cc&&cc.subject_id?tForSub(cc.subject_id):teachers;
      const topt=`<option value="">teacher…</option>`+tl.map(t=>`<option value="${t.id}" ${cc&&cc.teacher_id===t.id?'selected':''}>${t.name}</option>`).join("");
      const ropt=`<option value="">room…</option>`+rooms.map(r=>`<option value="${r.id}" ${cc&&cc.room_id===r.id?'selected':''}>${r.name}</option>`).join("");
      cells+=`<td class="cell ${conf?'conflict':''}"><select onchange="setSub_(${c.id},${di},${pi},this.value)">${sopt}</select>

let diaryDate=null, diaryEntries=[], diaryMode='entry', diaryClass='';
const DFIELDS=[['lesson','Lesson'],['topic','Topic'],['learning_outcome','Learning Outcome'],['assessment_lo','Assessment of LO (Strategies)'],['homework','Home Work'],['teaching_aids','Teaching Aids used']];
function dowFromDate(d){ return (new Date(d+'T00:00:00').getDay()+6)%7; }
function longDate(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function diaryView(){ if(!diaryDate)diaryDate=new Date().toISOString().slice(0,10);

   <div class="row" style="margin-bottom:12px">
     <div><label>Teacher</label><select onchange="curTeacher=+this.value;loadDiary()">${teachers.map(t=>`<option value="${t.id}" ${t.id===curTeacher?'selected':''}>${t.name}</option>`).join('')}</select></div>
     <div><label>Day</label><select onchange="diaryDate=dateForDay(+this.value);loadDiary()">${DAYS.map((d,i)=>`<option value="${i}" ${i===dowFromDate(diaryDate)?'selected':''}>${d}</option>`).join('')}</select></div>

   </div>
   <div id="diarybody">Loading…</div></div>`;
}
const chaptersForSubject=sid=>chaptersAll.filter(c=>c.subject_id===sid);
function dateForDay(dow){ const d=new Date(diaryDate+'T00:00:00'); const cur=(d.getDay()+6)%7; d.setDate(d.getDate()-cur+dow); return d.toISOString().slice(0,10); }

function onSubjChange(selEl){ const card=selEl.closest('.card'); const sid=+selEl.value; card.querySelectorAll('input[data-listsub]').forEach(inp=>inp.setAttribute('list','chap_'+sid)); }
function chapDatalists(){ return subjects.map(s=>`<datalist id="chap_${s.id}">${chaptersForSubject(s.id).map(c=>`<option value="${c.name.replace(/"/g,'&quot;')}">`).join('')}</datalist>`).join(''); }

  if(diaryMode==='report'){ box.innerHTML=diaryReport(dow); return; }

     ${rows.length?`<table><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td style="text-align:left;vertical-align:top">${cellFor(r,c[0])}</td>`).join('')}</tr>`).join('')}</table>`
       :'<div class="note">No diary entries for this date yet. Use “Fill entries”.</div>'}
   </div>`;
}
async function delDiary(id){ await api('DELETE','/api/diary/'+id); toast(); loadDiary(); }

// ---------- SUBSTITUTION ----------
function subView(){return `<div class="card"><h2>Substitution / Cover</h2><div class="desc">Pick a day. Any period whose teacher is absent shows here — assign a free teacher to cover.</div>
   <div class="row" style="margin-bottom:12px"><div><label>Day</label><select onchange="subDay=+this.value;loadCover()">${DAYS.map((d,i)=>`<option value="${i}" ${i===subDay?'selected':''}>${d}</option>`).join("")}</select></div>
     <span class="small">Mark teachers absent in the Teacher tab first.</span></div>
   <div id="coverbox">Loading…</div></div>`;}
async function loadCover(){const box=document.getElementById('coverbox');if(!box)return;cover=await api('GET','/api/timetable/cover?day='+subDay);
  if(!cover.need.length){box.innerHTML='<div class="note">No periods need cover on '+DAYS[subDay]+' — no absent teachers, or all covered. 👍</div>';return;}
  box.innerHTML=`<table><tr><th>Class</th><th>Period</th><th>Subject</th><th>Absent teacher</th><th>Assign proxy</th></tr>${
    cover.need.map(n=>`<tr><td>${(classes.find(c=>c.id===n.class_id)||{}).name}</td><td>P${n.period_index+1}</td><td>${n.subj}</td>
      <td><span class="pill proxy">${tName(n.teacher_id)}</span></td>
      <td><select onchange="assignProxy(${n.class_id},${n.period_index},this.value)"><option value="">— pick free teacher —</option>${n.free.map(f=>`<option value="${f.id}" ${n.proxy_teacher_id===f.id?'selected':''}>${f.name}</option>`).join('')}</select></td></tr>`).join('')}</table>
    <div class="small" style="margin-top:8px">Assigned proxies show up in Live Monitor as <span class="pill proxy">Proxy: name</span>.</div>`;}
async function assignProxy(class_id,period,v){await api('POST','/api/timetable/substitute',{day:subDay,class_id,period,proxy_teacher_id:v===''?null:+v});toast();loadCover();}

// ---------- LIVE MONITOR ----------
function monitor(){return `<div class="card"><h2>Live Classroom Monitor</h2>
   <div class="desc">Real-time status of every classroom (server-computed). Assigned proxies are shown.</div>
   <div class="row" style="margin-bottom:6px">
     <div><label>Simulate day</label><select id="mday" onchange="monDay=this.value===''?null:+this.value;refreshMonitor()"><option value="">(now)</option>${DAYS.map((d,i)=>`<option value="${i}" ${monDay===i?'selected':''}>${d}</option>`).join("")}</select></div>
     <div><label>Simulate time</label><input type="time" id="mtime" value="${monTime||''}" onchange="monTime=this.value;refreshMonitor()"></div>
     <button class="ghost" onclick="monDay=null;monTime=null;refreshMonitor()">Use real time</button></div>
   <div class="legend"><span><span class="pill live">LIVE</span> running</span><span><span class="pill break">BREAK</span></span><span><span class="pill idle">IDLE</span></span><span><span class="pill proxy">PROXY</span> absent/covered</span></div>
   <div class="mon-grid" id="mongrid">Loading…</div></div>`;}
async function refreshMonitor(){const g=document.getElementById('mongrid');if(!g)return;let u='/api/timetable/monitor';if(monDay!=null&&monTime)u+=`?day=${monDay}&time=${monTime}`;const d=await api('GET',u);
  g.innerHTML=d.classes.map(c=>`<div class="mon ${c.status}"><div class="cn">${c.name}</div><div><span class="pill ${c.status}">${c.status.toUpperCase()}</span></div><div class="info">${c.text}</div></div>`).join("");}

// ---------- ABOUT ----------
function about(){return `<div class="card"><h2>About this module</h2>
   <div class="desc">A complete, runnable Timetable module — Node + Express + SQLite. Every change persists.</div>
   <div class="feat">
    <div><b>Setup / Manage</b><br><span class="small">CRUD classes, subjects, teachers (+subjects), rooms.</span></div>
    <div><b>Academic Hours</b><br><span class="small">Times + period/break → auto slots.</span></div>
    <div><b>Builder</b><br><span class="small">Subject + teacher + room per cell, saved instantly.</span></div>
    <div><b>Conflict management</b><br><span class="small">Teacher AND room clashes flagged.</span></div>
    <div><b>Auto-generate</b><br><span class="small">Quota-aware, room-aware, avoids clashes.</span></div>
    <div><b>Class / Teacher / School views</b><br><span class="small">Print/PDF each.</span></div>
    <div><b>Substitution</b><br><span class="small">Absent teacher → assign a free proxy.</span></div>
    <div><b>Live Monitor</b><br><span class="small">LIVE/BREAK/IDLE/PROXY, server-computed.</span></div></div>
   <div class="note" style="margin-top:14px"><b>API:</b> /api/timetable/* , /api/classes|subjects|teachers|rooms · <b>DB:</b> timetable.db. See README to integrate into Aumtara.</div></div>`;}

loadAll();
</script>

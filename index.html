 hi:{
  getstarted:{title:"शुरुआत और साइन-इन",who:"सभी",where:"लॉगिन स्क्रीन",intro:"साइन-इन कैसे करें, स्कूल कैसे बनाएँ, और अपनी भूमिका के अनुसार आप क्या कर सकते हैं।",steps:["ऐप लिंक खोलें, अपना लॉगिन ID (यूज़रनेम, ईमेल या मोबाइल) और पासवर्ड डालें, फिर साइन-इन करें।","नया स्कूल? लॉगिन स्क्रीन पर Create a school account दबाएँ, स्कूल का नाम, बोर्ड और अपनी जानकारी भरें — आप उसके एडमिन बन जाते हैं।","आपकी भूमिका तय करती है कि क्या दिखे: मास्टर (सब कुछ, सभी स्कूल), एडमिन (पूरा सेटअप + टाइमटेबल), प्रिंसिपल/सुपरवाइज़र (देखना + रोज़ के काम), शिक्षक (अपना टाइमटेबल, डायरी, छुट्टी)।","☰ बटन (ऊपर-बाएँ) से साइडबार दिखाएँ/छुपाएँ। स्क्रीनें Master, Timetable, Daily और Admin में बँटी हैं।"],tip:"कहाँ है पता नहीं? किसी भी स्क्रीन पर ऊपर पीला ? दबाएँ — वह उसी स्क्रीन की गाइड पर ले जाता है।"},
  schools:{title:"स्कूल और स्विच करना",who:"मास्टर / एडमिन",where:"ऊपर की पट्टी का स्विचर · Admin → Schools",intro:"एक लॉगिन से कई स्कूल चलाएँ; हर स्कूल का अपना डेटा, टाइमटेबल और सेटिंग्स रहती हैं।",steps:["ऊपर की पट्टी में स्कूल ड्रॉपडाउन से चुनें कि आप किस स्कूल पर काम कर रहे हैं।","Admin → Schools: नया स्कूल जोड़ें (नाम, बोर्ड, माध्यम) या स्कूल का लोगो अपलोड करें।","हर स्क्रीन सिर्फ़ चुने हुए स्कूल का ही डेटा दिखाती और बदलती है।"],tip:"कोई संख्या गलत लगे तो पहले ऊपर देख लें कि आप सही स्कूल पर हैं।"},
  classes:{title:"कक्षाएँ",who:"एडमिन",where:"Master → Classes",intro:"आपकी कक्षाओं/सेक्शन की सूची — स्टैंडर्ड, सेक्शन, माध्यम, बोर्ड और वैकल्पिक क्लास-टीचर के साथ।",steps:["＋ Add दबाकर फॉर्म खोलें; कक्षा का नाम (जैसे 5-A), स्टैंडर्ड, सेक्शन, माध्यम, बोर्ड भरें और क्लास-टीचर चुनें, फिर Save करें।","सूची में किसी भी कक्षा को सीधे बदलें। ✕ से कक्षा हटती है।","ऊपर के Board/Medium/Standard/Section फ़िल्टर से सूची छाँटें; संख्या बताती है कितनी मैच हुईं। 🔄 डेटा ताज़ा करता है।","कक्षाएँ प्राकृतिक क्रम में — 1A…8A, फिर 1B…8B।"],tip:"अगर स्टैंडर्ड/सेक्शन खाली हों तो फ़िल्टर उन्हें कक्षा के नाम से अपने-आप पढ़ लेता है।"},
  subjects:{title:"विषय",who:"एडमिन",where:"Master → Subjects",intro:"आपके विषय। जो शेड्यूल नहीं कर रहे उन्हें निष्क्रिय करें, माध्यम लगाएँ, और लैब विषयों को डबल-पीरियड चिह्नित करें।",steps:["＋ Add → विषय का नाम, वैकल्पिक माध्यम, Active टिक करें, और Double टिक करें अगर लगातार दो पीरियड में शेड्यूल करना है। Save।","हटाए बिना संग्रह करने के लिए Active हटाएँ।","दो माध्यम हों तो ऊपर एक Medium ड्रॉपडाउन आता है जो एक बार में एक ही माध्यम दिखाता है (सब देखने को All mediums चुनें)।"],tip:"एक ही विषय दो बार दिखे (जैसे दो PT)? ⚠ Remove duplicates से सुरक्षित रूप से मिला दें — नीचे Data Cleanup देखें।"},
  teachers:{title:"शिक्षक",who:"एडमिन",where:"Master → Teachers",intro:"हर शिक्षक की योग्यता, मुख्य विषय, वे कौन-से विषय पढ़ा सकते हैं, साप्ताहिक लोड और रोज़ की सीमाएँ।",steps:["＋ Add से पूरा फॉर्म खुलता है: नाम (ज़रूरी), योग्यता, मुख्य विषय, साप्ताहिक लोड, प्रति दिन अधिकतम पीरियड, लगातार अधिकतम, can-substitute, और वे विषय टिक करें जो पढ़ा सकते हैं। Save।","हर पंक्ति में शिक्षक की सारी सेटिंग एक ही लाइन में; can-teach ड्रॉपडाउन विषय जोड़ता है, चिप पर ✕ हटाता है।","साप्ताहिक लोड = हफ़्ते में कितने पीरियड मिलें; प्रति दिन व लगातार सीमाएँ दिन को संतुलित रखती हैं।"],tip:"can-substitute टिक तय करता है कि अनुपस्थिति पर यह शिक्षक प्रॉक्सी के रूप में सुझाया जाए या नहीं।"},
  rooms:{title:"कमरे",who:"एडमिन",where:"Master → Rooms",intro:"कमरे/लैब, वैकल्पिक क्षमता के साथ।",steps:["＋ Add → कमरे का नाम और क्षमता → Save।","किसी पीरियड को कमरा देते समय और कमरा-क्लैश जाँच में कमरे काम आते हैं।"],tip:"डुप्लिकेट कमरे भी ⚠ Remove duplicates से मिलाए जा सकते हैं।"},
  hours:{title:"स्कूल समय और सत्र",who:"एडमिन",where:"Master → Academic Hours",intro:"रोज़ का समय — शुरू/अंत, पीरियड की अवधि, ब्रेक, लंच, पीरियड की संख्या — अलग शनिवार समय, साथ ही सत्र, लेबल और शेड्यूल प्रकार।",steps:["कार्यदिवस, दिन का शुरू व अंत, पीरियड अवधि, लंच (किस पीरियड के बाद + मिनट) और छोटे ब्रेक सेट करें। शनिवार अलग हो तो उसका समय जोड़ें।","प्रति दिन पीरियड की संख्या सेट करें (कार्यदिवस और शनिवार)।","सत्र: एक सत्र जोड़ें और एक को सक्रिय करें। लेबल: Class/Teacher/Room/Subject को अपने शब्दों में बदलें।","शेड्यूल प्रकार: सिंगल वीक, मल्टी-वीक (Week A/B…) या डे रोटेशन (Day A/B/C…)।"],tip:"समय 24-घंटे में — 2:30 PM को 14:30 लिखें, वरना दिन एक पीरियड बाद रुक जाएगा।"},
  quota:{title:"साप्ताहिक कोटा और नियम",who:"एडमिन",where:"Master → Weekly Quota",intro:"हर कक्षा में हर विषय को हफ़्ते में कितने पीरियड मिलें, और प्लेसमेंट नियम।",steps:["हर कक्षा के लिए, हर विषय की प्रति-सप्ताह संख्या भरें।","नियम जोड़ें: दो विषय एक ही दिन न हों, या कभी लगातार न हों।"],tip:"Auto-generate ठीक यही साप्ताहिक संख्याएँ, आपके नियमों के साथ भरता है।"},
  availability:{title:"उपलब्धता",who:"एडमिन",where:"Master → Availability",intro:"किसी शिक्षक, कक्षा या कमरे को कुछ पीरियड के लिए रोकें ताकि तब कुछ शेड्यूल न हो।",steps:["शिक्षक/कक्षा/कमरा चुनें, फिर उस दिन+पीरियड को रोकने/खोलने के लिए सेल टैप करें।"],tip:"Auto-generate इन रोकों का पालन करता है और तोड़ने पर क्लैश दिखाता है।"},
  students:{title:"विद्यार्थी और वैकल्पिक",who:"एडमिन",where:"Master → Students",intro:"विद्यार्थियों को संभालें और कक्षा को वैकल्पिक समूहों में बाँटें, हर समूह का अपना विषय/शिक्षक/कमरा।",steps:["कक्षा में विद्यार्थी जोड़ें।","कक्षा के लिए एक elective + उसके समूह विकल्प जोड़ें (हर विकल्प = विषय/शिक्षक/कमरा); विद्यार्थियों को विकल्पों में डालें।"],tip:"वैकल्पिक/समानांतर समूह फिर कक्षा ग्रिड में ही दिखते हैं।"},
  build:{title:"टाइमटेबल बनाएँ",who:"एडमिन",where:"Timetable → Auto Set",intro:"टाइमटेबल हाथ से या एक क्लिक में बनाएँ — locked, double और combined पीरियड के साथ।",steps:["Auto Set: एक दिन चुनें, फिर हर सेल का विषय, शिक्षक और कमरा हाथ से भरें। क्लैश लाल में दिखते हैं।","Auto-generate: सेटअप पूरा होने पर Auto-generate दबाएँ — कोटा, नियम और उपलब्धता का पालन करता क्लैश-मुक्त टाइमटेबल।","🔒 किसी तय गतिविधि (Assembly/PT/Library) को लॉक करें ताकि Auto-generate उसे रखे और उसके आसपास शेड्यूल करे।","Combined classes: कई कक्षाओं को एक साथ एक सत्र में पढ़ाएँ (Games/Assembly) — विषय/शिक्षक/कमरा + दिन/पीरियड चुनें और 2+ कक्षाएँ टिक करें।","किसी सेल की पकड़ को दूसरी सेल पर खींचकर दो पीरियड बदलें/स्वैप करें।"],tip:"Double चिह्नित लैब विषय एक ही शिक्षक व कमरे के साथ लगातार दो पीरियड में लगते हैं।"},
  optimizer:{title:"ऑप्टिमाइज़र",who:"एडमिन",where:"Timetable → Optimizer",intro:"नरम प्राथमिकताएँ जो अगली बार Auto-generate पर बेहतर टाइमटेबल बनाती हैं।",steps:["प्राथमिकताएँ टिक करें: विषय हफ़्ते भर फैलाएँ, हर शिक्षक का लोड संतुलित करें, भारी विषय पहले रखें, शिक्षक के खाली पीरियड घटाएँ।","Deep optimise टिक करें ताकि हर दिन के अंदर पीरियड फिर से जमाकर खाली अंतराल घटें — बिना क्लैश बनाए।"],tip:"ऑप्टिमाइज़र सेटिंग अगली बार Auto-generate पर लागू होती हैं।"},
  rotation:{title:"मल्टी-वीक और डे रोटेशन",who:"एडमिन",where:"Academic Hours → Schedule type",intro:"हर हफ़्ते या हर रोटेशन-दिन का अलग प्लान।",steps:["मल्टी-वीक: Weekly plans और हफ़्तों की संख्या चुनें (Week A/B/C/D)। हर हफ़्ता अलग हो सकता है।","डे रोटेशन: Daily rotation और दिनों की संख्या चुनें (Day A/B/C)।","रोटेशन कैलेंडर एक आरंभ तिथि से आज कौन-सा Week/Day सक्रिय है, बताता है।"],tip:"Class और Teacher व्यू में हर चक्र देखने को Week/Day स्विचर है।"},
  views:{title:"कक्षा/शिक्षक/स्कूल व्यू",who:"सभी",where:"Timetable → Class / Teacher / School View",intro:"टाइमटेबल कक्षा, शिक्षक या पूरे स्कूल के अनुसार देखें और साझा करें।",steps:["Class व्यू: कक्षा चुनें; Print, Excel में निर्यात, या केवल-पढ़ने का Share link लें।","Teacher व्यू: शिक्षक चुनकर उसका हफ़्ता और कुल लोड देखें।","School व्यू: दिन चुनकर सभी कक्षाएँ एक साथ देखें।","Print all से सारी कक्षाएँ/शिक्षक एक साथ प्रिंट — फिर ब्राउज़र से Save as PDF।"],tip:"Share link बिना लॉगिन टाइमटेबल खोलता है — अभिभावकों के लिए उपयोगी।"},
  insights:{title:"इनसाइट्स डैशबोर्ड",who:"एडमिन",where:"Timetable → Insights",intro:"आपके टाइमटेबल के बारे में KPI और चार्ट का डैशबोर्ड।",steps:["KPI टाइल (कक्षाएँ, विषय, शिक्षक, पूर्णता) साथ ही period-load हीटमैप और teacher-workload, subject-coverage व room-utilisation चार्ट देखें।","किसी भी KPI टाइल पर टैप करके सीधे उस व्यू पर जाएँ।"],tip:"अधिक भार वाले शिक्षक या कम उपयोग वाले कमरे पहचानने में उपयोगी।"},
  substitution:{title:"स्थानापन्न, प्रॉक्सी और छुट्टी",who:"एडमिन / शिक्षक",where:"Daily → Substitution",intro:"अनुपस्थित शिक्षक की जगह तारीख या रेंज पर प्रॉक्सी लगाएँ, साथ ही छुट्टी-स्वीकृति प्रक्रिया।",steps:["अनुपस्थित शिक्षक और तारीख़ चुनें, फिर हर पीरियड के लिए एक खाली शिक्षक को प्रॉक्सी लगाएँ।","शिक्षक छुट्टी के लिए आवेदन कर सकते हैं; एडमिन स्वीकृत करता है और प्रॉक्सी पंक्तियाँ अपने-आप बन जाती हैं।"],tip:"सिर्फ़ can-substitute चिह्नित शिक्षक ही प्रॉक्सी के रूप में सुझाए जाते हैं।"},
  liveclass:{title:"लाइव क्लास",who:"सभी",where:"Daily → Live Class",intro:"आज की लाइव स्थिति — अभी कौन पढ़ा रहा है, प्रॉक्सी और खाली पीरियड।",steps:["खोलें और सभी कक्षाओं का मौजूदा पीरियड देखें, आज की प्रॉक्सी और खाली स्लॉट सहित।"],tip:"ऑफ़िस के लिए पूरे स्कूल की एक झलक देखने में बढ़िया।"},
  diary:{title:"शिक्षक डायरी और अध्याय",who:"शिक्षक",where:"Daily → Teacher Diary",intro:"हर शिक्षक की दैनिक व मासिक शिक्षण पंजिका, साथ ही अध्याय।",steps:["शिक्षक और तारीख़ चुनें; पाठ, विषयवस्तु, गृहकार्य आदि भरें।","अध्याय: विषय चुनकर उसके अध्याय दर्ज करें ताकि पाठ्यक्रम ट्रैक हो।","दैनिक प्रविष्टि और मासिक पंजिका व्यू के बीच स्विच करें।"],tip:"शिक्षक लॉगिन केवल अपनी डायरी देखता है।"},
  notifications:{title:"सूचनाएँ",who:"सभी",where:"Daily → Notifications",intro:"आपके डिवाइस पर पुश अलर्ट और स्कूल-भर की घोषणाएँ।",steps:["पुश अलर्ट पाने को अपने डिवाइस पर Enable notifications दबाएँ।","एडमिन सबको एक घोषणा भेज सकते हैं।"],tip:"एक बार चालू होने पर फ़ोन और लैपटॉप दोनों पर काम करता है।"},
  reports:{title:"रिपोर्ट्स",who:"एडमिन",where:"Timetable → Reports",intro:"तैयार Excel रिपोर्ट, साथ ही अपना टेम्पलेट भरें और किसी भी Excel को सुंदर बनाएँ।",steps:["रिपोर्ट चुनें (class workload, subject coverage, room use, teacher free periods, period load, diary) — Excel में डाउनलोड होती है।","या अपना Excel टेम्पलेट प्लेसहोल्डर के साथ अपलोड करके स्कूल डेटा से भरें, या किसी डेटा फ़ाइल को सुंदर बनाएँ।"],tip:"टेम्पलेट में एक पंक्ति {{rows:teachers}} मार्कर और {{field}} टोकन से दोहराई जाती है।"},
  versions:{title:"टाइमटेबल सेव (वर्ज़न)",who:"एडमिन",where:"Timetable → Save Timetable",intro:"टाइमटेबल की नामित प्रतियाँ सेव करें और बाद में कोई भी वापस लाएँ।",steps:["एक नामित वर्ज़न सेव करें (मौजूदा टाइमटेबल + सेटिंग का स्नैपशॉट)।","Restore किसी भी समय सहेजा वर्ज़न वापस लाता है।"],tip:"बड़े बदलाव से पहले वर्ज़न सेव करें ताकि वापस लौट सकें।"},
  data:{title:"आयात / निर्यात",who:"एडमिन",where:"Admin → Import / Export",intro:"अपना सेटअप Excel से बल्क-लोड करें, और टाइमटेबल व सेटअप Excel में निर्यात करें।",steps:["सेटअप टेम्पलेट डाउनलोड करें, Classes/Subjects/Rooms/Teachers/Chapters शीट भरें, फिर अपलोड करके आयात करें।","टाइमटेबल या सेटअप किसी भी समय Excel में निर्यात करें।"],tip:"आयातक केवल नए नाम जोड़ता है — दो बार चलाने पर डुप्लिकेट नहीं बनते।"},
  cleanup:{title:"डेटा सफ़ाई और डुप्लिकेट हटाना",who:"एडमिन",where:"Admin → Import / Export → Data Cleanup · और हर Master टैब पर ⚠ Remove duplicates",intro:"किसी फ़ील्ड, सेक्शन या पूरी सूची को साफ़ करके गलती सुधारें — या डुप्लिकेट पंक्तियाँ मिलाएँ।",steps:["Remove duplicates: Subjects/Classes/Teachers/Rooms पर पीला ⚠ Remove duplicates (N) बटन एक ही नाम की पंक्तियाँ मिला देता है, टाइमटेबल सुरक्षित रखते हुए।","Data Cleanup: कोई फ़ील्ड (जैसे Teachers → Qualification), सेक्शन (Timetable, Quota…) या पूरी सूची चुनें, I-understand बॉक्स टिक करें, फिर Clear। एक Yes/No बॉक्स पुष्टि करता है।","Full reset: स्कूल का सारा डेटा मिटाने को बॉक्स टिक करें, स्कूल का सही नाम टाइप करें, फिर Yes दबाएँ।"],tip:"स्कूल, उसकी सेटिंग और लॉगिन हमेशा रहते हैं — सिर्फ़ चुना डेटा साफ़ होता है, और वापस नहीं आता।"},
  users:{title:"उपयोगकर्ता और भूमिकाएँ",who:"एडमिन",where:"Admin → Users",intro:"अपने स्टाफ़ के लॉगिन जोड़ें और हर एक की भूमिका तय करें।",steps:["उपयोगकर्ता जोड़ें, भूमिका चुनें (Admin/Principal/Supervisor/Teacher), और उनका लॉगिन ID साझा करें।","भूमिकाएँ तय करती हैं कि हर व्यक्ति कौन-सी स्क्रीन खोल सकता है।"],tip:"शिक्षक उपयोगकर्ता का नाम सूची के शिक्षक से मेल खाना चाहिए ताकि डायरी व छुट्टी जुड़ें।"},
  platform:{title:"भाषा, इंस्टॉल और ऑफ़लाइन",who:"सभी",where:"ऊपर की भाषा-सूची · आपका ब्राउज़र",intro:"ऐप अपनी भाषा में इस्तेमाल करें, इंस्टॉल करें, और ऑफ़लाइन काम करें।",steps:["ऊपर की ड्रॉपडाउन से अपनी भाषा चुनें (12 भाषाएँ)।","इंस्टॉल: ब्राउज़र/फ़ोन के Add to Home Screen से ऐप इंस्टॉल करें।","इंस्टॉल के बाद देखने के लिए ऑफ़लाइन भी चलता है।"],tip:"अब कोई भी असफल क्रिया ऊपर लाल पट्टी में कारण के साथ दिखती है।"}

 gu:{
  getstarted:{title:"શરૂઆત અને સાઇન-ઇન",who:"બધા",where:"લૉગિન સ્ક્રીન",intro:"સાઇન-ઇન કેવી રીતે કરવું, શાળા કેવી રીતે બનાવવી, અને તમારી ભૂમિકા પ્રમાણે તમે શું કરી શકો.",steps:["ઍપ લિંક ખોલો, તમારો લૉગિન ID (યુઝરનેમ, ઈમેલ કે મોબાઈલ) અને પાસવર્ડ નાખો, પછી સાઇન-ઇન કરો.","નવી શાળા? લૉગિન સ્ક્રીન પર Create a school account દબાવો, શાળાનું નામ, બોર્ડ અને તમારી વિગત ભરો — તમે તેના એડમિન બનો છો.","તમારી ભૂમિકા નક્કી કરે છે શું દેખાય: માસ્ટર (બધું, બધી શાળા), એડમિન (પૂરો સેટઅપ + ટાઈમટેબલ), પ્રિન્સિપાલ/સુપરવાઈઝર (જોવું + રોજનું), શિક્ષક (પોતાનું ટાઈમટેબલ, ડાયરી, રજા).","☰ બટન (ઉપર-ડાબે) થી સાઇડબાર બતાવો/છુપાવો. સ્ક્રીનો Master, Timetable, Daily અને Admin માં વહેંચાયેલી છે."],tip:"ક્યાં છે ખબર નથી? કોઈપણ સ્ક્રીન પર ઉપર પીળા ? દબાવો — તે એ જ સ્ક્રીનની ગાઈડ પર લઈ જાય છે."},
  schools:{title:"શાળાઓ અને સ્વિચ કરવું",who:"માસ્ટર / એડમિન",where:"ઉપરની પટ્ટીનો સ્વિચર · Admin → Schools",intro:"એક લૉગિનથી ઘણી શાળા ચલાવો; દરેક શાળાનો પોતાનો ડેટા, ટાઈમટેબલ અને સેટિંગ રહે છે.",steps:["ઉપરની પટ્ટીના શાળા ડ્રૉપડાઉનથી પસંદ કરો કે તમે કઈ શાળા પર કામ કરી રહ્યા છો.","Admin → Schools: નવી શાળા ઉમેરો — નામ, બોર્ડ, માધ્યમ, સાથે સરનામું, શાળા કોડ, મોબાઇલ અને ઈમેલ. આ creation વખતે જ સચવાય અને રિપોર્ટ હેડરમાં વપરાય.","લોગો અપલોડ કરો, અને શાળાને delete ને બદલે Active/Inactive કરો.","દરેક સ્ક્રીન માત્ર પસંદ કરેલી શાળાનો જ ડેટા બતાવે અને બદલે છે."],tip:"કોઈ સંખ્યા ખોટી લાગે તો પહેલા ઉપર જોઈ લો કે તમે સાચી શાળા પર છો."},
  classes:{title:"વર્ગો",who:"એડમિન",where:"Master → Classes",intro:"તમારા વર્ગો/વિભાગની યાદી — સ્ટાન્ડર્ડ, વિભાગ, માધ્યમ, બોર્ડ અને વૈકલ્પિક ક્લાસ-ટીચર સાથે.",steps:["＋ Add દબાવીને ફૉર્મ ખોલો; વર્ગનું નામ (દા.ત. 5-A), સ્ટાન્ડર્ડ, વિભાગ, માધ્યમ, બોર્ડ ભરો અને ક્લાસ-ટીચર પસંદ કરો, પછી Save.","યાદીમાં કોઈપણ વર્ગ સીધો બદલો. ✕ થી વર્ગ કાઢો.","ઉપરના Board/Medium/Standard/Section ફિલ્ટરથી યાદી ગાળો; સંખ્યા બતાવે કેટલા મેચ થયા. 🔄 ડેટા તાજું કરે.","વર્ગો કુદરતી ક્રમમાં — 1A…8A, પછી 1B…8B."],tip:"જો સ્ટાન્ડર્ડ/વિભાગ ખાલી હોય તો ફિલ્ટર તેને વર્ગના નામથી આપોઆપ વાંચી લે છે."},
  subjects:{title:"વિષયો",who:"એડમિન",where:"Master → Subjects",intro:"તમારા વિષયો. જે શેડ્યૂલ નથી કરતા તેને નિષ્ક્રિય કરો, માધ્યમ લગાવો, અને લેબ વિષયોને ડબલ-પિરિયડ ચિહ્નિત કરો.",steps:["＋ Add → વિષયનું નામ, વૈકલ્પિક માધ્યમ, Active ટિક કરો, અને Double ટિક કરો જો સળંગ બે પિરિયડમાં શેડ્યૂલ કરવું હોય. Save.","કાઢ્યા વગર આર્કાઈવ કરવા Active કાઢો.","બે માધ્યમ હોય તો ઉપર એક Medium ડ્રૉપડાઉન આવે જે એક વખતે એક જ માધ્યમ બતાવે (બધા જોવા All mediums પસંદ કરો)."],tip:"એક જ વિષય બે વાર દેખાય (દા.ત. બે PT)? ⚠ Remove duplicates થી સુરક્ષિત રીતે ભેગા કરો — નીચે Data Cleanup જુઓ."},
  teachers:{title:"શિક્ષકો",who:"એડમિન",where:"Master → Teachers",intro:"દરેક શિક્ષકની લાયકાત, હોદ્દો, મુખ્ય વિષય, તેઓ ભણાવી શકે તે વિષયો (priority ક્રમમાં), સંપર્ક, લોડ અને મર્યાદા.",steps:["＋ Add: નામ (જરૂરી), લાયકાત, હોદ્દો, મોબાઇલ, ઈમેલ, મુખ્ય વિષય, સાપ્તાહિક લોડ, sanctioned લોડ, દિવસ દીઠ મહત્તમ, સળંગ મહત્તમ, can-substitute, અને ભણાવી શકે તે વિષય ટિક કરો. Save.","એક શિક્ષક 2-3 વિષય ભણાવી શકે. વિષયો priority ક્રમમાં (1, 2, 3) ⭐ = મુખ્ય વિષય સાથે; ▲▼ થી ક્રમ બદલો, ✕ કાઢો, + Can teach થી ઉમેરો. Auto-generate પહેલા 1st વિષય ભરે, પછી 2nd, 3rd.","હોદ્દો અને sanctioned લોડ DEO રિપોર્ટમાં વપરાય; મોબાઇલ/ઈમેલ સ્ટાફ ડિરેક્ટરી માટે.","ઉપર 📊 વિષય સ્ટાફિંગ કવરેજ પેનલ: દરેક વિષય 🟢 પૂરતા (2+ મુખ્ય), 🟡 બેકઅપ છે, 🔴 જોખમી (માત્ર 1), ⚫ શિક્ષક નથી — જોખમ હોય તો આપોઆપ ખૂલે.","સાપ્તાહિક લોડ = અઠવાડિયામાં પિરિયડ; દિવસ/સળંગ મર્યાદા દિવસ સંતુલિત રાખે."],tip:"can-substitute નક્કી કરે કે પ્રોક્સી તરીકે સૂચવાય; બદલી યાદી પછી વિષય-મેચ પ્રમાણે ક્રમમાં (⭐ એ જ વિષય પહેલા)."},
  rooms:{title:"રૂમ",who:"એડમિન",where:"Master → Rooms",intro:"રૂમ/લેબ, વૈકલ્પિક ક્ષમતા સાથે.",steps:["＋ Add → રૂમનું નામ અને ક્ષમતા → Save.","કોઈ પિરિયડને રૂમ આપતી વખતે અને રૂમ-ક્લેશ તપાસમાં રૂમ વપરાય છે."],tip:"ડુપ્લિકેટ રૂમ પણ ⚠ Remove duplicates થી ભેગા થઈ શકે."},
  hours:{title:"શાળા સમય અને સત્ર",who:"એડમિન",where:"Master → Academic Hours",intro:"રોજનો સમય — શરૂ/અંત, પિરિયડ લંબાઈ, બ્રેક, લંચ, પિરિયડની સંખ્યા — અલગ શનિવાર સમય, સાથે સત્ર, લેબલ અને શેડ્યૂલ પ્રકાર.",steps:["કાર્યદિવસ, દિવસનો શરૂ અને અંત, પિરિયડ લંબાઈ, લંચ (કયા પિરિયડ પછી + મિનિટ) અને નાના બ્રેક સેટ કરો. શનિવાર અલગ હોય તો તેનો સમય ઉમેરો.","દિવસ દીઠ પિરિયડની સંખ્યા સેટ કરો (કાર્યદિવસ અને શનિવાર).","સત્ર: એક સત્ર ઉમેરો અને એકને સક્રિય કરો. લેબલ: Class/Teacher/Room/Subject ને તમારા શબ્દોમાં બદલો.","શેડ્યૂલ પ્રકાર: સિંગલ વીક, મલ્ટી-વીક (Week A/B…) કે ડે રોટેશન (Day A/B/C…)."],tip:"સમય 24-કલાકમાં — 2:30 PM ને 14:30 લખો, નહીંતર દિવસ એક પિરિયડ પછી અટકી જશે."},
  quota:{title:"સાપ્તાહિક ક્વોટા અને નિયમો",who:"એડમિન",where:"Master → Weekly Quota",intro:"દરેક વર્ગમાં દરેક વિષયને અઠવાડિયામાં કેટલા પિરિયડ મળે, અને પ્લેસમેન્ટ નિયમો.",steps:["દરેક વર્ગ માટે, દરેક વિષયની અઠવાડિક સંખ્યા ભરો.","નિયમો ઉમેરો: બે વિષય એક જ દિવસે ન હોય, કે ક્યારેય સળંગ ન હોય."],tip:"Auto-generate આ જ અઠવાડિક સંખ્યાઓ, તમારા નિયમો સાથે ભરે છે."},
  availability:{title:"ઉપલબ્ધતા",who:"એડમિન",where:"Master → Availability",intro:"કોઈ શિક્ષક, વર્ગ કે રૂમને અમુક પિરિયડ માટે બ્લોક કરો જેથી ત્યારે કંઈ શેડ્યૂલ ન થાય.",steps:["શિક્ષક/વર્ગ/રૂમ પસંદ કરો, પછી તે દિવસ+પિરિયડ બ્લોક/અનબ્લોક કરવા સેલ ટૅપ કરો."],tip:"Auto-generate આ બ્લોકનું પાલન કરે અને તૂટે તો ક્લેશ બતાવે."},
  students:{title:"વિદ્યાર્થીઓ અને ઇલેક્ટિવ",who:"એડમિન",where:"Master → Students",intro:"વિદ્યાર્થીઓ સંભાળો અને વર્ગને ઇલેક્ટિવ જૂથોમાં વહેંચો, દરેક જૂથનો પોતાનો વિષય/શિક્ષક/રૂમ.",steps:["વર્ગમાં વિદ્યાર્થીઓ ઉમેરો.","વર્ગ માટે એક elective + તેના જૂથ વિકલ્પ ઉમેરો (દરેક વિકલ્પ = વિષય/શિક્ષક/રૂમ); વિદ્યાર્થીઓને વિકલ્પોમાં મૂકો."],tip:"ઇલેક્ટિવ/સમાંતર જૂથ પછી વર્ગ ગ્રિડમાં જ દેખાય છે."},
  build:{title:"ટાઈમટેબલ બનાવો",who:"એડમિન",where:"Timetable → Auto Set",intro:"ટાઈમટેબલ હાથે કે એક ક્લિકમાં બનાવો — locked, double અને combined પિરિયડ સાથે.",steps:["Auto Set: એક દિવસ પસંદ કરો, પછી દરેક સેલનો વિષય, શિક્ષક અને રૂમ હાથે ભરો. ક્લેશ લાલ રંગમાં દેખાય.","Auto-generate: સેટઅપ પૂરો થાય પછી Auto-generate દબાવો — ક્વોટા, નિયમ અને ઉપલબ્ધતાનું પાલન કરતું ક્લેશ-મુક્ત ટાઈમટેબલ.","🔒 કોઈ નિશ્ચિત પ્રવૃત્તિ (Assembly/PT/Library) લોક કરો જેથી Auto-generate તેને રાખે અને આસપાસ શેડ્યૂલ કરે.","Combined classes: ઘણા વર્ગોને સાથે એક સત્રમાં ભણાવો (Games/Assembly) — વિષય/શિક્ષક/રૂમ + દિવસ/પિરિયડ પસંદ કરો અને 2+ વર્ગ ટિક કરો.","સેલની પકડને બીજા સેલ પર ખેંચીને બે પિરિયડ ખસેડો/સ્વૅપ કરો."],tip:"Double ચિહ્નિત લેબ વિષય એક જ શિક્ષક અને રૂમ સાથે સળંગ બે પિરિયડમાં મુકાય છે."},
  optimizer:{title:"ઓપ્ટિમાઇઝર",who:"એડમિન",where:"Timetable → Optimizer",intro:"નરમ પસંદગીઓ જે આગલી વખતે Auto-generate પર વધુ સારું ટાઈમટેબલ બનાવે.",steps:["પસંદગીઓ ટિક કરો: વિષય અઠવાડિયામાં ફેલાવો, દરેક શિક્ષકનો લોડ સંતુલિત કરો, ભારે વિષય વહેલા મૂકો, શિક્ષકના ખાલી પિરિયડ ઘટાડો.","Deep optimise ટિક કરો જેથી દરેક દિવસમાં પિરિયડ ફરી ગોઠવીને ખાલી અંતરાલ ઘટે — ક્લેશ વગર."],tip:"ઓપ્ટિમાઇઝર સેટિંગ આગલી વખતે Auto-generate પર લાગુ થાય."},
  rotation:{title:"મલ્ટી-વીક અને ડે રોટેશન",who:"એડમિન",where:"Academic Hours → Schedule type",intro:"દરેક અઠવાડિયું કે દરેક રોટેશન-દિવસનો અલગ પ્લાન.",steps:["મલ્ટી-વીક: Weekly plans અને અઠવાડિયાની સંખ્યા પસંદ કરો (Week A/B/C/D). દરેક અઠવાડિયું અલગ હોઈ શકે.","ડે રોટેશન: Daily rotation અને દિવસોની સંખ્યા પસંદ કરો (Day A/B/C).","રોટેશન કૅલેન્ડર એક શરૂઆત તારીખથી આજે કયો Week/Day સક્રિય છે તે બતાવે."],tip:"Class અને Teacher વ્યૂમાં દરેક ચક્ર જોવા Week/Day સ્વિચર છે."},
  views:{title:"વર્ગ/શિક્ષક/શાળા વ્યૂ",who:"બધા",where:"Timetable → Class / Teacher / School View",intro:"ટાઈમટેબલ વર્ગ, શિક્ષક કે આખી શાળા પ્રમાણે જુઓ અને શેર કરો.",steps:["Class વ્યૂ: વર્ગ પસંદ કરો; Print, Excel માં નિકાસ, કે માત્ર-વાંચન Share link લો.","Teacher વ્યૂ: શિક્ષક પસંદ કરી તેનું અઠવાડિયું અને કુલ લોડ જુઓ.","School વ્યૂ: દિવસ પસંદ કરી બધા વર્ગ સાથે જુઓ.","Print all થી બધા વર્ગ/શિક્ષક એકસાથે પ્રિન્ટ — પછી બ્રાઉઝરથી Save as PDF."],tip:"Share link લૉગિન વગર ટાઈમટેબલ ખોલે — વાલી માટે ઉપયોગી."},
  insights:{title:"ઇનસાઇટ્સ ડૅશબોર્ડ",who:"એડમિન",where:"Timetable → Insights",intro:"તમારા ટાઈમટેબલ વિશે KPI અને ચાર્ટનું ડૅશબોર્ડ.",steps:["KPI ટાઈલ (વર્ગ, વિષય, શિક્ષક, પૂર્ણતા) સાથે period-load હીટમેપ અને teacher-workload, subject-coverage તથા room-utilisation ચાર્ટ જુઓ.","કોઈપણ KPI ટાઈલ પર ટૅપ કરી સીધા તે વ્યૂ પર જાઓ."],tip:"વધુ ભાર વાળા શિક્ષક કે ઓછા વપરાયેલા રૂમ ઓળખવામાં ઉપયોગી."},
  substitution:{title:"પ્રોક્સી અને રજા",who:"એડમિન / શિક્ષક",where:"Daily → Substitution",intro:"ગેરહાજર શિક્ષકની જગ્યાએ તારીખ કે રેન્જ પર પ્રોક્સી મૂકો, સાથે રજા-મંજૂરી પ્રક્રિયા.",steps:["ગેરહાજર શિક્ષક અને તારીખ પસંદ કરો, પછી દરેક પિરિયડ માટે એક ખાલી શિક્ષકને પ્રોક્સી મૂકો.","ખાલી શિક્ષકોની યાદી વિષય-મેચ પ્રમાણે ક્રમમાં — ⭐ એ જ વિષય પહેલા, 🥈 ગૌણ વિષય, પછી સામાન્ય — અને દરેક પિરિયડ માટે ✔ Best match સૂચવાય.","શિક્ષક રજા માટે અરજી કરી શકે; એડમિન મંજૂર કરે અને પ્રોક્સી હરોળ આપોઆપ બને."],tip:"માત્ર can-substitute શિક્ષક પ્રોક્સી તરીકે સૂચવાય; વધુ સારા મેચ માટે વિષય priority ક્રમ સેટ કરો."},
  liveclass:{title:"લાઈવ ક્લાસ",who:"બધા",where:"Daily → Live Class",intro:"આજની લાઈવ સ્થિતિ — અત્યારે કોણ ભણાવે છે, પ્રોક્સી અને ખાલી પિરિયડ.",steps:["ખોલો અને બધા વર્ગનો હાલનો પિરિયડ જુઓ, આજની પ્રોક્સી અને ખાલી સ્લોટ સહિત."],tip:"ઑફિસ માટે આખી શાળાની ઝલક જોવા ઉત્તમ."},
  diary:{title:"શિક્ષક ડાયરી અને પ્રકરણ",who:"શિક્ષક",where:"Daily → Teacher Diary",intro:"દરેક શિક્ષકની દૈનિક અને માસિક શિક્ષણ નોંધ, સાથે પ્રકરણો.",steps:["શિક્ષક અને તારીખ પસંદ કરો; પાઠ, વિષયવસ્તુ, ગૃહકાર્ય વગેરે ભરો.","પ્રકરણ: વિષય પસંદ કરી તેના પ્રકરણ નોંધો જેથી અભ્યાસક્રમ ટ્રૅક થાય.","દૈનિક એન્ટ્રી અને માસિક નોંધ વ્યૂ વચ્ચે સ્વિચ કરો."],tip:"શિક્ષક લૉગિન માત્ર પોતાની ડાયરી જુએ."},
  notifications:{title:"સૂચનાઓ",who:"બધા",where:"Daily → Notifications",intro:"મફત પુશ અલર્ટ — જે phone/PC માં app (PWA) install છે ત્યાં જ. નંબર/ઈમેલ ની જરૂર નથી.",steps:["દરેક શિક્ષક: app એક વાર ખોલો → Notifications → Enable notifications (browser પૂછે ત્યારે allow કરો). iPhone પર પહેલા app ને Home Screen માં ઉમેરો.","એડમિન/આચાર્ય title + message લખી Send કરે — દરેક enabled ડિવાઇસ પર આવે.","માત્ર એ જ ડિવાઇસ પર જ્યાં app install + notification ON છે."],tip:"દરેક શિક્ષક પાસે એક વાર enable કરાવો — પછી જાહેરાત બધાને તરત, મફત."},
  reports:{title:"રિપોર્ટ્સ",who:"એડમિન",where:"Timetable → Reports",intro:"તૈયાર Excel રિપોર્ટ, સાથે તમારું ટેમ્પ્લેટ ભરો અને કોઈપણ Excel ને સુંદર બનાવો.",steps:["Reports ટેબ: Timetable, Analysis, DEO, Diary, Custom.","રિપોર્ટ પસંદ કરો — Excel માં ડાઉનલોડ થાય.","DEO ટેબમાં સરકારી-ફોર્મેટ સ્ટાફ રિપોર્ટ (ગુજરાત પત્રક A/B/K + રજિસ્ટર) — DEO Reports વિષય જુઓ.","અથવા તમારું Excel ટેમ્પ્લેટ અપલોડ કરી ભરો."],tip:"ટેમ્પ્લેટમાં એક હરોળ {{rows:teachers}} અને {{field}} ટોકનથી પુનરાવર્તિત થાય."},
  deo:{title:"DEO રિપોર્ટ અને ગુજરાત પત્રક",who:"એડમિન",where:"Timetable → Reports → DEO",intro:"જિલ્લા શિક્ષણ અધિકારી ફોર્મેટના સ્ટાફ રિપોર્ટ — ગુજરાત પત્રક A/B/K અને રજિસ્ટર (Format 1-5) — તમારા શિક્ષકો, વિષયો અને બનેલા ટાઇમટેબલ પરથી આપોઆપ.",steps:["પહેલા ⚙ Report header (શાળા પ્રોફાઇલ) એક વાર ભરો: સરનામું, શાળા કોડ, UDISE, જિલ્લો, મોબાઇલ, ઈમેલ, Reg કોડ, Inspection ref, Officer, Max load. આ દરેક રિપોર્ટ હેડરમાં છપાય.","ગુજરાત પત્રક: Section (પ્રાથમિક 1-8 / માધ્યમિક 9-10 / ઉચ્ચતર માધ્યમિક 11-12) dropdown થી પસંદ કરો, પછી પત્રક-અ (વર્ગ ફાળવણી), પત્રક-બ (શિક્ષક કાર્યભાર), પત્રક-ક (પ્રમાણપત્ર) — Print/PDF કે Excel. વર્ગ ન હોય તે section greyed.","રજિસ્ટર: Format 1 (શિક્ષક કાર્યભાર), 2 (વર્ગ ફાળવણી), 3 (રૂમ ઉપયોગ), 4 (બેલ શેડ્યૂલ), 5 (ગેરહાજરી/બદલી) — દરેક Print/PDF + Excel.","📦 All formats એક Excel માં બધું; ↻ Refresh ડેટા બદલ્યા પછી.","સાચા આંકડા માટે પહેલા ટાઇમટેબલ generate કરો અને દરેક શિક્ષકનો હોદ્દો + sanctioned લોડ ભરો."],tip:"રિપોર્ટ ટાઇમટેબલ (સપ્તાહ-અ) પરથી બને. Section વર્ગના નામના નંબરથી (9A → માધ્યમિક, 11 વિજ્ઞાન → ઉચ્ચતર)."},
  versions:{title:"ટાઈમટેબલ સેવ (વર્ઝન)",who:"એડમિન",where:"Timetable → Save Timetable",intro:"ટાઈમટેબલની નામવાળી નકલ સેવ કરો અને પછી કોઈપણ પાછી લાવો.",steps:["એક નામવાળું વર્ઝન સેવ કરો (હાલના ટાઈમટેબલ + સેટિંગનો સ્નૅપશૉટ).","Restore કોઈપણ સમયે સેવ કરેલ વર્ઝન પાછું લાવે."],tip:"મોટા ફેરફાર પહેલા વર્ઝન સેવ કરો જેથી પાછા જઈ શકાય."},
  data:{title:"આયાત / નિકાસ",who:"એડમિન",where:"Admin → Import / Export",intro:"તમારો સેટઅપ Excel થી બલ્ક-લોડ કરો, અને ટાઈમટેબલ તથા સેટઅપ Excel માં નિકાસ કરો.",steps:["સેટઅપ ટેમ્પ્લેટ ડાઉનલોડ કરો, Classes/Subjects/Rooms/Teachers/Chapters શીટ ભરો, પછી અપલોડ કરી આયાત કરો.","ટાઈમટેબલ કે સેટઅપ કોઈપણ સમયે Excel માં નિકાસ કરો."],tip:"આયાતક માત્ર નવા નામ ઉમેરે — બે વાર ચલાવવાથી ડુપ્લિકેટ બનતા નથી."},
  cleanup:{title:"ડેટા સફાઈ અને ડુપ્લિકેટ કાઢવા",who:"એડમિન",where:"Admin → Import / Export → Data Cleanup · અને દરેક Master ટૅબ પર ⚠ Remove duplicates",intro:"કોઈ ફીલ્ડ, સેક્શન કે આખી યાદી સાફ કરીને ભૂલ સુધારો — કે ડુપ્લિકેટ હરોળ ભેગી કરો.",steps:["Remove duplicates: Subjects/Classes/Teachers/Rooms પર પીળા ⚠ Remove duplicates (N) બટન એક જ નામની હરોળ ભેગી કરે, ટાઈમટેબલ સાચવીને.","Data Cleanup: કોઈ ફીલ્ડ (દા.ત. Teachers → Qualification), સેક્શન (Timetable, Quota…) કે આખી યાદી પસંદ કરો, I-understand બોક્સ ટિક કરો, પછી Clear. એક Yes/No બોક્સ ખાતરી કરે.","Full reset: શાળાનો બધો ડેટા ભૂંસવા બોક્સ ટિક કરો, શાળાનું સાચું નામ ટાઈપ કરો, પછી Yes દબાવો."],tip:"શાળા, તેની સેટિંગ અને લૉગિન હંમેશા રહે છે — માત્ર પસંદ કરેલ ડેટા સાફ થાય, અને પાછો આવતો નથી."},

  const esc=s=>String(s==null?'':s).replace(/</g,'&lt;');
  const monthPicker=`<div><label>${t('diary_month')}</label><input type="month" value="${ym}" onchange="diaryDate=this.value+'-01';loadDiary()"></div>`;
  const bar=`<div class="row" style="margin-bottom:10px;align-items:flex-end">${monthPicker}<div style="align-self:flex-end"><button class="ghost" onclick="printPlain()">${t('print_pdf')}</button><button class="ghost" onclick="dl('/api/export/diary.xlsx?teacher_id='+curTeacher+'&from=${first}&to=${last}')">${t('btn_export_excel')}</button></div></div>`;
  const monLbl=new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  if(!rows||!rows.length) return bar+`<div class="note">${t('diary_no_month')}</div>`;
  const byDate={}; rows.forEach(r=>{(byDate[r.entry_date]=byDate[r.entry_date]||[]).push(r);});
  const dates=Object.keys(byDate).sort();
  const list=dates.map(d=>{ const es=byDate[d].sort((a,b)=>(a.period_index??99)-(b.period_index??99));
    return `<div class="card" style="margin:8px 0;border-left:4px solid var(--blue)"><b>${longDate(d)}</b> <span class="tag">${DD()[dowFromDate(d)]}</span> <span class="small" style="color:#5c6580">${es.length} ${t('diary_entries_word')}</span>
      <div style="overflow:auto;margin-top:6px"><table><tr><th>P</th><th>${t('class_')}</th><th>${t('subject')}</th><th>${t('f_topic')}</th><th>${t('f_hw')}</th></tr>
      ${es.map(e=>`<tr><td>P${(e.period_index??0)+1}</td><td style="text-align:left">${esc(e.cls)}</td><td style="text-align:left">${esc(e.subj)}</td><td style="text-align:left">${esc(e.topic)}</td><td style="text-align:left">${esc(e.homework)}</td></tr>`).join('')}</table></div></div>`;
  }).join('');
  return bar+`<div id="diaryreport" style="border:1px solid var(--line);border-radius:8px;padding:16px">
     <div style="text-align:center;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:8px">
       <div style="font-size:19px;font-weight:800;color:var(--navy)">${esc(config.school_name||'')}</div>
       <div style="font-size:15px;font-weight:700">${t('diary_month_title')} — ${esc(tName2)}</div>
       <div style="font-size:12px;color:#57608a">${monLbl} · ${dates.length} ${t('diary_days_word')} · ${rows.length} ${t('diary_entries_word')}</div></div>
     ${list}</div>`;
}
function diaryRegisterThisMonth(){ const m=new Date().toISOString().slice(0,7); const y=+m.slice(0,4),mo=+m.slice(5,7); const last=m+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0'); dl('/api/export/diary-summary.xlsx?from='+m+'-01&to='+last); }
async function delDiary(id){ await api('DELETE','/api/diary/'+id); toast(); loadDiary(); }

// ---------- SUBSTITUTION ----------
function subView(){ if(!dsTeacher&&teachers[0])dsTeacher=teachers[0].id;
  const head=`<div class="card"><h2>${t('sub_title')}</h2><div class="desc">${t('sub_desc')}</div></div>`;
  const bar=subTabBar([['leave','📝 '+t('leave_title')],['date','📅 '+t('dsub_title')],['cover','📋 '+t('dsub_weekday')]],subTab,'setSubTab');
  const secLeave=`<div style="border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:16px;background:#f0fdf4">
     <div style="margin-bottom:8px"><b style="color:#166534">📝 ${t('leave_title')}</b> <span class="small" style="color:#5c6580">${t('leave_desc')}</span></div>
     <div class="row" style="align-items:flex-end;gap:10px;flex-wrap:wrap">
       <div style="min-width:160px"><label>${t('leave_teacher')}</label><select id="lv_teacher">${teachers.map(t2=>`<option value="${t2.id}">${t2.name}</option>`).join('')}</select></div>
       <div><label>${t('dsub_from')}</label><input id="lv_from" type="date"></div>
       <div><label>${t('dsub_to')}</label><input id="lv_to" type="date"></div>
       <div style="min-width:130px"><label>${t('leave_type_label')}</label><select id="lv_type">${leaveTypeOptions()}</select></div>
       <div style="flex:1;min-width:140px"><label>${t('leave_reason')}</label><input id="lv_reason" style="width:100%" placeholder="${t('leave_reason_ph')}"></div>
       <div><button onclick="applyLeave()" style="background:#0e9f6e;color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600">＋ ${t('leave_apply')}</button></div>
     </div>
     <div id="leavebox" style="margin-top:10px"></div>
     <div style="margin-top:10px;border-top:1px dashed #cfe3cf;padding-top:8px">
       <span class="small" style="color:#166534;font-weight:700">${t('leave_types_title')}</span> <span class="small" style="color:#5c6580">${t('leave_types_desc')}</span>
       <div class="row" style="gap:6px;margin:6px 0;flex-wrap:wrap"><input id="lt_name" style="width:180px" placeholder="${t('leave_type_ph')}"><button class="ghost mini" onclick="addLeaveType()">${t('add')}</button>
         <span id="ltbox"></span></div></div>
   </div>`;
  const secDate=`<div style="border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:16px;background:#faf9ff">
     <div style="margin-bottom:8px"><b style="color:#5a3ec8">📅 ${t('dsub_title')}</b> <span class="small" style="color:#5c6580">${t('dsub_desc')}</span></div>
     <div class="row" style="align-items:flex-end;gap:10px;flex-wrap:wrap">
       <div style="min-width:170px"><label>${t('dsub_teacher')}</label><select id="ds_teacher">${teachers.map(t2=>`<option value="${t2.id}" ${t2.id===dsTeacher?'selected':''}>${t2.name}</option>`).join('')}</select></div>
       <div><label>${t('dsub_from')}</label><input id="ds_from" type="date" value="${dsFrom||''}"></div>
       <div><label>${t('dsub_to')}</label><input id="ds_to" type="date" value="${dsTo||''}"></div>
       <div style="align-self:flex-end"><button class="ghost mini" onclick="dsQuick('today')">${t('dsub_today')}</button> <button class="ghost mini" onclick="dsQuick('tom')">${t('dsub_tom')}</button> <button class="ghost mini" onclick="dsQuick('7')">${t('dsub_7')}</button></div>
       <div><button onclick="fetchDateSub()" style="background:#5a3ec8;color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600">🔍 ${t('dsub_fetch')}</button></div>
     </div>
     <div id="dsresult" style="margin-top:10px"></div>
   </div>`;
  const secCover=`<div class="card"><div style="margin-bottom:6px"><b class="small">${t('dsub_weekday')}</b></div>
   <div class="row" style="margin-bottom:12px"><div><label>${t('day')}</label><select onchange="subDay=+this.value;loadCover()">${WD().map((i)=>`<option value="${i}" ${i===subDay?'selected':''}>${DD()[i]}</option>`).join("")}</select></div>
     <span class="small">${t('sub_hint')}</span></div>
   <div id="coverbox">Loading…</div></div>`;
  const body=subTab==='date'?secDate:subTab==='cover'?secCover:secLeave;
  return head+bar+body;}
function dsQuick(which){ const iso=d=>d.toISOString().slice(0,10); const today=new Date();
  if(which==='today'){ dsFrom=iso(today); dsTo=iso(today); }
  else if(which==='tom'){ const t=new Date(today.getTime()+864e5); dsFrom=iso(t); dsTo=iso(t); }
  else { dsFrom=iso(today); dsTo=iso(new Date(today.getTime()+6*864e5)); }
  const f=document.getElementById('ds_from'),g=document.getElementById('ds_to'); if(f)f.value=dsFrom; if(g)g.value=dsTo; }
async function fetchDateSub(){ dsTeacher=+document.getElementById('ds_teacher').value; dsFrom=document.getElementById('ds_from').value; dsTo=document.getElementById('ds_to').value;
  const box=document.getElementById('dsresult'); if(!dsTeacher||!dsFrom||!dsTo){ showErr(t('dsub_need')); return; }
  box.innerHTML='<div class="small" style="color:#5c6580">'+t('please_wait')+'</div>';
  const r=await api('GET',`/api/datesub/fetch?teacher_id=${dsTeacher}&from=${dsFrom}&to=${dsTo}`);
  if(r&&r.error){ box.innerHTML=`<div class="errmsg">${r.error}</div>`; return; }
  dsData=(r&&r.periods)||[]; renderDateSub(); }
function renderDateSub(){ const box=document.getElementById('dsresult'); if(!box)return;
  if(!dsData.length){ box.innerHTML='<div class="note">'+t('dsub_none')+'</div>'; return; }
  const total=dsData.length, assigned=dsData.filter(p=>p.proxy_teacher_id).length, free=dsData.filter(p=>+p.is_free===1).length, pending=total-assigned-free;
  const rows=dsData.map((p,i)=>`<tr>
    <td>${p.sub_date}<br><span class="small" style="color:#5c6580">${DD()[p.dow]}</span></td>
    <td>P${p.period_index+1}<br><span class="small" style="color:#5c6580">${p.start||''}-${p.end||''}</span></td>
    <td>${(p.cls||'').replace(/</g,'&lt;')}</td>
    <td>${(p.subj||'—').replace(/</g,'&lt;')}</td>
    <td><select ${+p.is_free===1?'disabled':''} onchange="setDateProxy(${i},this.value)"><option value="">${t('opt_pick_free')}</option>${(p.free||[]).map(f=>{const ic=f.tier===1?'⭐ ':f.tier===2?'🥈 ':f.tier===3?'🥉 ':'';const lb=f.tier===1?' ('+t('sub_tier1')+')':f.tier===2?' ('+t('sub_tier2')+')':f.tier===3?' ('+t('sub_tier3')+')':'';return `<option value="${f.id}" ${p.proxy_teacher_id===f.id?'selected':''}>${ic}${f.name}${lb}</option>`;}).join('')}</select>${(()=>{const b=(p.free||[]).find(f=>f.tier<=2);return b&&p.proxy_teacher_id==null&&+p.is_free!==1?`<div class="small" style="color:#166534;margin-top:2px">✔ ${t('sub_best')}: ${b.tier===1?'⭐':'🥈'} ${(b.name||'').replace(/</g,'&lt;')}</div>`:'';})()}</td>
    <td style="text-align:center"><label class="chk"><input type="checkbox" ${+p.is_free===1?'checked':''} onchange="setDateFree(${i},this.checked)"> ${t('dsub_free')}</label></td></tr>`).join('');
  box.innerHTML=`<div class="small" style="margin-bottom:6px">${t('dsub_summary',{t:total,a:assigned,f:free,p:pending})}</div>
    <div class="small" style="margin-bottom:6px;color:#5c6580">🔎 ${t('sub_rank_legend')}</div>
    <table><tr><th>${t('dsub_date')}</th><th>${t('th_period')}</th><th>${t('class_')}</th><th>${t('subject')}</th><th>${t('th_assign_proxy')}</th><th>${t('dsub_free')}</th></tr>${rows}</table>`; }
async function setDateProxy(i,v){ const p=dsData[i]; p.proxy_teacher_id=v===''?null:+v; if(p.proxy_teacher_id)p.is_free=0;
  const r=await api('POST','/api/datesub',{sub_date:p.sub_date,class_id:p.class_id,period_index:p.period_index,absent_teacher_id:dsTeacher,proxy_teacher_id:p.proxy_teacher_id,is_free:0});
  if(r&&r.error){showErr(r.error);return;} toast(); renderDateSub(); }
async function setDateFree(i,checked){ const p=dsData[i]; p.is_free=checked?1:0; if(checked)p.proxy_teacher_id=null;
  const r=await api('POST','/api/datesub',{sub_date:p.sub_date,class_id:p.class_id,period_index:p.period_index,absent_teacher_id:dsTeacher,proxy_teacher_id:null,is_free:checked?1:0});
  if(r&&r.error){showErr(r.error);return;} toast(); renderDateSub(); }
function leaveBadge(st){ return st==='approved'?'<span class="tag" style="background:#dcfce7;color:#166534">✓ '+t('leave_approved')+'</span>':st==='rejected'?'<span class="tag" style="background:#fee2e2;color:#991b1b">✕ '+t('leave_rejected')+'</span>':'<span class="tag" style="background:#fef9c3;color:#854d0e">● '+t('leave_pending')+'</span>'; }
function leaveTypeOptions(){ return `<option value="">${t('leave_type_any')}</option>`+leaveTypes.map(x=>`<option value="${(x.name||'').replace(/"/g,'&quot;')}">${(x.name||'').replace(/</g,'&lt;')}</option>`).join(''); }
async function loadLeaveTypes(){ try{const l=await api('GET','/api/leave-types'); leaveTypes=Array.isArray(l)?l:[];}catch(e){leaveTypes=[];} renderLeaveTypeChips(); }
function renderLeaveTypeChips(){ const box=document.getElementById('ltbox'); if(!box)return;
  box.innerHTML=leaveTypes.length?leaveTypes.map(x=>`<span class="tag" style="background:#eef2fb">${(x.name||'').replace(/</g,'&lt;')} <span style="cursor:pointer;color:#b23b3b;font-weight:800" onclick="delLeaveType(${x.id})">✕</span></span>`).join(''):'<span class="small" style="color:#5c6580">'+t('leave_types_none')+'</span>'; }
async function addLeaveType(){ const el=document.getElementById('lt_name'); const name=(el.value||'').trim(); if(!name)return; const r=await api('POST','/api/leave-types',{name}); if(r&&r.error){showErr(r.error);return;} el.value=''; toast(); await loadLeaveTypes(); render(); }
async function delLeaveType(id){ if(!confirm(t('confirm_del_leave_type')))return; await api('DELETE','/api/leave-types/'+id); toast(); await loadLeaveTypes(); render(); }
function leaveTable(list,admin){ if(!list.length)return '<span class="small" style="color:#5c6580">'+t('leave_none')+'</span>';
  return `<table><tr><th>${t('leave_teacher')}</th><th>${t('leave_dates')}</th><th>${t('leave_type_label')}</th><th>${t('leave_reason')}</th><th>${t('leave_status')}</th>${admin?'<th></th>':''}</tr>${list.map(l=>`<tr>
    <td>${(l.teacher_name||'').replace(/</g,'&lt;')}</td><td>${l.date_from} → ${l.date_to}</td><td>${(l.leave_type||'—').replace(/</g,'&lt;')}</td><td>${(l.reason||'—').replace(/</g,'&lt;')}</td><td>${leaveBadge(l.status)}</td>
    ${admin?`<td style="white-space:nowrap">${l.status==='pending'?`<button class="ghost mini" onclick="approveLeave(${l.id})">${t('leave_approve')}</button> <button class="ghost mini" onclick="rejectLeave(${l.id})">${t('leave_reject')}</button> `:''}<button class="ghost mini red" onclick="delLeave(${l.id})">✕</button></td>`:''}</tr>`).join('')}</table>`; }
async function loadLeaves(){ const box=document.getElementById('leavebox'); if(!box)return; const list=await api('GET','/api/leaves'); leaves=Array.isArray(list)?list:[]; box.innerHTML=leaveTable(leaves,true); }
async function applyLeave(){ const teacher_id=+document.getElementById('lv_teacher').value, date_from=document.getElementById('lv_from').value, date_to=document.getElementById('lv_to').value, reason=document.getElementById('lv_reason').value, leave_type=document.getElementById('lv_type').value;
  if(!teacher_id||!date_from||!date_to){ showErr(t('leave_need')); return; }
  const r=await api('POST','/api/leaves',{teacher_id,date_from,date_to,reason,leave_type}); if(r&&r.error){showErr(r.error);return;}
  document.getElementById('lv_reason').value=''; toast(); loadLeaves(); }
async function approveLeave(id){ const r=await api('POST','/api/leaves/'+id+'/approve'); if(r&&r.error){showErr(r.error);return;}
  toast(t('leave_approved_toast',{n:(r&&r.periods)||0}));
  if(r&&r.teacher_id){ dsTeacher=r.teacher_id; dsFrom=r.date_from; dsTo=r.date_to; render(); setTimeout(fetchDateSub,60); } else loadLeaves(); }
async function rejectLeave(id){ const r=await api('POST','/api/leaves/'+id+'/reject'); if(r&&r.error){showErr(r.error);return;} toast(); loadLeaves(); }
async function delLeave(id){ if(!confirm(t('confirm_del_leave')))return; const r=await api('DELETE','/api/leaves/'+id); if(r&&r.error){showErr(r.error);return;} toast(); loadLeaves(); }
async function loadMyLeaves(){ const box=document.getElementById('myleavebox'); if(!box)return; const list=await api('GET','/api/leaves'); myLeaves=Array.isArray(list)?list:[]; box.innerHTML=leaveTable(myLeaves,false); }
async function applyMyLeave(){ const date_from=document.getElementById('mlv_from').value, date_to=document.getElementById('mlv_to').value, reason=document.getElementById('mlv_reason').value, leave_type=document.getElementById('mlv_type').value;
  if(!date_from||!date_to){ showErr(t('leave_need')); return; }
  const r=await api('POST','/api/leaves',{date_from,date_to,reason,leave_type}); if(r&&r.error){showErr(r.error);return;}
  document.getElementById('mlv_reason').value=''; toast(); loadMyLeaves(); }
function myLeaveCard(){ return `<div class="card"><h2>📝 ${t('leave_my_title')}</h2><div class="desc">${t('leave_my_desc')}</div>
   <div class="row" style="align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px">
     <div><label>${t('dsub_from')}</label><input id="mlv_from" type="date"></div>
     <div><label>${t('dsub_to')}</label><input id="mlv_to" type="date"></div>
     <div style="min-width:130px"><label>${t('leave_type_label')}</label><select id="mlv_type">${leaveTypeOptions()}</select></div>
     <div style="flex:1;min-width:140px"><label>${t('leave_reason')}</label><input id="mlv_reason" style="width:100%" placeholder="${t('leave_reason_ph')}"></div>
     <div><button onclick="applyMyLeave()" style="background:#0e9f6e;color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600">＋ ${t('leave_apply')}</button></div>
   </div><div id="myleavebox"></div></div>`; }
async function loadCover(){const box=document.getElementById('coverbox');if(!box)return;cover=await api('GET','/api/timetable/cover?day='+subDay);
  if(!cover.need.length){box.innerHTML='<div class="note">'+t('no_cover',{day:DD()[subDay]})+'</div>';return;}
  box.innerHTML=`<table><tr><th>${t('class_')}</th><th>${t('th_period')}</th><th>${t('subject')}</th><th>${t('th_absent_teacher')}</th><th>${t('th_assign_proxy')}</th></tr>${
    cover.need.map(n=>`<tr><td>${(classes.find(c=>c.id===n.class_id)||{}).name}</td><td>P${n.period_index+1}</td><td>${n.subj}</td>
      <td><span class="pill proxy">${tName(n.teacher_id)}</span></td>
      <td><select onchange="assignProxy(${n.class_id},${n.period_index},this.value)"><option value="">${t('opt_pick_free')}</option>${n.free.map(f=>`<option value="${f.id}" ${n.proxy_teacher_id===f.id?'selected':''}>${f.name}</option>`).join('')}</select></td></tr>`).join('')}</table>
    <div class="small" style="margin-top:8px">${t('proxy_note')}</div>`;}
async function assignProxy(class_id,period,v){await api('POST','/api/timetable/substitute',{day:subDay,class_id,period,proxy_teacher_id:v===''?null:+v});toast();loadCover();}

// ---------- LIVE MONITOR ----------
function monitor(){return `<div class="card"><h2>${t('monitor_title')}</h2>
   <div class="desc">${t('monitor_desc')}</div>
   <div class="row" style="margin-bottom:6px">
     <div><label>${t('lbl_sim_day')}</label><select id="mday" onchange="monDay=this.value===''?null:+this.value;refreshMonitor()"><option value="">${t('opt_now')}</option>${WD().map((i)=>`<option value="${i}" ${monDay===i?'selected':''}>${DD()[i]}</option>`).join("")}</select></div>
     <div><label>${t('lbl_sim_time')}</label><input type="time" id="mtime" value="${monTime||''}" onchange="monTime=this.value;refreshMonitor()"></div>
     <button class="ghost" onclick="monDay=null;monTime=null;refreshMonitor()">${t('btn_real_time')}</button></div>
   <div class="legend"><span><span class="pill live">${t('st_live')}</span> ${t('legend_running')}</span><span><span class="pill break">${t('st_break')}</span></span><span><span class="pill idle">${t('st_idle')}</span></span><span><span class="pill proxy">${t('st_proxy')}</span> ${t('legend_absent_covered')}</span></div>
   <div class="mon-grid" id="mongrid">Loading…</div></div>`;}
async function refreshMonitor(){const g=document.getElementById('mongrid');if(!g)return;let u='/api/timetable/monitor';if(monDay!=null&&monTime)u+=`?day=${monDay}&time=${monTime}`;const d=await api('GET',u);
  g.innerHTML=d.classes.map(c=>`<div class="mon ${c.status}"><div class="cn">${c.name}</div><div><span class="pill ${c.status}">${t('st_'+c.status)}</span></div><div class="info">${c.text}</div></div>`).join("");}

/* ============================ boot ============================ */
if('serviceWorker' in navigator){
  const _hadCtrl=!!navigator.serviceWorker.controller; let _swRl=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(_swRl||!_hadCtrl)return; _swRl=true; location.reload(); });   // a new version deployed → refresh the open app so users always run the latest code
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').then(function(reg){ try{reg.update();}catch(e){} setInterval(function(){ try{reg.update();}catch(e){} },60000); }).catch(()=>{}); });
}
boot();

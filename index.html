<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aumtara — Timetable Module</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1f2b57">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aumtara">
<style>
:root{--navy:#1F3864;--blue:#2f5fd0;--accent:#7030A0;--green:#0e9f6e;--amber:#c98a00;--red:#c0392b;--bg:#f4f7fc;--line:#e2e6ee;--muted:#555d70;}
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{margin:0;background:#ffffff;color:#222;}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px;}
header .logo{width:30px;height:30px;background:linear-gradient(135deg,#4f8cff,#7030A0);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;}
header h1{font-size:18px;margin:0;} header .sub{font-size:12.5px;opacity:.92;}
.langsel{margin-left:auto;background:#2c4a7c;color:#fff;border:1px solid #3f5f95;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;}
.langsel option{background:#fff;color:#222;}
.savebadge{font-size:12px;background:#0e9f6e;color:#fff;padding:4px 10px;border-radius:20px;opacity:0;transition:.3s;}
.savebadge.show{opacity:1;}
.navtoggle{background:#2c4a7c;color:#fff;border:1px solid #3f5f95;border-radius:8px;padding:5px 11px;font-size:17px;line-height:1;cursor:pointer;font-weight:700;}
.navtoggle:hover{background:#345592;}
.helpbtn{background:#ffd34d;color:#1F2B57;border:none;border-radius:50%;width:30px;height:30px;font-size:17px;font-weight:800;cursor:pointer;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.2);flex:0 0 auto;}
.helpbtn:hover{background:#ffc21a;}
.hlp-toc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px;}
.hlp-toc a{font-size:12.5px;background:#eef2fb;color:#1F2B57;padding:4px 10px;border-radius:14px;text-decoration:none;font-weight:600;}
.hlp-toc a:hover{background:#dce6fb;}
.helpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;margin-top:16px;}
.helpbox{border-radius:12px;padding:15px 16px;cursor:pointer;transition:transform .14s,box-shadow .14s;display:flex;flex-direction:column;}
.helpbox:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(31,40,87,.14);}
.hb-ic{font-size:32px;line-height:1;margin-bottom:8px;}
.hb-tt{font-size:17px;font-weight:800;margin-bottom:5px;line-height:1.2;}
.hb-in{font-size:14px;color:#3d4663;line-height:1.45;flex:1;}
.hb-wh{font-size:12px;color:#616a86;margin-top:10px;font-weight:600;}
@media(max-width:640px){.helpgrid{grid-template-columns:1fr;}}
.quotagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px 14px;max-width:1100px;margin:6px 0;}
.qcell{display:flex;align-items:center;gap:8px;background:#f7f9fe;border:1px solid #e6ebf5;border-radius:8px;padding:7px 11px;font-size:13.5px;}
.qcell .qname{font-weight:600;color:#1F3864;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:56px;}
.qcell input{width:52px;flex:0 0 auto;text-align:center;padding:5px 6px;}
.qcell .qtsel{flex:0 0 auto;max-width:132px;font-size:12px;padding:4px 6px;color:#4a5670;background:#fff;}
.qtotal{margin-top:12px;font-weight:700;color:#1F3864;font-size:14.5px;}
@media(max-width:520px){.quotagrid{grid-template-columns:1fr 1fr;}}
.hlp-sec{border:1px solid #e6eaf3;border-radius:12px;padding:13px 15px;margin:12px 0;background:#fff;scroll-margin-top:74px;}
.hlp-sec h3{margin:0 0 4px;color:#1F2B57;font-size:16px;}
.hlp-sec .who{display:inline-block;font-size:11px;font-weight:700;color:#6a5000;background:#fff3cd;border-radius:10px;padding:2px 9px;margin-bottom:7px;}
.hlp-sec .intro{color:#3a4560;font-size:13px;}
.hlp-sec ol{margin:6px 0 4px 4px;padding-left:20px;} .hlp-sec ol li{margin:4px 0;line-height:1.4;}
.hlp-sec .tip{background:#eef7ee;border-left:3px solid #2e7d32;border-radius:6px;padding:7px 10px;margin-top:8px;font-size:12.8px;color:#24492a;}
.hlp-sec .where{font-size:12.5px;color:#5c6580;margin:2px 0 6px;} .hlp-sec .where b{color:#1F2B57;}
/* Help Center modal (AumCare-style) */
.hm-back{position:fixed;inset:0;z-index:100001;background:rgba(20,28,48,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;}
.hm-card{background:#fff;border-radius:16px;width:100%;max-width:600px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;animation:hmpop .16s ease;}
@keyframes hmpop{from{transform:translateY(-10px);opacity:.4}to{transform:none;opacity:1}}
.hm-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 10px;}
.hm-head b{font-size:18px;color:#1F2B57;}
.hm-x{cursor:pointer;font-size:20px;color:#8a93a6;line-height:1;padding:2px 6px;border-radius:6px;} .hm-x:hover{background:#eef1f6;color:#1F2B57;}
.hm-tabs{display:flex;gap:8px;padding:0 18px 12px;border-bottom:1px solid #eef1f6;}
.hm-tab{border:1px solid #dbe1ee;background:#fff;color:#33415a;border-radius:9px;padding:8px 15px;font-size:13.5px;font-weight:700;cursor:pointer;}
.hm-tab.on{background:#1F2B57;color:#fff;border-color:#1F2B57;}
.hm-body{padding:14px 18px 20px;max-height:64vh;overflow:auto;}
.hm-title2{font-size:17px;font-weight:800;color:#1F2B57;margin-bottom:2px;}
.hm-in{color:#4a5670;font-size:13.5px;line-height:1.45;margin:2px 0 8px;}
.hm-where{font-size:12.5px;color:#5c6580;background:#f4f6fb;border-radius:8px;padding:6px 10px;margin:4px 0 8px;}
.hm-ol{margin:6px 0 4px;padding-left:26px;} .hm-ol li{margin:6px 0;line-height:1.45;font-size:14px;color:#26324c;}
.hm-tip{background:#eef7ee;border-left:3px solid #2e7d32;border-radius:7px;padding:8px 11px;margin-top:9px;font-size:13px;color:#24492a;}
.hm-sec{border-bottom:1px solid #eef1f6;padding:10px 0 4px;} .hm-sec:last-child{border-bottom:none;}
.hm-st{font-size:15.5px;font-weight:800;color:#1F2B57;margin-bottom:2px;}
#shell{display:flex;align-items:flex-start;}
.tabs{display:flex;flex-direction:column;gap:1px;background:#fff;border-right:1px solid var(--line);padding:8px 8px 26px;width:216px;flex:0 0 216px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto;}
.navgrp{font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);padding:11px 8px 11px 10px;margin:3px 6px 0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;border-radius:8px;transition:background .12s,color .12s;}
.navgrp:hover{color:var(--blue);background:#eef3ff;}
.navgrp:active{background:#e2eaff;}
.navgrp .car{font-size:17px;color:#5b6b8c;transition:transform .18s,background .12s,color .12s;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;flex:none;}
.navgrp:hover .car{background:#dbe6ff;color:var(--blue);}
.navgrp.collapsed .car{transform:rotate(-90deg);}
.navsec{display:flex;flex-direction:column;gap:1px;}
.tab{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:8px;white-space:nowrap;border-left:3px solid transparent;}
.tab:hover{background:#f4f7fc;color:var(--navy);}
.tab.active{color:var(--navy);background:#eef3fd;border-left-color:var(--blue);}
body.sidenav-off .tabs{display:none;}
.wrap{flex:1;min-width:0;max-width:1240px;margin:0 auto;padding:22px;}
body.sidenav-off .wrap{max-width:100%;}   /* hide sidebar → content uses the full width */
body.wide-view .wrap{max-width:100%;}   /* Auto Set: use the full page width so the grid shows bigger */
.gridwrap{margin-bottom:18px;}   /* Auto Set grid: no card box, edge-to-edge for more width */
@media(max-width:820px){
  .tabs{position:fixed;left:0;top:0;bottom:0;z-index:1200;max-height:none;box-shadow:3px 0 16px rgba(0,0,0,.18);width:230px;}
  body:not(.sidenav-off) #shell::before{content:"";position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:1100;}
}
.kpis{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;}
.kpi{background:linear-gradient(135deg,#eaf1ff,#ffffff);border:1px solid #d3e2ff;border-radius:10px;padding:8px 14px;border-left:4px solid var(--blue);display:flex;align-items:baseline;gap:8px;}
.kpi .n{font-size:22px;font-weight:800;color:var(--navy);line-height:1;} .kpi .l{font-size:11px;color:#454d61;text-transform:uppercase;letter-spacing:.3px;font-weight:700;white-space:nowrap;}
.kpi.g{background:linear-gradient(135deg,#e6faf0,#ffffff);border-color:#c2edd6;border-left-color:var(--green);}
.kpi.a{background:linear-gradient(135deg,#fff5e3,#ffffff);border-color:#f1dcae;border-left-color:var(--amber);}
.kpi.p{background:linear-gradient(135deg,#f3eaff,#ffffff);border-color:#e0cef5;border-left-color:var(--accent);}
.kpi.t{background:linear-gradient(135deg,#e5f9fb,#ffffff);border-color:#bfe8ef;border-left-color:#0891b2;}
.kpi.r{background:linear-gradient(135deg,#fff0ef,#ffffff);border-color:#f4d3d1;border-left-color:var(--red);}
.kpi.g .n{color:var(--green);}.kpi.a .n{color:var(--amber);}.kpi.p .n{color:var(--accent);}.kpi.t .n{color:#0891b2;}.kpi.r .n{color:var(--red);}
.kpi[onclick]{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;}
.kpi[onclick]:hover{border-color:var(--accent);box-shadow:0 3px 11px rgba(37,99,235,.13);transform:translateY(-2px);}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;}
/* light multi-colour boxes are painted per-element by paintBoxes() (JS) so every box on a page gets its own soft colour */
@media print{#view .card,#view .kpi,#view select,#view input{background:#fff!important;border-color:#ddd!important;}}
.card h2{margin:0 0 4px;font-size:17px;color:var(--navy);} .card .desc{color:#414a63;font-size:14.5px;line-height:1.5;margin-bottom:14px;font-weight:500;}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:#222;}
select{background:#eef2ff;border-color:#cdd7f5;cursor:pointer;font-weight:600;color:#1f2b57;}
select:hover{background:#e3e9ff;}
select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px #dbe4ff;}
label:has(+ select){font-weight:800;color:var(--navy);}
button{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);} button.green{background:var(--green);}button.purple{background:var(--accent);}button.red{background:#fdecec;color:#c0392b;border:1px solid #f3c4c0;}button.red:hover{background:#fbdcdc;}button.amber{background:var(--amber);}button.teal{background:#0e8f9c;}
button.mini{padding:4px 9px;font-size:12px;} button:hover{opacity:.92;} button:active{transform:translateY(1px);filter:brightness(.95);}
table{border-collapse:collapse;width:100%;font-size:14px;} th,td{border:1px solid var(--line);padding:8px 10px;text-align:center;vertical-align:middle;}
th{background:var(--navy);color:#fff;} td.ph{background:#eef2fb;font-weight:700;color:var(--navy);}
.cell{min-width:130px;} .cell select{width:100%;font-size:13.5px;font-weight:500;color:#222;padding:4px 3px;border:none;background:transparent;margin:1px 0;}
.subj{font-weight:800;color:var(--navy);font-size:14.5px;} .tch{font-size:13.5px;font-weight:700;color:#33415a;} .rm{font-size:11.5px;color:var(--accent);}
.conflict{background:#ffe1e1 !important;outline:2px solid var(--red);}
.avtable th{font-size:14px;padding:10px 8px;} .avtable td.ph{font-size:14px;}
.avtable td.avcell{min-width:76px;height:50px;cursor:pointer;font-size:18px;font-weight:800;color:#b23b3b;background:#eef7ee;transition:background .12s;user-select:none;}
.avtable td.avcell:hover{background:#dcefe0;} .avtable td.avcell.blk{background:#fdecec;}
.avtable td.avnil{background:#f4f6fa;}
.free{color:#8b90a0;font-style:italic;}
/* Highlight-teacher mode: dim everything, glow the selected teacher's boxes */
#ttwrap.hlmode td{opacity:.24;filter:grayscale(.5);}
#ttwrap.hlmode td.ph,#ttwrap.hlmode th{opacity:1;filter:none;}
#ttwrap.hlmode td.hl-on{opacity:1;filter:none;outline:3px solid #f59e0b;outline-offset:-3px;box-shadow:0 0 0 3px #fde68a inset;font-weight:800;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.pill.live{background:#d1fae5;color:#065f46;}.pill.break{background:#fef3c7;color:#92400e;}.pill.idle{background:#e5e7eb;color:#374151;}.pill.proxy{background:#ede9fe;color:#5b21b6;}
.mon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.mon{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;border-left:5px solid var(--line);}
.mon.live{border-left-color:var(--green);}.mon.break{border-left-color:var(--amber);}.mon.idle{border-left-color:#9ca3af;}.mon.proxy{border-left-color:var(--accent);}
.mon .cn{font-weight:800;color:var(--navy);font-size:15px;} .mon .info{font-size:12.5px;color:var(--muted);margin-top:6px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 0 16px;}
.note{background:#fff8e1;border-left:4px solid #f1c40f;padding:9px 12px;border-radius:0 6px 6px 0;font-size:12.5px;margin-bottom:16px;}
.hours-row{display:flex;justify-content:space-between;padding:10px 12px;border-left:4px solid var(--green);background:#f6fbff;border-radius:6px;margin-bottom:8px;} .hours-row.sat{border-left-color:var(--blue);}
.tag{background:#eef2fb;color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin:2px;display:inline-block;}
.small{font-size:12px;color:var(--muted);} .badge-bad{color:var(--red);font-weight:700;font-size:11px;}
.feat{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;} .feat div{flex:1 1 210px;min-width:190px;max-width:320px;background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12.5px;border-left:4px solid var(--line);} .feat b{color:var(--navy);font-size:13px;} .feat .small{display:block;margin-top:2px;line-height:1.35;}
.feat div:nth-child(1){background:linear-gradient(135deg,#eaf1ff,#fbfdff);border-color:#d3e2ff;border-left-color:var(--blue);}
.feat div:nth-child(2){background:linear-gradient(135deg,#fff0ef,#fffbfb);border-color:#f4d3d1;border-left-color:var(--red);}
.feat div:nth-child(3){background:linear-gradient(135deg,#f3eaff,#fdfbff);border-color:#e0cef5;border-left-color:var(--accent);}
.feat div[onclick]{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;} .feat div[onclick]:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(37,99,235,.14);}
.setcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;} @media(max-width:820px){.setcols{grid-template-columns:1fr;}}
.teacherrow{padding:7px 2px;border-bottom:1px solid #eef1f6;}
.teacherrow .tname{width:160px;font-weight:600;}
.subchip{display:inline-flex;align-items:center;gap:5px;background:#eef2fb;color:#33415a;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:13px;}
.subchip b{cursor:pointer;color:#9aa3b6;font-weight:800;font-size:11px;line-height:1;} .subchip b:hover{color:#dc2626;}
.addsub{font-size:11.5px;padding:3px 7px;border:1px dashed #c3ccde;border-radius:8px;color:#5c6580;background:#fafbff;}
.nf{display:inline-flex;flex-direction:column;gap:1px;font-size:9.5px;color:#7c869c;font-weight:700;white-space:nowrap;} .nf input{font-weight:400;}
.clsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:6px 14px;margin-top:4px;max-width:1160px;margin-left:auto;margin-right:auto;}
.clsrow{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;padding:5px 7px;border:1px solid #eef1f6;border-radius:8px;background:#fafbfe;}
.clsrow input,.clsrow select{min-width:0;}
.clsrow input,.clsrow select{font-size:12.5px;padding:4px 6px;}
.clsrow .cn{width:104px;font-weight:600;}
.subgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px;margin-top:4px;}
.subrow{display:flex;gap:7px;align-items:center;flex-wrap:nowrap;padding:7px 10px;border:1px solid #eef1f6;border-radius:8px;background:#fafbfe;}
.subrow>input:first-child{flex:1 1 240px;min-width:130px;font-size:15px;font-weight:600;padding:6px 9px;}
.subrow .chk{flex:0 0 auto;}.subrow .smed{flex:0 0 auto;}.subrow>button{flex:0 0 auto;}
.subrow .smed{flex:0 0 auto;font-size:13px;font-weight:400;color:#4a5670;padding:5px 6px;background:#fff;}
.subrow .chk{font-size:13px;white-space:nowrap;color:#4a5670;}
.rmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 14px;margin-top:4px;max-width:1080px;margin-left:auto;margin-right:auto;}
.rmrow{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;padding:5px 7px;border:1px solid #eef1f6;border-radius:8px;background:#fafbfe;overflow:hidden;}
.rmrow>input:first-child{flex:1 1 60px;min-width:44px;font-size:13px;font-weight:600;padding:4px 6px;}
.rmrow>input.rmcap{flex:0 0 68px;width:68px;font-size:12.5px;font-weight:400;padding:4px 6px;}
.rmrow>button{flex:0 0 auto;}
.stugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:5px 10px;margin-top:4px;}
.sturow{display:flex;gap:5px;align-items:center;padding:4px 7px;border:1px solid #eef1f6;border-radius:8px;background:#fafbfe;overflow:hidden;}
.sturow>b{flex:1 1 auto;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sturow .tag{flex:0 0 auto;}
.sturow>button{flex:0 0 auto;}
.choicegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 12px;margin-top:4px;}
@media(max-width:640px){.clsgrid,.subgrid,.rmgrid,.stugrid,.choicegrid{grid-template-columns:1fr;}.clsrow{flex-wrap:wrap;}}
.listrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f2f6;} .listrow input{flex:1;}
.htabbar{padding:8px 10px;margin-bottom:10px;}
.htabs{display:flex;gap:8px;flex-wrap:wrap;}
.htab{border:1px solid #d8dff0;background:#f4f7fe;color:#334;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;}
.htab:hover{background:#e8eefc;}
.htab.on{background:#1F2B57;color:#fff;border-color:#1F2B57;}
.hoursCompact>div{margin-bottom:9px!important;}
.hoursCompact .row{margin-bottom:9px!important;row-gap:8px;}
.hoursCompact .desc{margin-bottom:7px;font-size:12px;}
.hoursCompact label{font-size:11px;}
.hoursCompact input,.hoursCompact select{padding:4px 7px;font-size:12.5px;}
.hoursCompact .hours-row{padding:6px 9px;margin:0 0 6px!important;}
.hoursCompact .tag{font-size:11px;padding:2px 6px;}
.hoursCompact .chk{font-size:12px;}
/* Onboarding checklist */
.obcard{border:none!important;background:transparent!important;padding:0!important;margin:0 0 12px!important;}
.obcard .desc{margin:1px 0 6px!important;font-size:13px!important;}
.obhead{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.obhead b{font-size:14px;}
.obgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:2px;}
.obitem{display:flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid #e3e9f5;border-radius:8px;background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:#33415c;}
.obitem:hover{border-color:#2563eb;}
.obitem.done{color:#166534;background:#f2fbf5;border-color:#c2edd6;}
.obck{font-size:16px;width:20px;text-align:center;color:#9aa7c2;}
.obitem.done .obck{color:#16a34a;}
/* Cookie consent banner */
.ckbanner{position:fixed;left:0;right:0;bottom:0;z-index:4000;background:#1F2B57;color:#fff;padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:0 -3px 16px rgba(0,0,0,.25);}
.ckbanner .ckmsg{font-size:13.5px;max-width:640px;line-height:1.45;}
.ckbanner a{color:#bfe0ff;text-decoration:underline;}
.ckbanner .ckbtns{display:flex;gap:8px;flex-wrap:wrap;}
.ckbtn{border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;}
.ckbtn.ok{background:#16a34a;color:#fff;}
.ckbtn.no{background:#31406b;color:#dbe4ff;}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:#eef2fb;padding:4px 8px;border-radius:12px;margin:2px;cursor:pointer;color:#333;} .chk input{margin:0;}
.wdchk{border:1px solid #d4dcf0;font-weight:600;}
.hoursCompact .wdchk{font-size:14px;padding:8px 15px;font-weight:700;}
.wdchk:has(input:checked){font-weight:800;}
.wd0:has(input:checked){background:#e0f2fe;color:#075985;border-color:#7dd3fc;}
.wd1:has(input:checked){background:#dcfce7;color:#166534;border-color:#86efac;}
.wd2:has(input:checked){background:#fef9c3;color:#854d0e;border-color:#fde047;}
.wd3:has(input:checked){background:#ffedd5;color:#9a3412;border-color:#fdba74;}
.wd4:has(input:checked){background:#fae8ff;color:#86198f;border-color:#f0abfc;}
.wd5:has(input:checked){background:#ede9fe;color:#5b21b6;border-color:#c4b5fd;}
.hoursCompact .wd5{background:#f6f3fe;color:#6d5bb5;}
.wdgap{display:inline-block;width:20px;}
.wdlbl{font-weight:700;color:#1F3864;margin-right:4px;}
.slotbox{border:1px solid #d9e4f5;border-left:5px solid var(--green);background:#f6fbff;border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.slotbox.sat{border-left-color:var(--accent);background:#faf8ff;border-color:#e6ddf7;}
.slotbox-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:7px;}
.slotbox-hd .st{font-size:15px;font-weight:800;color:var(--navy);}
.slotbox-hd .sm{font-size:12px;color:#5c6580;font-weight:600;}
.slotbox-hd .tm{font-size:14px;font-weight:800;color:var(--navy);}
.bellnotice{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;max-width:740px;}
.belltbl{border-collapse:collapse;width:auto;min-width:360px;margin-top:4px;} .belltbl th,.belltbl td{border:1px solid #cdd7f5;padding:5px 11px;text-align:center;font-size:13px;} .belltbl th{background:#1F3864;color:#fff;} .belltbl td:first-child,.belltbl th:first-child{text-align:left;} .belltbl tr.brk td{background:#f6f7fb;font-style:italic;color:#555;}
.guide{counter-reset:step;} .step{display:flex;gap:12px;margin-bottom:14px;} .step .no{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;} .step .txt b{color:var(--navy);} .step .txt{font-size:13.5px;}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);}
.okmsg{background:#d1fae5;color:#065f46;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;}
.wkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 12px;}
.wkbtn{padding:6px 14px;border:1.5px solid #c7d2fe;background:#fff;color:#1F3864;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;}
.wkbtn.on{background:#1F3864;color:#fff;border-color:#1F3864;}
.heat{border-collapse:collapse;} .heat td,.heat th{border:1px solid #e5e9f2;min-width:42px;height:34px;font-size:12.5px;padding:2px;} .heat th{background:#1F3864;color:#fff;font-weight:700;}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;} @media(max-width:900px){.ins-grid{grid-template-columns:1fr;}}
.errmsg{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;}
.lockbtn{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;line-height:1;padding:2px 5px;cursor:pointer;opacity:.55;transition:opacity .15s,background .15s;}
.lockbtn:hover{opacity:1;} .lockbtn.on{opacity:1;background:#fff7e6;border-color:#f0c46b;}
td.cell.locked{background:#fffbeb;} td.cell .cellhead{display:flex;justify-content:flex-end;align-items:center;margin-bottom:2px;}
.draghand{cursor:grab;opacity:.4;font-size:13px;line-height:1;user-select:none;margin-right:auto;} .draghand:hover{opacity:.9;}
td.cell.dragover{outline:2px dashed var(--accent);outline-offset:-2px;}
#printhead{display:none;}
@media print{
  header,.tabs,.savebadge{display:none !important;}
  .wrap{padding:0;max-width:100%;}
  .card{border:none;box-shadow:none;padding:0;margin:0;}
  .row,.desc,button,.note,.card>h2{display:none !important;}
  #diaryreport{border:1px solid #999 !important;padding:16px !important;}
  #printhead{display:block;text-align:center;margin-bottom:10px;} #printhead h3{margin:0;color:#000;} #printhead .sub{font-size:12px;color:#444;}
  table{font-size:12px;} th{background:#1F3864 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .conflict{outline:none;}
  /* Black & White print (save colour ink) — flatten all coloured cells to white/black */
  body.pbw #view table td, body.pbw #view table th{background:#fff !important;color:#000 !important;border-color:#000 !important;box-shadow:none !important;outline:none !important;}
  body.pbw #view table td *{color:#000 !important;}
  body.pbw #view table th{background:#e6e6e6 !important;}
  body.pbw #view table td{border:1px solid #000 !important;border-left:1px solid #000 !important;}
}

let LANG=(function(){try{return localStorage.getItem('tt_lang')||'en';}catch(e){return 'en';}})();
function t(k,vars){let s=(I18N[LANG]&&I18N[LANG][k]);if(s==null)s=I18N.en[k];if(s==null)s=k;if(vars)for(const p in vars)s=s.split('{'+p+'}').join(vars[p]);return s;}
function DD(){ if(rotMode())return Array.from({length:rotDays()},(_,i)=>rotLabel(i)); return (I18N[LANG]&&I18N[LANG]._days)||I18N.en._days;}
function setLang(l){LANG=l;try{track('language_changed',{lang:l});}catch(e){}try{localStorage.setItem('tt_lang',l);}catch(e){}document.documentElement.lang=l;applyChrome();if(!ME){renderLogin();return;}showUserChip();render();}
function buildLangSel(){const s=document.getElementById('langsel');s.innerHTML=LANGS.map(([c,n])=>`<option value="${c}" ${c===LANG?'selected':''}>🌐 ${n}</option>`).join('');}
function applyChrome(){document.getElementById('apptitle').textContent=t('app_title');document.getElementById('appsub').textContent=t('app_sub');const s=document.getElementById('langsel');if(s)s.value=LANG;}

/* ============================ auth / login ============================ */
async function boot(){document.documentElement.lang=LANG;buildLangSel();applyChrome();
  if(!AUTH){renderLogin();return;}
  try{ME=await api('GET','/api/me');}catch(e){ME=null;}
  if(!ME||!ME.id){renderLogin();return;}
  loggedOut=false;startApp();}
async function startApp(){loggedOut=false;
  try{SCHOOLS=await api('GET','/api/schools');}catch(e){SCHOOLS=[];}
  if(!SCHOOL || !SCHOOLS.find(s=>String(s.id)===String(SCHOOL))) SCHOOL=(ME&&ME.school_id)?String(ME.school_id):(SCHOOLS[0]?String(SCHOOLS[0].id):null);
  try{if(SCHOOL)localStorage.setItem('tt_school',SCHOOL);}catch(e){}
  refreshModulesOff();
  showUserChip();showSchoolBar();try{track('app_open',{});}catch(e){}ensureCookieBanner();loadAll();}
function showSchoolBar(){const hdr=document.querySelector('header');let el=document.getElementById('schoolbar');
  if(!el){el=document.createElement('div');el.id='schoolbar';el.style.cssText='display:flex;align-items:center;gap:6px;color:#fff;font-size:13px;margin-left:12px';hdr.insertBefore(el, document.getElementById('userchip')||document.getElementById('saved'));}
  const cur=SCHOOLS.find(s=>String(s.id)===String(SCHOOL));const nm=s=>String(s&&s.name||'').replace(/</g,'&lt;');
  const logo=cur&&cur.logo?`<img src="${cur.logo}" style="height:26px;max-width:60px;border-radius:5px;background:#fff;padding:1px;vertical-align:middle">`:'';
  if(ME&&ME.role==='master'&&SCHOOLS.length>1){
    el.innerHTML=`${logo||'🏫'} <select title="${t('switch_school')}" onchange="switchSchool(this.value)" style="background:#2c4a7c;color:#fff;border:1px solid #3f5f95;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:600">${SCHOOLS.map(s=>`<option value="${s.id}" ${String(s.id)===String(SCHOOL)?'selected':''}>${nm(s)}${s.board?' · '+s.board:''}</option>`).join('')}</select>`;
  } else if(cur){ el.innerHTML=`<span style="opacity:.92;display:flex;align-items:center;gap:6px">${logo||'🏫'} ${nm(cur)}${cur.board?' · '+cur.board:''}</span>`; }
  else el.innerHTML='';}
function switchSchool(id){SCHOOL=String(id);try{localStorage.setItem('tt_school',SCHOOL);}catch(e){}tab='dash';refreshModulesOff();showSchoolBar();loadAll();}
function renderLogin(){loggedOut=false;const tb=document.getElementById('tabs');if(tb)tb.innerHTML='';const uc=document.getElementById('userchip');if(uc)uc.remove();const sb=document.getElementById('schoolbar');if(sb)sb.remove();
  document.getElementById('view').innerHTML=`<div class="card" style="max-width:400px;margin:48px auto">
    <h2>${t('login_title')}</h2><div class="desc">${t('login_sub')}</div>
    <div style="margin-bottom:4px"><label>${t('login_id')}</label><input id="li_user" style="width:100%" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="small" style="color:#5c6580;margin-bottom:10px">${t('login_hint')}</div>
    <div style="margin-bottom:14px"><label>${t('login_pw')}</label><input id="li_pw" type="password" style="width:100%" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="green" style="width:100%" onclick="doLogin()">${t('login_btn')}</button>
    <div id="li_err" class="errmsg" style="display:none;margin-top:10px"></div>
    <div style="text-align:center;margin-top:16px;border-top:1px solid #eef1f9;padding-top:14px"><a href="#" onclick="renderSignup();return false" style="color:#6b3fa0;font-size:13px;font-weight:600">${t('signup_link')}</a></div></div>`;
  ensureCookieBanner();const f=document.getElementById('li_user');if(f)f.focus();}
const BOARDS=['CBSE','ICSE / CISCE','IB (International Baccalaureate)','IGCSE / Cambridge','State Board','NIOS','Other'];
function renderSignup(){loggedOut=false;const tb=document.getElementById('tabs');if(tb)tb.innerHTML='';const uc=document.getElementById('userchip');if(uc)uc.remove();
  document.getElementById('view').innerHTML=`<div class="card" style="max-width:430px;margin:36px auto">
    <h2>${t('signup_title')}</h2><div class="desc">${t('signup_sub')}</div>
    <div style="margin-bottom:10px"><label>${t('su_school')}</label><input id="su_school" style="width:100%"></div>
    <div style="margin-bottom:10px"><label>${t('su_board')}</label><select id="su_board" style="width:100%"><option value="">—</option>${BOARDS.map(b=>`<option value="${b}">${b}</option>`).join('')}</select></div>
    <div style="margin-bottom:10px"><label>${t('su_medium')}</label><select id="su_medium" style="width:100%"><option value="">—</option>${['Gujarati','Hindi','Marathi','English','Semi-English','Tamil','Telugu','Bengali','Punjabi','Other'].map(m=>`<option value="${m}">${m}</option>`).join('')}</select></div>
    <div style="margin-bottom:10px"><label>${t('su_username')}</label><input id="su_user" style="width:100%" autocomplete="username"></div>
    <div style="margin-bottom:10px"><label>${t('su_email')}</label><input id="su_email" type="email" style="width:100%"></div>
    <div style="margin-bottom:10px"><label>${t('su_mobile')}</label><input id="su_mobile" style="width:100%"></div>
    <div style="margin-bottom:14px"><label>${t('su_password')}</label><input id="su_pw" type="password" style="width:100%" autocomplete="new-password" onkeydown="if(event.key==='Enter')doSignup()"></div>

function slotsFor(di){
  if(!WD().includes(di))return [];
  const sat = rotMode() ? false : (di===5);
  const end=sat?config.saturday_end:config.weekday_end;
  const periodMin=+(sat&&config.sat_period_minutes!=null?config.sat_period_minutes:config.period_minutes);
  const durs=csvNums(sat&&config.sat_period_durations!=null?config.sat_period_durations:config.period_durations);
  const shortAfter=new Set(csvNums(sat&&config.sat_short_break_after!=null?config.sat_short_break_after:config.short_break_after));
  const shortMin=+(sat&&config.sat_short_break_minutes!=null?config.sat_short_break_minutes:config.short_break_minutes)||0;
  const lunchAfter=+(sat&&config.sat_lunch_after!=null?config.sat_lunch_after:(config.lunch_after!=null?config.lunch_after:config.break_after_period));
  const lunchMin=+(sat&&config.sat_lunch_minutes!=null?config.sat_lunch_minutes:(config.lunch_minutes!=null?config.lunch_minutes:config.break_minutes))||0;
  const N=+(sat&&config.sat_num_periods!=null?config.sat_num_periods:config.num_periods)||0;
  const CAP=20;
  let s=[],t=(sat&&config.saturday_start)?config.saturday_start:config.weekday_start,i=0;
  while(true){const dur=durs[i]||periodMin;const e=addMin(t,dur);
    s.push({i,label:"P"+(i+1),start:t,end:e,brk:false});i++;
    const stop=N>0?i>=Math.min(N,CAP):e>=end;
    if(stop||i>=CAP)break;t=e;
    if(lunchAfter&&i===lunchAfter&&lunchMin>0){const be=addMin(t,lunchMin);s.push({brk:true,kind:'lunch',label:"Lunch",start:t,end:be});t=be;}
    if(shortAfter.has(i)&&shortMin>0){const be=addMin(t,shortMin);s.push({brk:true,kind:'short',label:"Break",start:t,end:be});t=be;}}
  return s;
}

// Give every box on a page its own soft light colour (cards, KPI tiles, dropdowns & inputs). Boxes that set their own background keep it; timetable-grid cells are left alone.
const BOXPAL=[['#eef4ff','#cdddf5'],['#eafaf0','#c7ead6'],['#fff7e8','#f3e4bf'],['#f6efff','#e4d4f5'],['#fff0f1','#f7d4d8'],['#eafcff','#c8ebf0'],['#f2fae2','#dbe9bd'],['#fdf0f8','#f4d2e4'],['#eef7ff','#cfe0f5'],['#fef6ec','#f2e0c2']];
const BOXSEL='.card,.kpi,.qcell,.clsrow,.subrow,.rmrow,.sturow,.listrow,.mon,.note,select,input:not([type=checkbox]):not([type=radio]):not([type=file]),button';
const IOBTN=/printDoc|printAll|printPlain|doImport|doHoursImport|fillTemplate|formatExcel|dl\(/;  // print / all-print / excel / import / upload / download buttons
let _bxi=0;
function paintBoxes(){
  const v=document.getElementById('view'); if(!v)return;
  v.querySelectorAll(BOXSEL).forEach(el=>{
    if(el.dataset.bx)return;                                            // already handled
    const st=el.getAttribute('style')||'';
    if(/background/i.test(st)){el.dataset.bx='1';return;}               // keeps its own colour (special cards)
    const topCard=el.classList.contains('card')&&el.parentNode===v;
    if(topCard){
      if(el.classList.contains('htabbar')){el.style.background='#fff';}   // keep the sub-tab bar as a plain white bar
      else if(el.classList.contains('obcard')){/* keep the Getting-started box visible with its own light frame */}
      else{el.style.background='transparent';el.style.border='none';el.style.padding='0';}  // REMOVE the big page-wrapper card → content goes edge-to-edge (full width, easier one-page layout)
      el.dataset.bx='1';return;
    }
    if(el.tagName==='BUTTON'){                                            // colour the print / excel / import / export / upload / download buttons light; leave other buttons as-is
      if(IOBTN.test(el.getAttribute('onclick')||'')){
        const q=BOXPAL[_bxi++%BOXPAL.length];
        el.style.background=q[0]; el.style.color='#33415c'; el.style.border='1px solid '+q[1];
      }
      el.dataset.bx='1';return;
    }
    const rowBox=/(^|\s)(clsrow|subrow|rmrow|sturow|listrow)(\s|$)/.test(el.className);
    if(rowBox){el.style.background='#fff';el.dataset.bx='1';return;}       // list-row container boxes stay white
    if((el.tagName==='SELECT'||el.tagName==='INPUT')&&el.closest('table'))return; // don't rainbow the timetable grid inputs
    const p=BOXPAL[_bxi++%BOXPAL.length];
    el.style.background=p[0]; el.style.borderColor=p[1]; el.dataset.bx='1';
  });
}

        await loadAll();toast(t('toast_local_restored',{n:r.cells||0}));setTab('class');

function pickLogo(id){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(inp);
  const cleanup=()=>{try{document.body.removeChild(inp);}catch(e){}};
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];
    if(!f){cleanup();return;}
    if(f.type && !/^image\//.test(f.type)){ cleanup(); showErr(t('logo_bad_type')+' ('+(f.type||f.name)+')'); return; }
    if(f.size>8*1024*1024){ cleanup(); showErr(t('logo_big_file')); return; }
    const rd=new FileReader();
    rd.onerror=()=>{cleanup();showErr(t('logo_read_err'));};
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{ let w=img.width,h=img.height; const max=280;
          if(w>max||h>max){const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r);}
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
          let out=cv.toDataURL('image/png');
          if(out.length>1200000) out=cv.toDataURL('image/jpeg',0.85);   // large/photographic → JPEG to stay small
          updSchool(id,{logo:out});
        }catch(e){ if(String(rd.result).length<2000000) updSchool(id,{logo:rd.result}); else toast(t('logo_too_big')); }
        cleanup();
      };
      img.onerror=()=>{ if(String(rd.result).length<2000000) updSchool(id,{logo:rd.result}); else toast(t('logo_too_big')); cleanup(); };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function removeLogo(id){updSchool(id,{logo:''});}

function pickAndPost(url, filename, extra){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls';
  inp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(inp);
  const cleanup=()=>{try{document.body.removeChild(inp);}catch(e){}};
  inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f){cleanup();return;}
    const fd=new FormData(); fd.append('file',f); if(extra)for(const k in extra)fd.append(k,extra[k]||'');
    toast(t('please_wait'));
    try{ const hd={}; if(AUTH)hd['Authorization']='Bearer '+AUTH; if(SCHOOL)hd['X-School-Id']=SCHOOL;
      const r=await fetch(url,{method:'POST',headers:hd,body:fd});
      if(!r.ok){ const d=await r.json().catch(()=>({})); toast((d&&d.error)||t('report_failed')); cleanup(); return; }
      const blob=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); toast(t('report_ready'));
    }catch(e){ toast(t('report_failed')); }
    cleanup();
  };
  inp.click();
}

function staffingCoverageHTML(){
  if(!subjects.length||!teachers.length) return '';
  const ord={none:0,vuln:1,ok:2,well:3}; const badge={none:'⚫',vuln:'🔴',ok:'🟡',well:'🟢'};
  const rows=subjects.map(s=>{
    const canTeach=teachers.filter(t=>(t.subjects||[]).includes(s.id)||t.main_subject_id===s.id);
    const total=canTeach.length;
    const prim=teachers.filter(t=>t.main_subject_id===s.id||((t.subjects||[])[0]===s.id)).length;
    let st; if(total===0)st='none'; else if(total===1)st='vuln'; else if(prim>=2)st='well'; else st='ok';
    return {name:s.name,total,prim,st};
  }).sort((a,b)=>ord[a.st]-ord[b.st]||String(a.name).localeCompare(String(b.name)));
  const c=k=>rows.filter(r=>r.st===k).length;
  const summary=`🟢 ${c('well')} · 🟡 ${c('ok')} · 🔴 ${c('vuln')} · ⚫ ${c('none')}`;
  const risk=c('vuln')+c('none');   // count of subjects needing attention
  const td='padding:3px 6px;border-top:1px solid #eef2ff';
  const list=rows.map(r=>`<tr><td style="${td};text-align:center">${badge[r.st]}</td><td style="${td}">${sesc(r.name)}</td><td style="${td};text-align:center">${r.total}</td><td style="${td};text-align:center">${r.prim}</td><td style="${td};color:#5c6580;font-size:12px">${t('cov_'+r.st)}</td></tr>`).join('');
  return `<details class="obcard" style="margin:2px 0 12px;border:1px solid #e5e7fb;border-radius:10px;padding:8px 12px;background:#fbfcff">
    <summary style="cursor:pointer;font-weight:800;color:#1F3864">📊 ${t('cov_title')} <span class="small" style="font-weight:500;color:#5c6580">— ${summary}</span>${risk?`<span class="tag" style="background:#fee2e2;color:#991b1b;font-weight:700;font-size:11px;margin-left:6px">${risk} ⚠</span>`:''} <span class="small" style="color:#94a3b8;font-weight:500">(${t('cov_tap')})</span></summary>
    <div class="small" style="color:#5c6580;margin:5px 0 7px">${t('cov_desc')}</div>
    <div style="overflow:auto"><table style="border-collapse:collapse;width:100%;font-size:13px">
      <tr style="background:#eef2ff"><th style="padding:3px 6px"></th><th style="padding:3px 6px;text-align:left">${t('subject')}</th><th style="padding:3px 6px">${t('cov_teachers')}</th><th style="padding:3px 6px">${t('cov_primary')}</th><th style="padding:3px 6px;text-align:left">${t('deo_status')}</th></tr>
      ${list}</table></div></details>`;
}

  const r=await api('POST','/api/users',{login_id:login,name:t2.name,role,main_subject_id:t2.main_subject_id||null,qualification:t2.qualification||null});

async function saveNewTeacher(){
  const name=(document.getElementById('na_name').value||'').trim();
  const msg=document.getElementById('addtchmsg');
  if(!name){if(msg){msg.style.color='#c0392b';msg.textContent='⚠ '+t('teacher_need_name');}var n=document.getElementById('na_name');if(n)n.focus();return;}
  const subs=[...document.querySelectorAll('.na_subj:checked')].map(x=>+x.value);
  const body={name:name,subjects:subs,
    qualification:(document.getElementById('na_qual').value||'').trim()||null,
    main_subject_id:document.getElementById('na_main').value?+document.getElementById('na_main').value:null,
    max_load:+document.getElementById('na_load').value||null};
  if(msg){msg.style.color='#5c6580';msg.textContent='⏳ '+t('saving')||'…';}
  const res=await api('POST','/api/teachers',body);
  if(!res||res.error){if(msg){msg.style.color='#c0392b';msg.textContent='⚠ '+((res&&res.error)||t('save_failed'));}showErr(((res&&res.error)||t('save_failed')));return;}
  const perday=+document.getElementById('na_perday').value||null;
  const consec=+document.getElementById('na_consec').value||null;
  const cansub=document.getElementById('na_cansub').checked?1:0;
  const desig=(document.getElementById('na_desig').value||'').trim()||null;
  const sanc=+document.getElementById('na_sanc').value||null;
  if(res.id&&(perday!==null||consec!==null||cansub!==1||desig!==null||sanc!==null)){
    await api('PUT','/api/teachers/'+res.id,{max_per_day:perday,max_consecutive:consec,can_substitute:cansub,designation:desig,sanctioned_load:sanc});
  }
  addTch=false;
  toast('✓ '+name+' — '+t('saved'));
  await loadAll();
}

function _bellMins(a,b){ try{const x=a.split(':').map(Number),y=b.split(':').map(Number);return (y[0]*60+y[1])-(x[0]*60+x[1]);}catch(e){return '';} }

function _bellTable(di,label){
  const slots=slotsFor(di); if(!slots.length)return '';
  const rows=slots.map(s=>{const nm=s.brk?(s.kind==='lunch'?('🍽 '+t('lunch_word')):('☕ '+t('brk'))):(t('bell_period')+' '+(s.i+1));
    return `<tr class="${s.brk?'brk':''}"><td style="text-align:left">${nm}</td><td>${_bellMins(s.start,s.end)} ${t('bell_min')}</td><td>${s.start}</td><td>${s.end}</td></tr>`;}).join('');
  return `<div style="margin-top:10px"><div style="font-weight:800;color:#1F3864;margin-bottom:3px">${label} <span style="font-weight:500;color:#666;font-size:12px">(${slots.filter(s=>!s.brk).length} ${t('periods_word')})</span></div>
    <table class="belltbl"><thead><tr><th style="text-align:left">${t('bell_col_period')}</th><th>${t('bell_col_dur')}</th><th>${t('bell_col_from')}</th><th>${t('bell_col_to')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

async function doHoursImport(){
  const f=document.getElementById('hrsfile').files[0]; const box=document.getElementById('hrsresult');
  if(!f){showErr(t('err_choose_file'));return;}
  if(!/\.xlsx$/i.test(f.name)){showErr(t('err_need_xlsx')+' ('+f.name+')');return;}
  box.innerHTML='<div class="small" style="color:#5c6580">'+t('please_wait')+'</div>';
  const fd=new FormData(); fd.append('file',f);
  const hd={}; if(AUTH)hd['Authorization']='Bearer '+AUTH; if(SCHOOL)hd['X-School-Id']=SCHOOL;
  let r,d=null;
  try{ r=await fetch('/api/import/hours',{method:'POST',headers:hd,body:fd}); }catch(e){ box.innerHTML=''; showErr(t('import_failed')+' — '+(e&&e.message||e)); return; }
  try{ d=await r.json(); }catch(e){ d=null; }
  if(r.ok&&d&&d.ok){ const wd=d.weekday||{}; box.innerHTML=`<div class="okmsg">${t('autofill_ok',{p:wd.num||0})}</div>`; await loadAll(); toast(t('autofill_ok',{p:wd.num||0})); }
  else { const msg=(d&&d.error)||('HTTP '+(r?r.status:'?')); box.innerHTML=`<div class="errmsg">${msg}</div>`; showErr(t('import_failed')+' — '+msg); }
}

function _hexLight(hex,m){ if(m==null)m=0.58; hex=String(hex||'').replace('#',''); if(hex.length===3)hex=hex.split('').map(c=>c+c).join(''); const n=parseInt(hex,16); if(isNaN(n))return '#eef2f7'; let r=(n>>16)&255,g=(n>>8)&255,b=n&255; r=Math.round(r+(255-r)*m);g=Math.round(g+(255-g)*m);b=Math.round(b+(255-b)*m); return 'rgb('+r+','+g+','+b+')'; }

function scrollStuTop(){
  const doIt=()=>{ try{
    let n=document.getElementById('stuTop');
    // reset EVERY scrollable ancestor (the app may scroll an inner container, not window)
    let a=n; while(a){ try{ if(a.scrollHeight>a.clientHeight+2) a.scrollTop=0; }catch(e){} a=a.parentElement; }
    try{ if(document.scrollingElement) document.scrollingElement.scrollTop=0; }catch(e){}
    try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; window.scrollTo(0,0); }catch(e){}
  }catch(e){} };
  // fire now + over the next ~0.5s to beat re-layout, scroll-anchoring, and any lingering animation
  doIt(); try{ requestAnimationFrame(doIt); }catch(e){} setTimeout(doIt,120); setTimeout(doIt,300); setTimeout(doIt,500);
}

async function cbCreate(){
  const subs=subjects.filter(s=>cbSubs[s.id]&&cbSubs[s.id].on);
  if(!curSClass){ showErr('Select a class first'); return; }
  if(subs.length<2){ showErr('Tick at least 2 subjects to combine'); return; }
  if(!cbDays.size){ showErr('Tick at least one day'); return; }
  if(!cbPeriods.size){ showErr('Tick at least one period'); return; }
  const name=subs.map(s=>s.name).join(' / ');
  const clsName=(classes.find(c=>c.id===curSClass)||{}).name||'';
  let slots=0, errs=0;
  for(const di of [...cbDays]){ for(const pi of [...cbPeriods]){
    const r=await api('POST','/api/electives',{class_id:curSClass,name:name,day_of_week:di,period_index:pi,week_index:0});
    if(r&&r.error){ errs++; continue; } slots++;
    for(const s of subs){ const c=cbSubs[s.id]; await api('POST','/api/elective-options',{elective_id:r.id,label:s.name,subject_id:s.id,teacher_id:(c&&c.teacher)||null,room_id:null}); }
  }}
  const wasEdit=cbEditIds.length; const back=cbPrevClass;
  if(slots && wasEdit){ for(const id of cbEditIds){ await api('DELETE','/api/electives/'+id); } }
  cbSubs={}; cbDays=new Set(); cbPeriods=new Set(); cbEditIds=[]; cbPrevClass=null;
  if(slots) showOk('✅ '+name+' → '+clsName+(wasEdit?' updated':' added')+' ('+slots+' slot'+(slots===1?'':'s')+(errs?', '+errs+' failed':'')+')');
  else showErr('❌ Nothing '+(wasEdit?'updated':'created')+(errs?' — '+errs+' failed':''));
  if(wasEdit && back!=null && back!==curSClass){ curSClass=back; curStudent=null; }
  await loadStudents();
  scrollStuTop();
}

async function loadAvail(){ const ents=availEntities(); if(!availEntity||!ents.find(e=>e.id===availEntity)) availEntity=ents[0]?ents[0].id:null;
  if(!availEntity){ availBlocks=new Set(); renderAvail(); return; }
  let list=[]; try{list=await api('GET','/api/avail?entity_type='+availType+'&entity_id='+availEntity);}catch(e){list=[];}
  availBlocks=new Set((Array.isArray(list)?list:[]).map(x=>x.day_of_week+'_'+x.period_index)); renderAvail();
}
async function toggleAvail(di,pi){ if(!availEntity)return; const key=di+'_'+pi; const willBlock=!availBlocks.has(key);
  if(willBlock)availBlocks.add(key); else availBlocks.delete(key); renderAvail();
  await api('POST','/api/avail',{entity_type:availType,entity_id:availEntity,day_of_week:di,period_index:pi,blocked:willBlock});
}
function renderQuota(){ const box=document.getElementById('quotabox'); if(!box)return;
  let totalSlots=0; DAYS.forEach((_,di)=>totalSlots+=slotsFor(di).filter(s=>!s.brk).length);
  const q={},qt={}; quotaData.forEach(x=>{q[x.subject_id]=x.per_week; qt[x.subject_id]=x.teacher_id;});
  // Combined (group-split / student-choice) subjects in THIS class share one slot for two subjects, so they must NOT also be counted in Weekly Quota (that double-counts).
  const combSubj=new Set(); const groups={}; (quotaElecs||[]).forEach(e=>{ groups[e.name]=(groups[e.name]||0)+1; (e.options||[]).forEach(o=>{ if(o.subject_id!=null) combSubj.add(o.subject_id); }); });
  const combSlots=(quotaElecs||[]).length;
  let regSum=0; const dblWarn=[];
  actSubs().forEach(s=>{ const pw=+q[s.id]||0; if(combSubj.has(s.id)){ if(pw>0) dblWarn.push(s); } else regSum+=pw; });
  const realTotal=regSum+combSlots; const over=realTotal>totalSlots;
  box.innerHTML=`<div class="quotagrid">${actSubs().map(s=>{
     const tid=qt[s.id]; const cans=subTeachers(s.id); const inC=combSubj.has(s.id); const pw=+q[s.id]||0; const bad=inC&&pw>0;
     const tsel=`<select class="qtsel" id="qt_${s.id}" title="Teacher for ${sesc(s.name)} in this class (⚙ Auto = app decides)" onchange="saveQuotaRow(${s.id})"><option value="">⚙ Auto</option>${cans.map(tt=>`<option value="${tt.id}" ${tid===tt.id?'selected':''}>${sesc(tt.name)}</option>`).join('')}</select>`;
     return `<label class="qcell" title="${s.name}${inC?' — 🧩 combine me hai; yahan quota mat do':''}" style="${bad?'border-color:#f3c4c0;background:#fff5f5':''}"><span class="qname">${inC?'🧩 ':''}${s.name}</span>
       <input id="qn_${s.id}" type="number" min="0" value="${pw}" onchange="saveQuotaRow(${s.id})">${tsel}</label>`;
   }).join('')}</div>
     <div class="qtotal" style="${over?'color:#991b1b':''}">Total: ${realTotal} / ${totalSlots} slots <span class="small" style="font-weight:500;color:#5c6580">(regular ${regSum} + 🧩 combined ${combSlots})</span>${over?' <span style="font-weight:800">— OVER slots!</span>':''}</div>
     ${combSlots?`<div class="note" style="font-size:12.5px;margin-top:6px">🧩 <b>Combined periods in this class (${combSlots} slots):</b> ${Object.keys(groups).map(n=>sesc(n)+' '+groups[n]).join(' · ')}. Har slot me class do groups me batti hai (dono subject ek hi period me) — isliye ye ⬆ 🧩 wale subjects Weekly Quota me alag se <b>nahi</b> gine jaate.</div>`:''}
     ${dblWarn.length?`<div class="card" style="background:#fff5f5;border:1px solid #f3c4c0;margin-top:8px;padding:9px 12px"><b style="color:#b4443a">⚠ Ye subject combine me bhi hain aur Weekly Quota me bhi (double count):</b> ${dblWarn.map(s=>sesc(s.name)).join(', ')}. <div style="margin-top:6px">Inhe 0 kar do — combine already inhe schedule kar raha hai. <button class="green mini" onclick="zeroCombineQuota()">✓ In sabko 0 karo</button></div></div>`:''}
     <div id="quotaWorkload" style="margin-top:14px"></div>`;
  loadWorkload();
}
async function zeroCombineQuota(){
  const combSubj=new Set(); (quotaElecs||[]).forEach(e=>(e.options||[]).forEach(o=>{ if(o.subject_id!=null) combSubj.add(o.subject_id); }));
  const toZero=quotaData.filter(x=>combSubj.has(x.subject_id)&&(+x.per_week||0)>0);
  for(const x of toZero){ await api('PUT','/api/quota',{class_id:curClass,subject_id:x.subject_id,per_week:0,teacher_id:x.teacher_id||null}); }
  toast(); await loadQuota();
}
async function saveQuotaRow(subject_id){
  const per_week=+((document.getElementById('qn_'+subject_id)||{}).value)||0;
  const tv=(document.getElementById('qt_'+subject_id)||{}).value;
  await api('PUT','/api/quota',{class_id:curClass,subject_id,per_week,teacher_id:tv?+tv:null}); toast(); await loadQuota();
}
async function setQuota(subject_id,per_week){ await api('PUT','/api/quota',{class_id:curClass,subject_id,per_week}); toast(); await loadQuota(); }
async function loadWorkload(){
  const box=document.getElementById('quotaWorkload'); if(!box)return;
  let rows; try{rows=await api('GET','/api/teacher-workload');}catch(e){box.innerHTML='';return;}
  if(!Array.isArray(rows)||!rows.length){ box.innerHTML='<div class="note" style="font-size:12.5px">💡 Teacher-wise bifurcation: har subject ke aage ⚙ Auto ke bajaye ek teacher chuno — us class ka wo subject sirf usi teacher ko milega. Kisi teacher ko pin karte hi uska total (sab classes milakar) yahan dikhega.</div>'; return; }
  const byT={}; rows.forEach(r=>{ const b=byT[r.teacher_id]=byT[r.teacher_id]||{total:0,subs:{}}; b.total+=(+r.per_week||0); b.subs[r.subject_id]=(b.subs[r.subject_id]||0)+(+r.per_week||0); });
  const sn=id=>{const s=subjects.find(x=>x.id===id);return s?s.name:'#'+id;};
  const tn=id=>{const x=teachers.find(y=>y.id===id);return x?x.name:'#'+id;};
  const cards=Object.keys(byT).map(k=>{ const tid=+k, b=byT[tid]; const cap=(teachers.find(y=>y.id===tid)||{}).max_load;
     const over=cap&&b.total>cap; const capStr=cap?(' / '+cap):'';
     const subLine=Object.keys(b.subs).map(sid=>`<span class="tag" style="background:#eef2ff;color:#1F3864">${sesc(sn(+sid))} ${b.subs[sid]}</span>`).join(' ');
     return `<div style="border:1px solid #e5e7fb;border-radius:8px;padding:7px 11px;background:#fff;margin-bottom:6px">
       <b>${sesc(tn(tid))}</b> — <b style="color:${over?'#991b1b':'#0e7c56'}">${b.total}${capStr} period/week</b>${over?' <span style="color:#991b1b;font-weight:700">⚠ load cap se zyada</span>':''}
       <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">${subLine}</div></div>`;
  }).join('');
  box.innerHTML=`<div style="font-weight:800;color:#1F3864;margin-bottom:6px">📊 Teacher workload — pinned (all classes)</div>${cards}<div class="note" style="font-size:12px;margin-top:2px">Yeh sirf un rows ko ginta hai jinme aapne teacher pin kiya hai. Total = sab classes milakar. Auto-generate in teachers ko unke pinned periods pe hi lagayega.</div>`;
}

  const bar=subTabBar([['export','⬇ '+t('export_title')],['import','⬆ '+t('import_title')],['cleanup','🧹 Cleanup']],dataTab,'setDataTab');
  const secExport=`<div class="card"><h2>${t('export_title')}</h2><div class="desc">${t('export_desc')}</div>
     <div class="row"><button onclick="dl('/api/export/timetable.xlsx')">${t('btn_exp_tt')}</button>
       <button class="ghost" onclick="dl('/api/export/setup.xlsx')">${t('btn_exp_setup')}</button></div>
     <div class="note" style="margin-top:12px">${t('export_tip')}</div></div>`;
  const secImport=`<div class="card"><h2>${t('import_title')}</h2><div class="desc">${t('import_desc')}</div>
     <div class="row" style="margin-bottom:10px"><button class="ghost" onclick="dl('/api/export/setup-template.xlsx')">${t('btn_download_template')}</button></div>
     <div class="dropzone"><input type="file" id="impfile" accept=".xlsx"><div style="margin-top:8px"><button onclick="doImport()">${t('btn_import_file')}</button></div></div>

function cleanupCard(){
  const opt=(v,l)=>`<option value="${v}">${l}</option>`;
  return `<div class="card" style="border:1.5px solid #f0d089;background:#fffdf5;margin-top:14px">
    <h2 style="margin:0 0 2px">🧹 Data Cleanup <span class="small" style="color:#a97400;font-weight:700">(Admin — this school only)</span></h2>
    <div class="desc">Clear a single field, a whole section, or a full list — so you can fix a mistake and re-enter fresh data. This permanently removes the selected data for <b>${(SCHOOLS.find(s=>String(s.id)===String(SCHOOL))||{}).name||'this school'}</b> and cannot be undone. Your school, its settings and user logins are always kept.</div>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
      <select id="cleansel" style="min-width:320px">
        <optgroup label="Clear a field (blank it for all rows)">
          ${opt('t_qual','Teachers → Qualification')}${opt('t_main','Teachers → Main subject')}${opt('t_caps','Teachers → Weekly load & period caps')}${opt('t_canteach','Teachers → Can-teach subjects')}
          ${opt('s_medium','Subjects → Medium')}${opt('s_double','Subjects → Double-period flag')}
          ${opt('c_struct','Classes → Board / Medium / Standard / Section')}${opt('c_teacher','Classes → Class teacher')}
          ${opt('r_cap','Rooms → Capacity')}
        </optgroup>
        <optgroup label="Clear a section (delete data, keep the lists)">
          ${opt('d_timetable','Timetable (generated periods)')}${opt('d_quota','Weekly quota')}${opt('d_chapters','Chapters')}${opt('d_avail','Availability blocks')}${opt('d_subs','Substitutions, leaves & absences')}${opt('d_diary','Teacher diary')}${opt('d_versions','Saved timetable versions')}${opt('d_combines','Combined classes')}${opt('d_students','Students & electives')}${opt('d_rules','Subject placement rules')}
        </optgroup>
        <optgroup label="Clear a whole list (+ its data)">
          ${opt('m_subjects','ALL subjects (+ timetable, quota, chapters)')}${opt('m_classes','ALL classes (+ their timetable, quota, students)')}${opt('m_teachers','ALL teachers (+ their links, keep cells)')}${opt('m_rooms','ALL rooms (+ unset from timetable)')}
        </optgroup>
      </select>
    </div>
    <label class="chk" style="margin-top:10px;font-weight:700;color:#a97400"><input type="checkbox" id="cleanack" onchange="var d=!this.checked,a=document.getElementById('cleanbtn'),b=document.getElementById('resetbtn');if(a)a.disabled=d;if(b)b.disabled=d;"> I understand — this permanently deletes the selected data and cannot be undone</label>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
      <button id="cleanbtn" class="ghost" disabled style="border-color:#e0a800;color:#a97400;font-weight:700" onclick="var s=document.getElementById('cleansel');adminClean(s.value,s.options[s.selectedIndex].text)">🧹 Clear selected</button>
      <span style="flex:1;min-width:10px"></span>
      <input id="resetconfirm" placeholder="type the school name…" style="width:190px" title="Required for a full reset or clearing a whole list">
      <button id="resetbtn" class="ghost red" disabled style="font-weight:700" onclick="adminFullReset()">⚠ Full reset — wipe everything</button>
    </div>
    <div class="note" style="margin-top:6px">Safety: tick the box to enable the buttons. To clear a <b>whole list</b> or do a <b>Full reset</b>, you must also type the exact school name in the box above.</div>
    <div id="cleanmsg" style="margin-top:10px"></div>
  </div>`;
}
let _cleanPending=null;
function showCleanConfirm(msg){
  const box=document.getElementById('cleanmsg'); if(!box)return;
  box.innerHTML='<div style="background:#fff3cd;border:1px solid #f0d089;border-radius:8px;padding:10px 12px"><b style="color:#a15c00">⚠ '+String(msg).replace(/</g,'&lt;')+'</b><div class="row" style="gap:8px;margin-top:9px"><button class="green" onclick="adminCleanGo()">✓ Yes, clear it</button><button class="ghost" onclick="adminCleanCancel()">✕ No, cancel</button></div></div>';
  box.scrollIntoView({block:'nearest'});
}
function adminCleanCancel(){ _cleanPending=null; const b=document.getElementById('cleanmsg'); if(b)b.innerHTML=''; }
async function adminCleanGo(){
  const p=_cleanPending; if(!p)return; _cleanPending=null;
  const box=document.getElementById('cleanmsg'); if(box)box.innerHTML='<span class="small" style="color:#5c6580">⏳ Working…</span>';
  const res=await api('POST','/api/admin/clean',{target:p.target,confirm:((document.getElementById('resetconfirm')||{}).value)||''});
  if(!res||res.error){ if(box)box.innerHTML=''; showErr((res&&res.error)||'Clean failed'); return; }
  toast('✓ '+(p.full?'School data reset — start fresh':('Cleared: '+p.label)));
  await loadAll();
}
function cleanAckOk(){ const a=document.getElementById('cleanack'); if(!a||!a.checked){ showErr('Tick the "I understand" box first'); return false; } return true; }
function cleanNameOk(){
  const nm=((SCHOOLS.find(s=>String(s.id)===String(SCHOOL))||{}).name||'').trim().toLowerCase();
  const el=document.getElementById('resetconfirm');
  return !!nm && el && (el.value||'').trim().toLowerCase()===nm;
}
function adminClean(target,label){
  if(!target){toast('Pick something to clear first');return;}
  try{track('cleanup_run',{target:target});}catch(e){}
  if(!cleanAckOk()) return;
  if(/^m_/.test(target) && !cleanNameOk()){ showErr('To clear a whole list, type the exact school name in the box first'); return; }
  _cleanPending={target:target,label:label,full:false};
  showCleanConfirm('Clear "'+label+'" for this school? This permanently removes the selected data and cannot be undone.');
}
function adminFullReset(){
  if(!cleanAckOk()) return;
  if(!cleanNameOk()){ showErr('Type the exact school name in the box to confirm a full reset'); return; }
  const nm=(SCHOOLS.find(s=>String(s.id)===String(SCHOOL))||{}).name||'this school';
  _cleanPending={target:'all',label:'Full reset',full:true};
  showCleanConfirm('FULL RESET of "'+nm+'": delete ALL data — classes, subjects, teachers, rooms, timetable, quota — everything. The school, its settings and user logins are kept. This CANNOT be undone.');
}
async function doImport(){ const f=document.getElementById('impfile').files[0]; const box=document.getElementById('impresult');
  if(!f){box.innerHTML='<div class="errmsg">'+t('err_choose_file')+'</div>';showErr(t('err_choose_file'));return;}
  if(!/\.xlsx$/i.test(f.name)){box.innerHTML='<div class="errmsg">'+t('err_need_xlsx')+'</div>';showErr(t('err_need_xlsx')+' ('+f.name+')');return;}
  box.innerHTML='<div class="small" style="color:#5c6580">'+t('please_wait')+'</div>';
  const fd=new FormData(); fd.append('file',f);
  const hd={}; if(AUTH)hd['Authorization']='Bearer '+AUTH; if(SCHOOL)hd['X-School-Id']=SCHOOL;   // send current school!
  let r,d=null;
  try{ r=await fetch('/api/import/setup',{method:'POST',headers:hd,body:fd}); }
  catch(e){ box.innerHTML='<div class="errmsg">'+t('import_failed')+'</div>'; showErr(t('import_failed')+' — '+(e&&e.message||e)); return; }
  try{ d=await r.json(); }catch(e){ d=null; }
  if(r.ok && d && d.ok){ const a=d.added||{}; const total=(a.classes||0)+(a.subjects||0)+(a.rooms||0)+(a.teachers||0)+(a.chapters||0);
    box.innerHTML=`<div class="okmsg">${t('import_ok',{c:a.classes||0,s:a.subjects||0,r:a.rooms||0,t:a.teachers||0})}</div>`;
    await loadAll();
    if(total===0){ showErr(t('import_nothing')); } else { toast(t('import_ok',{c:a.classes||0,s:a.subjects||0,r:a.rooms||0,t:a.teachers||0})); }
  } else { const msg=(d&&d.error)||('HTTP '+(r?r.status:'?')); box.innerHTML=`<div class="errmsg">${t('import_failed')}: ${msg}</div>`; showErr(t('import_failed')+' — '+msg); }
}

 {id:"views",icon:"👁️",title:"Class / Teacher / School views",who:"Everyone",where:"Timetable → Class / Teacher / School View",
  intro:"See and share the timetable by Class, Teacher or the whole School.",
  steps:["Class view: pick a class for its weekly grid; Print, export to Excel, or get a read-only Share link.","Teacher view: pick a teacher to see their week and total load.","School view: pick a day to see every class together.","Print all prints every class or teacher at once — then Save as PDF from your browser."],
  tip:"A Share link opens the timetable with no login — handy for parents."},
 {id:"insights",icon:"📊",title:"Insights dashboard",who:"Admin",where:"Timetable → Insights",
  intro:"A dashboard of KPIs and charts about your timetable.",
  steps:["See KPI tiles (classes, subjects, teachers, completion) plus a period-load heatmap and teacher-workload, subject-coverage and room-utilisation charts.","Tap any KPI tile to jump straight to that view."],
  tip:"Use it to spot overloaded teachers or under-used rooms at a glance."},
 {id:"substitution",icon:"👥",title:"Substitution, proxy & leave",who:"Admin / Teacher",where:"Daily → Substitution",
  intro:"Cover absent teachers with a proxy on a date or range, plus a leave-approval workflow.",
  steps:["Substitution has tabs at the top — Teacher leave, Date-based cover and a recurring Weekday cover.","Pick the absent teacher and the date(s), then assign a free teacher as proxy for each period.","The free-teacher list is ranked by subject match — ⭐ same subject first, 🥈 secondary subject next, then general cover — and a ✔ Best match is suggested per period.","Teachers can apply for leave; an admin approves it and the proxy rows are created automatically."],
  tip:"Only teachers marked can-substitute are offered as proxies; set each teacher's subject priority order for a better match."},
 {id:"liveclass",icon:"🟢",title:"Live Class",who:"Everyone",where:"Daily → Live Class",
  intro:"Today's live status — who is teaching now, proxies and free periods.",
  steps:["Open it to see the current period across all classes, including today's proxies and free slots."],
  tip:"Great for the front office to see the whole school at a glance."},
 {id:"diary",icon:"📓",title:"Teacher Diary & Chapters",who:"Teacher",where:"Daily → Teacher Diary",
  intro:"A daily and monthly teaching register per teacher, plus chapters.",
  steps:["Teacher Diary has two tabs at the top — the Diary and Chapters.","Pick a teacher and date; fill the lesson, topic, homework, and so on.","Chapters: pick a subject and record its chapters to track the syllabus.","Switch between daily entry and the monthly register view."],
  tip:"A Teacher login only sees their own diary."},
 {id:"notifications",icon:"🔔",title:"Notifications",who:"Everyone",where:"Daily → Notifications",
  intro:"Free push alerts to any phone/PC where the app (PWA) is installed — no phone number or email needed.",
  steps:["Each teacher: open the app once → Notifications → Enable notifications (allow when the browser asks). On iPhone, add the app to the Home Screen first.","An admin/principal types a title + message and Sends — it pops on every enabled device.","It only reaches devices where the app is installed and notifications are ON."],
  tip:"Ask every teacher to enable it once — then announcements reach everyone instantly, free of cost."},
 {id:"reports",icon:"📈",title:"Reports",who:"Admin",where:"Timetable → Reports",
  intro:"Ready-made Excel reports, plus fill-your-own templates and a beautify-any-Excel tool.",
  steps:["Reports has tabs at the top — Timetable, Analysis, DEO, Diary and Custom.","Pick a report (class workload, subject coverage, room use, teacher free periods, period load, diary) — it downloads as Excel.","The DEO tab has the government-format staff reports (Gujarat Patrak A/B/K + inspection Registers) — see the DEO Reports topic.","Or upload your own Excel template with placeholders to fill with school data, or beautify any data file."],
  tip:"Templates repeat a row using a {{rows:teachers}} marker then {{field}} tokens."},
 {id:"deo",icon:"🏛",title:"DEO Reports & Gujarat Patrak",who:"Admin",where:"Timetable → Reports → DEO",
  intro:"District Education Officer format staff reports — Gujarat Patrak A/B/K plus inspection Registers (Format 1-5) — built automatically from your teachers, subjects and the generated timetable.",
  steps:["First open ⚙ Report header (school profile) and fill it once: school address, school code, UDISE, district, mobile, email, Reg code, Inspection ref, Officer name and Max load. These print on every report header.","Gujarat Patrak: pick the Section (Primary 1-8 / Secondary 9-10 / Higher-Secondary 11-12) from the dropdown, then Print/PDF or Excel for Patrak-A (class allocation), Patrak-B (teacher workload) or Patrak-K (workload certificate). Sections with no classes are greyed out.","Inspection Registers: Format 1 (teacher weekly workload), Format 2 (class period allocation), Format 3 (room utilization), Format 4 (bell schedule), Format 5 (absence & substitute) — each with Print/PDF + Excel.","Quick statements: Teacher Workload and Teacher Requirement.","📦 All formats downloads everything as one Excel; ↻ Refresh reloads after you change data.","For accurate figures, generate the timetable first and fill each teacher's Designation and Sanctioned load in Master → Teachers."],
  tip:"Reports auto-build from Week A of the generated timetable. The Section is read from the class-name number (9A → Secondary, 11 Science → Higher-Secondary)."},
 {id:"versions",icon:"💾",title:"Save Timetable (versions)",who:"Admin",where:"Timetable → Save Timetable",

 {id:"data",icon:"📥",title:"Import / Export",who:"Admin",where:"Admin → Import / Export",

  steps:["Import / Export has tabs at the top — Export, Import and Cleanup.","Download the setup template, fill the Classes / Subjects / Rooms / Teachers / Chapters sheets, then upload to import.","Export the timetable or setup to Excel any time."],
  tip:"The importer adds only new names — running it twice will not create duplicates."},
 {id:"cleanup",icon:"🧹",title:"Data Cleanup & Remove duplicates",who:"Admin",where:"Admin → Import / Export → Data Cleanup · and ⚠ Remove duplicates on each Master tab",
  intro:"Fix mistakes by clearing a field, a section or a whole list — or merge duplicate rows.",
  steps:["Remove duplicates: on Subjects / Classes / Teachers / Rooms an amber ⚠ Remove duplicates (N) button merges same-name rows into one, keeping the timetable intact.","Data Cleanup: pick a field (e.g. Teachers → Qualification), a section (Timetable, Quota…) or a whole list, tick the I-understand box, then Clear. A Yes/No box confirms.","Full reset: to wipe all data for the school, tick the box, type the exact school name, then tap Yes on the confirm."],
  tip:"The school, its settings and user logins are always kept — only the chosen data is cleared, and it cannot be undone."},
 {id:"users",icon:"👤",title:"Users & roles",who:"Admin",where:"Admin → Users",

 {id:"platform",icon:"🌐",title:"Language, install & offline",who:"Everyone",where:"Top bar language selector · your browser",

  tip:"Any failed action now shows a red banner at the top with the reason."},
 {id:"fields",icon:"📋",title:"Every field explained — what to type",who:"Admin / Principal",where:"Each setup screen",
  intro:"A quick what-to-fill for every box, with an example. Best setup order: Academic Hours → Classes → Subjects → Teachers → Rooms → Weekly Quota → Auto-generate.",
  steps:[
   "<b>Academic Hours ▸ Timings</b> — School name (e.g. <i>R.N. Naik High School</i>); Session (<i>2025-26</i>); tick Working days (Mon–Sat); Weekday start/end (<i>10:30 / 17:00</i>); Period minutes (<i>35</i>); Number of periods (blank = auto); Lunch after period (<i>4</i>) &amp; Lunch minutes (<i>30</i>); Short break after (<i>2</i>) &amp; minutes (<i>10</i>). Saturday has its own block if Sat is a working day.",
   "<b>Classes</b> — Name (<i>Class 9 A</i>); Standard (<i>9</i>); Section (<i>A</i>); Medium (<i>English</i>); Board (<i>State</i>); Class teacher (pick from list); tick <i>CT first period</i> to pin the class teacher to Period 1.",
   "<b>Subjects</b> — Name (<i>Mathematics</i>); Medium (<i>English</i>); <i>Active</i> tick = in use (untick to archive, not delete); <i>Double</i> tick = a lab / two-periods-in-a-row subject (<i>Computer Lab</i>).",
   "<b>🧩 Combine Subjects</b> (group-split) — pick the Class; tick the two parallel subjects (<i>Computer + PT</i>); for each pick a teacher; tick Days (or All week) and Period(s) (<i>P3</i>); press Create. The name builds itself (<i>Computer / PT</i>).",
   "<b>Teachers</b> — Name (<i>Alka Shah</i>); Qualification (<i>B.Ed</i>); Designation (<i>Asst. Teacher</i>); Main subject (their primary); Weekly load = periods/week (<i>30</i>); <i>Can substitute</i> tick; ⚙ More → Sanctioned load, Max per day (<i>6</i>), Max consecutive (<i>3</i>); <i>+ Can teach</i> = every subject they can take (drag ▲▼ for priority); <i>Give login</i> = create their user ID + role.",
   "<b>Rooms</b> — Name (<i>Room 12</i> / <i>Computer Lab</i>); Capacity (optional, <i>40</i>).",
   "<b>Weekly Quota</b> — pick a Class, then type periods-per-week for each subject (<i>Maths 6, English 5</i>). Total must not exceed the week’s free slots (turns red if over). <i>Subject rules</i> tab: e.g. Maths <i>not same day</i> as Science, or <i>not consecutive</i>.",
   "<b>Availability</b> — choose Teacher / Class / Room, pick who, then click day×period cells to block them (red = never schedule here). Use for a teacher who leaves early on <i>Sat P6</i>.",
   "<b>Students</b> — add Name + Roll per class; <i>Choices</i> tab sets which elective group each student picked (only needed for per-student timetables).",
   "<b>Auto Set (grid)</b> — pick Day; each cell has Subject + Teacher + Room dropdowns; 🔒 locks a cell so Auto-generate won’t change it; drag ⠿ to swap. Press Auto-generate to fill the rest.",
   "<b>Auto Set ▸ Combined classes</b> — join 2+ classes into ONE shared lesson (<i>Assembly, Games</i>): Name, Subject, Teacher, Room, Day, Period, then tick the classes. (This is different from 🧩 Combine Subjects.)",
   "<b>Optimizer</b> — just tick the preferences you want before Auto-generate: spread across week, balance teacher load, heavy subjects in the morning, fewer teacher gaps.",
   "<b>Substitution ▸ Leave</b> — Teacher, From/To date, Leave type, Reason → Apply; approving a leave auto-fills proxies. <i>Date cover</i>: pick teacher + dates → Fetch → assign a free teacher per period (⭐ = best subject match).",
   "<b>Teacher Diary</b> — Teacher + Date; per period fill Lesson/chapter, Topic, Learning outcome, Assessment, Homework, Teaching aids → Save.",
   "<b>Reports ▸ Inspection / Patrak header</b> — fill School address, code, UDISE, District, Mobile, Email, registration / inspection ref, Officer name once; then every Patrak / Format prints with it.",
   "<b>Versions</b> — type a Version name (<i>Final – Term 1</i>) and Save version to keep a snapshot you can restore later.",
   "<b>Users</b> — Name, Login ID, Role (Admin / Principal / Supervisor / Teacher), Mobile, Email, Password → Add. A Teacher’s name should match their teacher record so diary and leave link up."
  ],
  tip:"A full field-by-field Excel manual (with examples) is also available from your admin — the Aumtara User Manual file."},
];

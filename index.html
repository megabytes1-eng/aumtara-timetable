<style>
:root{--navy:#1F3864;--blue:#2f5fd0;--accent:#7030A0;--green:#0e9f6e;--amber:#c98a00;--red:#c0392b;--bg:#f4f7fc;--line:#e2e6ee;--muted:#555d70;}
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{margin:0;background:var(--bg);color:#222;}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:12px;}
header .logo{width:30px;height:30px;background:linear-gradient(135deg,#4f8cff,#7030A0);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;}
header h1{font-size:18px;margin:0;} header .sub{font-size:12.5px;opacity:.92;}
.langsel{margin-left:auto;background:#2c4a7c;color:#fff;border:1px solid #3f5f95;border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;}
.langsel option{background:#fff;color:#222;}
.savebadge{font-size:12px;background:#0e9f6e;color:#fff;padding:4px 10px;border-radius:20px;opacity:0;transition:.3s;}
.savebadge.show{opacity:1;}
.navtoggle{background:#2c4a7c;color:#fff;border:1px solid #3f5f95;border-radius:8px;padding:5px 11px;font-size:17px;line-height:1;cursor:pointer;font-weight:700;}
.navtoggle:hover{background:#345592;}
#shell{display:flex;align-items:flex-start;}
.tabs{display:flex;flex-direction:column;gap:1px;background:#fff;border-right:1px solid var(--line);padding:8px 8px 26px;width:216px;flex:0 0 216px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow-y:auto;}
.navgrp{font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);padding:13px 10px 6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;user-select:none;}
.navgrp:hover{color:var(--blue);}
.navgrp .car{font-size:12px;color:#6b7590;transition:transform .15s;}
.navgrp.collapsed .car{transform:rotate(-90deg);}
.navsec{display:flex;flex-direction:column;gap:1px;}
.tab{padding:9px 11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);border-radius:8px;white-space:nowrap;border-left:3px solid transparent;}
.tab:hover{background:#f4f7fc;color:var(--navy);}
.tab.active{color:var(--navy);background:#eef3fd;border-left-color:var(--blue);}
body.sidenav-off .tabs{display:none;}
.wrap{flex:1;min-width:0;max-width:1240px;margin:0 auto;padding:22px;}
@media(max-width:820px){
  .tabs{position:fixed;left:0;top:0;bottom:0;z-index:1200;max-height:none;box-shadow:3px 0 16px rgba(0,0,0,.18);width:230px;}
  body:not(.sidenav-off) #shell::before{content:"";position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:1100;}
}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:linear-gradient(135deg,#eaf1ff,#ffffff);border:1px solid #d3e2ff;border-radius:12px;padding:16px;border-top:4px solid var(--blue);}
.kpi .n{font-size:28px;font-weight:800;color:var(--navy);} .kpi .l{font-size:12.5px;color:#454d61;text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
.kpi.g{background:linear-gradient(135deg,#e6faf0,#ffffff);border-color:#c2edd6;border-top-color:var(--green);}
.kpi.a{background:linear-gradient(135deg,#fff5e3,#ffffff);border-color:#f1dcae;border-top-color:var(--amber);}
.kpi.p{background:linear-gradient(135deg,#f3eaff,#ffffff);border-color:#e0cef5;border-top-color:var(--accent);}
.kpi.g .n{color:var(--green);}.kpi.a .n{color:var(--amber);}.kpi.p .n{color:var(--accent);}
.kpi[onclick]{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;}
.kpi[onclick]:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(37,99,235,.13);transform:translateY(-2px);}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;}
.card h2{margin:0 0 4px;font-size:17px;color:var(--navy);} .card .desc{color:#414a63;font-size:14.5px;line-height:1.5;margin-bottom:14px;font-weight:500;}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
label{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:#222;}
button{background:var(--blue);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);} button.green{background:var(--green);}button.purple{background:var(--accent);}button.red{background:var(--red);}button.amber{background:var(--amber);}button.teal{background:#0e8f9c;}
button.mini{padding:4px 9px;font-size:12px;} button:hover{opacity:.92;}
table{border-collapse:collapse;width:100%;font-size:14px;} th,td{border:1px solid var(--line);padding:8px 10px;text-align:center;vertical-align:middle;}
th{background:var(--navy);color:#fff;} td.ph{background:#eef2fb;font-weight:700;color:var(--navy);}
.cell{min-width:130px;} .cell select{width:100%;font-size:13.5px;font-weight:500;color:#222;padding:4px 3px;border:none;background:transparent;margin:1px 0;}
.subj{font-weight:800;color:var(--navy);font-size:14.5px;} .tch{font-size:13.5px;font-weight:700;color:#33415a;} .rm{font-size:11.5px;color:var(--accent);}
.conflict{background:#ffe1e1 !important;outline:2px solid var(--red);}
.avtable th{font-size:14px;padding:10px 8px;} .avtable td.ph{font-size:14px;}
.avtable td.avcell{min-width:76px;height:50px;cursor:pointer;font-size:18px;font-weight:800;color:#b23b3b;background:#eef7ee;transition:background .12s;user-select:none;}
.avtable td.avcell:hover{background:#dcefe0;} .avtable td.avcell.blk{background:#fdecec;}
.avtable td.avnil{background:#f4f6fa;}
.free{color:#8b90a0;font-style:italic;}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;}
.pill.live{background:#d1fae5;color:#065f46;}.pill.break{background:#fef3c7;color:#92400e;}.pill.idle{background:#e5e7eb;color:#374151;}.pill.proxy{background:#ede9fe;color:#5b21b6;}
.mon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.mon{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;border-left:5px solid var(--line);}
.mon.live{border-left-color:var(--green);}.mon.break{border-left-color:var(--amber);}.mon.idle{border-left-color:#9ca3af;}.mon.proxy{border-left-color:var(--accent);}
.mon .cn{font-weight:800;color:var(--navy);font-size:15px;} .mon .info{font-size:12.5px;color:var(--muted);margin-top:6px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 0 16px;}
.note{background:#fff8e1;border-left:4px solid #f1c40f;padding:9px 12px;border-radius:0 6px 6px 0;font-size:12.5px;margin-bottom:16px;}
.hours-row{display:flex;justify-content:space-between;padding:10px 12px;border-left:4px solid var(--green);background:#f6fbff;border-radius:6px;margin-bottom:8px;} .hours-row.sat{border-left-color:var(--blue);}
.tag{background:#eef2fb;color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin:2px;display:inline-block;}
.small{font-size:12px;color:var(--muted);} .badge-bad{color:var(--red);font-weight:700;font-size:11px;}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;} .feat div{background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:13px;font-size:12.5px;border-left:4px solid var(--line);} .feat b{color:var(--navy);}
.feat div:nth-child(1){background:linear-gradient(135deg,#eaf1ff,#fbfdff);border-color:#d3e2ff;border-left-color:var(--blue);}
.feat div:nth-child(2){background:linear-gradient(135deg,#fff0ef,#fffbfb);border-color:#f4d3d1;border-left-color:var(--red);}
.feat div:nth-child(3){background:linear-gradient(135deg,#f3eaff,#fdfbff);border-color:#e0cef5;border-left-color:var(--accent);}
.feat div[onclick]{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;} .feat div[onclick]:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(37,99,235,.14);}
.setcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;} @media(max-width:820px){.setcols{grid-template-columns:1fr;}.kpis{grid-template-columns:1fr 1fr;}}
.listrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #f0f2f6;} .listrow input{flex:1;}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:#eef2fb;padding:4px 8px;border-radius:12px;margin:2px;cursor:pointer;color:#333;} .chk input{margin:0;}
.guide{counter-reset:step;} .step{display:flex;gap:12px;margin-bottom:14px;} .step .no{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;} .step .txt b{color:var(--navy);} .step .txt{font-size:13.5px;}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);}
.okmsg{background:#d1fae5;color:#065f46;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;}
.wkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 12px;}
.wkbtn{padding:6px 14px;border:1.5px solid #c7d2fe;background:#fff;color:#1F3864;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;}
.wkbtn.on{background:#1F3864;color:#fff;border-color:#1F3864;}
.heat{border-collapse:collapse;} .heat td,.heat th{border:1px solid #e5e9f2;min-width:42px;height:34px;font-size:12.5px;padding:2px;} .heat th{background:#1F3864;color:#fff;font-weight:700;}
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;} @media(max-width:900px){.ins-grid{grid-template-columns:1fr;}}
.errmsg{background:#fee2e2;color:#991b1b;padding:8px 12px;border-radius:8px;font-size:13px;margin-top:10px;}
.lockbtn{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;line-height:1;padding:2px 5px;cursor:pointer;opacity:.55;transition:opacity .15s,background .15s;}
.lockbtn:hover{opacity:1;} .lockbtn.on{opacity:1;background:#fff7e6;border-color:#f0c46b;}
td.cell.locked{background:#fffbeb;} td.cell .cellhead{display:flex;justify-content:flex-end;margin-bottom:2px;}
#printhead{display:none;}
@media print{
  header,.tabs,.savebadge{display:none !important;}
  .wrap{padding:0;max-width:100%;}
  .card{border:none;box-shadow:none;padding:0;margin:0;}
  .row,.desc,button,.note,.card>h2{display:none !important;}
  #diaryreport{border:1px solid #999 !important;padding:16px !important;}
  #printhead{display:block;text-align:center;margin-bottom:10px;} #printhead h3{margin:0;color:#000;} #printhead .sub{font-size:12px;color:#444;}
  table{font-size:12px;} th{background:#1F3864 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .conflict{outline:none;}
}
</style>

  step1_t:'உங்கள் பள்ளியை அமைக்கவும்',step1_d:'அமைப்பில் உங்கள் வகுப்புகள், பாடங்கள், அறைகள் & ஆசிரியர்களைச் சேர்க்கவும். ஒவ்வொரு ஆசிரியருக்கும் தகுதி, முதன்மை பாடம், கற்பிக்கக்கூடிய பாடங்கள் & வார சுமை அமைக்கவும். இறக்குமதி / ஏற்றுமதி மூலம் பலவற்றைச் சேர்க்கவும்.',

let LANG=(function(){try{return localStorage.getItem('tt_lang')||'en';}catch(e){return 'en';}})();
function t(k,vars){let s=(I18N[LANG]&&I18N[LANG][k]);if(s==null)s=I18N.en[k];if(s==null)s=k;if(vars)for(const p in vars)s=s.split('{'+p+'}').join(vars[p]);return s;}
function DD(){ if(rotMode())return Array.from({length:rotDays()},(_,i)=>rotLabel(i)); return (I18N[LANG]&&I18N[LANG]._days)||I18N.en._days;}
function setLang(l){LANG=l;try{localStorage.setItem('tt_lang',l);}catch(e){}document.documentElement.lang=l;applyChrome();if(!ME){renderLogin();return;}showUserChip();render();}
function buildLangSel(){const s=document.getElementById('langsel');s.innerHTML=LANGS.map(([c,n])=>`<option value="${c}" ${c===LANG?'selected':''}>🌐 ${n}</option>`).join('');}
function applyChrome(){document.getElementById('apptitle').textContent=t('app_title');document.getElementById('appsub').textContent=t('app_sub');const s=document.getElementById('langsel');if(s)s.value=LANG;}

/* ============================ auth / login ============================ */
async function boot(){document.documentElement.lang=LANG;buildLangSel();applyChrome();
  if(!AUTH){renderLogin();return;}
  try{ME=await api('GET','/api/me');}catch(e){ME=null;}
  if(!ME||!ME.id){renderLogin();return;}
  loggedOut=false;startApp();}
async function startApp(){loggedOut=false;
  try{SCHOOLS=await api('GET','/api/schools');}catch(e){SCHOOLS=[];}
  if(!SCHOOL || !SCHOOLS.find(s=>String(s.id)===String(SCHOOL))) SCHOOL=(ME&&ME.school_id)?String(ME.school_id):(SCHOOLS[0]?String(SCHOOLS[0].id):null);
  try{if(SCHOOL)localStorage.setItem('tt_school',SCHOOL);}catch(e){}
  showUserChip();showSchoolBar();loadAll();}
function showSchoolBar(){const hdr=document.querySelector('header');let el=document.getElementById('schoolbar');
  if(!el){el=document.createElement('div');el.id='schoolbar';el.style.cssText='display:flex;align-items:center;gap:6px;color:#fff;font-size:13px;margin-left:12px';hdr.insertBefore(el, document.getElementById('userchip')||document.getElementById('saved'));}
  const cur=SCHOOLS.find(s=>String(s.id)===String(SCHOOL));const nm=s=>String(s&&s.name||'').replace(/</g,'&lt;');
  const logo=cur&&cur.logo?`<img src="${cur.logo}" style="height:26px;max-width:60px;border-radius:5px;background:#fff;padding:1px;vertical-align:middle">`:'';
  if(ME&&ME.role==='master'&&SCHOOLS.length>1){
    el.innerHTML=`${logo||'🏫'} <select title="${t('switch_school')}" onchange="switchSchool(this.value)" style="background:#2c4a7c;color:#fff;border:1px solid #3f5f95;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:600">${SCHOOLS.map(s=>`<option value="${s.id}" ${String(s.id)===String(SCHOOL)?'selected':''}>${nm(s)}${s.board?' · '+s.board:''}</option>`).join('')}</select>`;
  } else if(cur){ el.innerHTML=`<span style="opacity:.92;display:flex;align-items:center;gap:6px">${logo||'🏫'} ${nm(cur)}${cur.board?' · '+cur.board:''}</span>`; }
  else el.innerHTML='';}
function switchSchool(id){SCHOOL=String(id);try{localStorage.setItem('tt_school',SCHOOL);}catch(e){}tab='dash';showSchoolBar();loadAll();}
function renderLogin(){loggedOut=false;const tb=document.getElementById('tabs');if(tb)tb.innerHTML='';const uc=document.getElementById('userchip');if(uc)uc.remove();const sb=document.getElementById('schoolbar');if(sb)sb.remove();
  document.getElementById('view').innerHTML=`<div class="card" style="max-width:400px;margin:48px auto">
    <h2>${t('login_title')}</h2><div class="desc">${t('login_sub')}</div>
    <div style="margin-bottom:4px"><label>${t('login_id')}</label><input id="li_user" style="width:100%" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="small" style="color:#5c6580;margin-bottom:10px">${t('login_hint')}</div>
    <div style="margin-bottom:14px"><label>${t('login_pw')}</label><input id="li_pw" type="password" style="width:100%" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="green" style="width:100%" onclick="doLogin()">${t('login_btn')}</button>
    <div id="li_err" class="errmsg" style="display:none;margin-top:10px"></div>
    <div style="text-align:center;margin-top:16px;border-top:1px solid #eef1f9;padding-top:14px"><a href="#" onclick="renderSignup();return false" style="color:#6b3fa0;font-size:13px;font-weight:600">${t('signup_link')}</a></div></div>`;
  const f=document.getElementById('li_user');if(f)f.focus();}
const BOARDS=['CBSE','ICSE / CISCE','IB (International Baccalaureate)','IGCSE / Cambridge','State Board','NIOS','Other'];
function renderSignup(){loggedOut=false;const tb=document.getElementById('tabs');if(tb)tb.innerHTML='';const uc=document.getElementById('userchip');if(uc)uc.remove();
  document.getElementById('view').innerHTML=`<div class="card" style="max-width:430px;margin:36px auto">

function cycleIndexToday(){ const n=cycleWeeks(); if(n<=1||!config.cycle_start) return 0;
  const start=new Date(config.cycle_start+'T00:00:00'); if(isNaN(start.getTime())) return 0;
  const now=new Date(); const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if((config.cycle_mode||'week')==='day'){ const wd=new Set(WD()); let count=0; const d=new Date(start);
    for(let i=0;i<800&&d<=today;i++){ if(wd.has((d.getDay()+6)%7)) count++; d.setDate(d.getDate()+1); }
    return ((count-1)%n+n)%n; }
  const mondayOf=x=>{const m=new Date(x);m.setDate(m.getDate()-((m.getDay()+6)%7));m.setHours(0,0,0,0);return m;};
  const weeks=Math.floor((mondayOf(today)-mondayOf(start))/(7*86400000));
  return ((weeks%n)+n)%n; }

function addMin(h,m){let[a,b]=h.split(":").map(Number);let d=new Date(2020,0,1,a,b+m);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function csvNums(s){return String(s||'').split(',').map(x=>parseInt(x,10)).filter(n=>!isNaN(n));}

function slotsFor(di){
  if(!WD().includes(di))return [];
  const sat = rotMode() ? false : (di===5);
  const end=sat?config.saturday_end:config.weekday_end;
  const periodMin=+(sat&&config.sat_period_minutes!=null?config.sat_period_minutes:config.period_minutes);
  const durs=csvNums(sat&&config.sat_period_durations!=null?config.sat_period_durations:config.period_durations);
  const shortAfter=new Set(csvNums(sat&&config.sat_short_break_after!=null?config.sat_short_break_after:config.short_break_after));
  const shortMin=+(sat&&config.sat_short_break_minutes!=null?config.sat_short_break_minutes:config.short_break_minutes)||0;
  const lunchAfter=+(sat&&config.sat_lunch_after!=null?config.sat_lunch_after:(config.lunch_after!=null?config.lunch_after:config.break_after_period));
  const lunchMin=+(sat&&config.sat_lunch_minutes!=null?config.sat_lunch_minutes:(config.lunch_minutes!=null?config.lunch_minutes:config.break_minutes))||0;
  const N=+(sat&&config.sat_num_periods!=null?config.sat_num_periods:config.num_periods)||0;
  const CAP=20;
  let s=[],t=(sat&&config.saturday_start)?config.saturday_start:config.weekday_start,i=0;
  while(true){const dur=durs[i]||periodMin;const e=addMin(t,dur);
    s.push({i,label:"P"+(i+1),start:t,end:e,brk:false});i++;
    const stop=N>0?i>=Math.min(N,CAP):e>=end;
    if(stop||i>=CAP)break;t=e;
    if(lunchAfter&&i===lunchAfter&&lunchMin>0){const be=addMin(t,lunchMin);s.push({brk:true,kind:'lunch',label:"Lunch",start:t,end:be});t=be;}
    if(shortAfter.has(i)&&shortMin>0){const be=addMin(t,shortMin);s.push({brk:true,kind:'short',label:"Break",start:t,end:be});t=be;}}
  return s;
}

function pickLogo(id){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(inp);
  const cleanup=()=>{try{document.body.removeChild(inp);}catch(e){}};
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];
    if(!f){cleanup();return;}
    if(f.type && !/^image\//.test(f.type)){ cleanup(); showErr(t('logo_bad_type')+' ('+(f.type||f.name)+')'); return; }
    if(f.size>8*1024*1024){ cleanup(); showErr(t('logo_big_file')); return; }
    const rd=new FileReader();
    rd.onerror=()=>{cleanup();showErr(t('logo_read_err'));};
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        try{ let w=img.width,h=img.height; const max=280;
          if(w>max||h>max){const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r);}
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          const ctx=cv.getContext('2d'); ctx.drawImage(img,0,0,w,h);
          let out=cv.toDataURL('image/png');
          if(out.length>1200000) out=cv.toDataURL('image/jpeg',0.85);   // large/photographic → JPEG to stay small
          updSchool(id,{logo:out});
        }catch(e){ if(String(rd.result).length<2000000) updSchool(id,{logo:rd.result}); else toast(t('logo_too_big')); }
        cleanup();
      };
      img.onerror=()=>{ if(String(rd.result).length<2000000) updSchool(id,{logo:rd.result}); else toast(t('logo_too_big')); cleanup(); };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function removeLogo(id){updSchool(id,{logo:''});}

function pickAndPost(url, filename, extra){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls';
  inp.style.cssText='position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(inp);
  const cleanup=()=>{try{document.body.removeChild(inp);}catch(e){}};
  inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f){cleanup();return;}
    const fd=new FormData(); fd.append('file',f); if(extra)for(const k in extra)fd.append(k,extra[k]||'');
    toast(t('please_wait'));
    try{ const hd={}; if(AUTH)hd['Authorization']='Bearer '+AUTH; if(SCHOOL)hd['X-School-Id']=SCHOOL;
      const r=await fetch(url,{method:'POST',headers:hd,body:fd});
      if(!r.ok){ const d=await r.json().catch(()=>({})); toast((d&&d.error)||t('report_failed')); cleanup(); return; }
      const blob=await r.blob(); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); toast(t('report_ready'));
    }catch(e){ toast(t('report_failed')); }
    cleanup();
  };
  inp.click();
}

function sesc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function maxTeachPeriods(){ let m=1; WD().forEach(di=>{ m=Math.max(m, slotsFor(di).filter(s=>!s.brk).length); }); return m; }
function electiveAt(di,pi){ return ELECTIVES.find(e=>e.day_of_week===di&&e.period_index===pi&&(e.week_index||0)===0); }
function elecOption(e,oid){ return (e.options||[]).find(o=>o.id===oid); }
async function loadStudents(){
  const cls=filteredClasses();
  if(!curSClass||!cls.find(c=>c.id===curSClass)) curSClass=(cls[0]||classes[0]||{}).id||null;
  if(!curSClass){ STUDENTS=[];ELECTIVES=[];SCHOICES={};render();return; }
  const [st,el]=await Promise.all([api('GET','/api/students?class_id='+curSClass),api('GET','/api/electives?class_id='+curSClass)]);
  STUDENTS=Array.isArray(st)?st:[]; ELECTIVES=Array.isArray(el)?el:[];
  if(!curStudent||!STUDENTS.find(s=>s.id===curStudent)) curStudent=STUDENTS[0]?STUDENTS[0].id:null;
  await loadChoices(); render();
}

async function toggleAvail(di,pi){ if(!availEntity)return; const key=di+'_'+pi; const willBlock=!availBlocks.has(key);

async function doImport(){ const f=document.getElementById('impfile').files[0]; const box=document.getElementById('impresult');
  if(!f){box.innerHTML='<div class="errmsg">'+t('err_choose_file')+'</div>';showErr(t('err_choose_file'));return;}
  if(!/\.xlsx$/i.test(f.name)){box.innerHTML='<div class="errmsg">'+t('err_need_xlsx')+'</div>';showErr(t('err_need_xlsx')+' ('+f.name+')');return;}
  box.innerHTML='<div class="small" style="color:#5c6580">'+t('please_wait')+'</div>';
  const fd=new FormData(); fd.append('file',f);
  const hd={}; if(AUTH)hd['Authorization']='Bearer '+AUTH; if(SCHOOL)hd['X-School-Id']=SCHOOL;   // send current school!
  let r,d=null;
  try{ r=await fetch('/api/import/setup',{method:'POST',headers:hd,body:fd}); }
  catch(e){ box.innerHTML='<div class="errmsg">'+t('import_failed')+'</div>'; showErr(t('import_failed')+' — '+(e&&e.message||e)); return; }
  try{ d=await r.json(); }catch(e){ d=null; }
  if(r.ok && d && d.ok){ const a=d.added||{}; const total=(a.classes||0)+(a.subjects||0)+(a.rooms||0)+(a.teachers||0)+(a.chapters||0);
    box.innerHTML=`<div class="okmsg">${t('import_ok',{c:a.classes||0,s:a.subjects||0,r:a.rooms||0,t:a.teachers||0})}</div>`;
    await loadAll();
    if(total===0){ showErr(t('import_nothing')); } else { toast(t('import_ok',{c:a.classes||0,s:a.subjects||0,r:a.rooms||0,t:a.teachers||0})); }
  } else { const msg=(d&&d.error)||('HTTP '+(r?r.status:'?')); box.innerHTML=`<div class="errmsg">${t('import_failed')}: ${msg}</div>`; showErr(t('import_failed')+' — '+msg); }
}

     ${list}</div>`;
}
function diaryRegisterThisMonth(){ const m=new Date().toISOString().slice(0,7); const y=+m.slice(0,4),mo=+m.slice(5,7); const last=m+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0'); dl('/api/export/diary-summary.xlsx?from='+m+'-01&to='+last); }
async function delDiary(id){ await api('DELETE','/api/diary/'+id); toast(); loadDiary(); }

// ---------- SUBSTITUTION ----------
function subView(){ if(!dsTeacher&&teachers[0])dsTeacher=teachers[0].id; return `<div class="card"><h2>${t('sub_title')}</h2><div class="desc">${t('sub_desc')}</div>
   <div style="border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:16px;background:#f0fdf4">
     <div style="margin-bottom:8px"><b style="color:#166534">📝 ${t('leave_title')}</b> <span class="small" style="color:#5c6580">${t('leave_desc')}</span></div>
     <div class="row" style="align-items:flex-end;gap:10px;flex-wrap:wrap">
       <div style="min-width:160px"><label>${t('leave_teacher')}</label><select id="lv_teacher">${teachers.map(t2=>`<option value="${t2.id}">${t2.name}</option>`).join('')}</select></div>
       <div><label>${t('dsub_from')}</label><input id="lv_from" type="date"></div>
       <div><label>${t('dsub_to')}</label><input id="lv_to" type="date"></div>
       <div style="min-width:130px"><label>${t('leave_type_label')}</label><select id="lv_type">${leaveTypeOptions()}</select></div>
       <div style="flex:1;min-width:140px"><label>${t('leave_reason')}</label><input id="lv_reason" style="width:100%" placeholder="${t('leave_reason_ph')}"></div>
       <div><button onclick="applyLeave()" style="background:#0e9f6e;color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600">＋ ${t('leave_apply')}</button></div>
     </div>
     <div id="leavebox" style="margin-top:10px"></div>
     <div style="margin-top:10px;border-top:1px dashed #cfe3cf;padding-top:8px">
       <span class="small" style="color:#166534;font-weight:700">${t('leave_types_title')}</span> <span class="small" style="color:#5c6580">${t('leave_types_desc')}</span>
       <div class="row" style="gap:6px;margin:6px 0;flex-wrap:wrap"><input id="lt_name" style="width:180px" placeholder="${t('leave_type_ph')}"><button class="ghost mini" onclick="addLeaveType()">${t('add')}</button>
         <span id="ltbox"></span></div></div>
   </div>
   <div style="border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:16px;background:#faf9ff">
     <div style="margin-bottom:8px"><b style="color:#5a3ec8">📅 ${t('dsub_title')}</b> <span class="small" style="color:#5c6580">${t('dsub_desc')}</span></div>
     <div class="row" style="align-items:flex-end;gap:10px;flex-wrap:wrap">
       <div style="min-width:170px"><label>${t('dsub_teacher')}</label><select id="ds_teacher">${teachers.map(t2=>`<option value="${t2.id}" ${t2.id===dsTeacher?'selected':''}>${t2.name}</option>`).join('')}</select></div>
       <div><label>${t('dsub_from')}</label><input id="ds_from" type="date" value="${dsFrom||''}"></div>
       <div><label>${t('dsub_to')}</label><input id="ds_to" type="date" value="${dsTo||''}"></div>
       <div style="align-self:flex-end"><button class="ghost mini" onclick="dsQuick('today')">${t('dsub_today')}</button> <button class="ghost mini" onclick="dsQuick('tom')">${t('dsub_tom')}</button> <button class="ghost mini" onclick="dsQuick('7')">${t('dsub_7')}</button></div>
       <div><button onclick="fetchDateSub()" style="background:#5a3ec8;color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600">🔍 ${t('dsub_fetch')}</button></div>
     </div>
     <div id="dsresult" style="margin-top:10px"></div>
   </div>
   <div style="margin-bottom:6px"><b class="small">${t('dsub_weekday')}</b></div>
   <div class="row" style="margin-bottom:12px"><div><label>${t('day')}</label><select onchange="subDay=+this.value;loadCover()">${WD().map((i)=>`<option value="${i}" ${i===subDay?'selected':''}>${DD()[i]}</option>`).join("")}</select></div>
     <span class="small">${t('sub_hint')}</span></div>
   <div id="coverbox">Loading…</div></div>`;}
function dsQuick(which){ const iso=d=>d.toISOString().slice(0,10); const today=new Date();
  if(which==='today'){ dsFrom=iso(today); dsTo=iso(today); }
  else if(which==='tom'){ const t=new Date(today.getTime()+864e5); dsFrom=iso(t); dsTo=iso(t); }
  else { dsFrom=iso(today); dsTo=iso(new Date(today.getTime()+6*864e5)); }
  const f=document.getElementById('ds_from'),g=document.getElementById('ds_to'); if(f)f.value=dsFrom; if(g)g.value=dsTo; }
async function fetchDateSub(){ dsTeacher=+document.getElementById('ds_teacher').value; dsFrom=document.getElementById('ds_from').value; dsTo=document.getElementById('ds_to').value;
  const box=document.getElementById('dsresult'); if(!dsTeacher||!dsFrom||!dsTo){ showErr(t('dsub_need')); return; }
  box.innerHTML='<div class="small" style="color:#5c6580">'+t('please_wait')+'</div>';
  const r=await api('GET',`/api/datesub/fetch?teacher_id=${dsTeacher}&from=${dsFrom}&to=${dsTo}`);
  if(r&&r.error){ box.innerHTML=`<div class="errmsg">${r.error}</div>`; return; }
  dsData=(r&&r.periods)||[]; renderDateSub(); }
function renderDateSub(){ const box=document.getElementById('dsresult'); if(!box)return;
  if(!dsData.length){ box.innerHTML='<div class="note">'+t('dsub_none')+'</div>'; return; }
  const total=dsData.length, assigned=dsData.filter(p=>p.proxy_teacher_id).length, free=dsData.filter(p=>+p.is_free===1).length, pending=total-assigned-free;
  const rows=dsData.map((p,i)=>`<tr>
    <td>${p.sub_date}<br><span class="small" style="color:#5c6580">${DD()[p.dow]}</span></td>
    <td>P${p.period_index+1}<br><span class="small" style="color:#5c6580">${p.start||''}-${p.end||''}</span></td>
    <td>${(p.cls||'').replace(/</g,'&lt;')}</td>
    <td>${(p.subj||'—').replace(/</g,'&lt;')}</td>
    <td><select ${+p.is_free===1?'disabled':''} onchange="setDateProxy(${i},this.value)"><option value="">${t('opt_pick_free')}</option>${(p.free||[]).map(f=>`<option value="${f.id}" ${p.proxy_teacher_id===f.id?'selected':''}>${f.name}</option>`).join('')}</select></td>
    <td style="text-align:center"><label class="chk"><input type="checkbox" ${+p.is_free===1?'checked':''} onchange="setDateFree(${i},this.checked)"> ${t('dsub_free')}</label></td></tr>`).join('');
  box.innerHTML=`<div class="small" style="margin-bottom:6px">${t('dsub_summary',{t:total,a:assigned,f:free,p:pending})}</div>
    <table><tr><th>${t('dsub_date')}</th><th>${t('th_period')}</th><th>${t('class_')}</th><th>${t('subject')}</th><th>${t('th_assign_proxy')}</th><th>${t('dsub_free')}</th></tr>${rows}</table>`; }
async function setDateProxy(i,v){ const p=dsData[i]; p.proxy_teacher_id=v===''?null:+v; if(p.proxy_teacher_id)p.is_free=0;
  const r=await api('POST','/api/datesub',{sub_date:p.sub_date,class_id:p.class_id,period_index:p.period_index,absent_teacher_id:dsTeacher,proxy_teacher_id:p.proxy_teacher_id,is_free:0});
  if(r&&r.error){showErr(r.error);return;} toast(); renderDateSub(); }
async function setDateFree(i,checked){ const p=dsData[i]; p.is_free=checked?1:0; if(checked)p.proxy_teacher_id=null;
  const r=await api('POST','/api/datesub',{sub_date:p.sub_date,class_id:p.class_id,period_index:p.period_index,absent_teacher_id:dsTeacher,proxy_teacher_id:null,is_free:checked?1:0});
  if(r&&r.error){showErr(r.error);return;} toast(); renderDateSub(); }
function leaveBadge(st){ return st==='approved'?'<span class="tag" style="background:#dcfce7;color:#166534">✓ '+t('leave_approved')+'</span>':st==='rejected'?'<span class="tag" style="background:#fee2e2;color:#991b1b">✕ '+t('leave_rejected')+'</span>':'<span class="tag" style="background:#fef9c3;color:#854d0e">● '+t('leave_pending')+'</span>'; }
function leaveTypeOptions(){ return `<option value="">${t('leave_type_any')}</option>`+leaveTypes.map(x=>`<option value="${(x.name||'').replace(/"/g,'&quot;')}">${(x.name||'').replace(/</g,'&lt;')}</option>`).join(''); }
async function loadLeaveTypes(){ try{const l=await api('GET','/api/leave-types'); leaveTypes=Array.isArray(l)?l:[];}catch(e){leaveTypes=[];} renderLeaveTypeChips(); }
function renderLeaveTypeChips(){ const box=document.getElementById('ltbox'); if(!box)return;
  box.innerHTML=leaveTypes.length?leaveTypes.map(x=>`<span class="tag" style="background:#eef2fb">${(x.name||'').replace(/</g,'&lt;')} <span style="cursor:pointer;color:#b23b3b;font-weight:800" onclick="delLeaveType(${x.id})">✕</span></span>`).join(''):'<span class="small" style="color:#5c6580">'+t('leave_types_none')+'</span>'; }
async function addLeaveType(){ const el=document.getElementById('lt_name'); const name=(el.value||'').trim(); if(!name)return; const r=await api('POST','/api/leave-types',{name}); if(r&&r.error){showErr(r.error);return;} el.value=''; toast(); await loadLeaveTypes(); render(); }
async function delLeaveType(id){ if(!confirm(t('confirm_del_leave_type')))return; await api('DELETE','/api/leave-types/'+id); toast(); await loadLeaveTypes(); render(); }
function leaveTable(list,admin){ if(!list.length)return '<span class="small" style="color:#5c6580">'+t('leave_none')+'</span>';
  return `<table><tr><th>${t('leave_teacher')}</th><th>${t('leave_dates')}</th><th>${t('leave_type_label')}</th><th>${t('leave_reason')}</th><th>${t('leave_status')}</th>${admin?'<th></th>':''}</tr>${list.map(l=>`<tr>
    <td>${(l.teacher_name||'').replace(/</g,'&lt;')}</td><td>${l.date_from} → ${l.date_to}</td><td>${(l.leave_type||'—').replace(/</g,'&lt;')}</td><td>${(l.reason||'—').replace(/</g,'&lt;')}</td><td>${leaveBadge(l.status)}</td>
    ${admin?`<td style="white-space:nowrap">${l.status==='pending'?`<button class="ghost mini" onclick="approveLeave(${l.id})">${t('leave_approve')}</button> <button class="ghost mini" onclick="rejectLeave(${l.id})">${t('leave_reject')}</button> `:''}<button class="ghost mini red" onclick="delLeave(${l.id})">✕</button></td>`:''}</tr>`).join('')}</table>`; }
async function loadLeaves(){ const box=document.getElementById('leavebox'); if(!box)return; const list=await api('GET','/api/leaves'); leaves=Array.isArray(list)?list:[]; box.innerHTML=leaveTable(leaves,true); }
async function applyLeave(){ const teacher_id=+document.getElementById('lv_teacher').value, date_from=document.getElementById('lv_from').value, date_to=document.getElementById('lv_to').value, reason=document.getElementById('lv_reason').value, leave_type=document.getElementById('lv_type').value;
  if(!teacher_id||!date_from||!date_to){ showErr(t('leave_need')); return; }
  const r=await api('POST','/api/leaves',{teacher_id,date_from,date_to,reason,leave_type}); if(r&&r.error){showErr(r.error);return;}
  document.getElementById('lv_reason').value=''; toast(); loadLeaves(); }
async function approveLeave(id){ const r=await api('POST','/api/leaves/'+id+'/approve'); if(r&&r.error){showErr(r.error);return;}
  toast(t('leave_approved_toast',{n:(r&&r.periods)||0}));
  if(r&&r.teacher_id){ dsTeacher=r.teacher_id; dsFrom=r.date_from; dsTo=r.date_to; render(); setTimeout(fetchDateSub,60); } else loadLeaves(); }
async function rejectLeave(id){ const r=await api('POST','/api/leaves/'+id+'/reject'); if(r&&r.error){showErr(r.error);return;} toast(); loadLeaves(); }
async function delLeave(id){ if(!confirm(t('confirm_del_leave')))return; const r=await api('DELETE','/api/leaves/'+id); if(r&&r.error){showErr(r.error);return;} toast(); loadLeaves(); }
async function loadMyLeaves(){ const box=document.getElementById('myleavebox'); if(!box)return; const list=await api('GET','/api/leaves'); myLeaves=Array.isArray(list)?list:[]; box.innerHTML=leaveTable(myLeaves,false); }
async function applyMyLeave(){ const date_from=document.getElementById('mlv_from').value, date_to=document.getElementById('mlv_to').value, reason=document.getElementById('mlv_reason').value, leave_type=document.getElementById('mlv_type').value;
  if(!date_from||!date_to){ showErr(t('leave_need')); return; }
  const r=await api('POST','/api/leaves',{date_from,date_to,reason,leave_type}); if(r&&r.error){showErr(r.error);return;}
  document.getElementById('mlv_reason').value=''; toast(); loadMyLeaves(); }
function myLeaveCard(){ return `<div class="card"><h2>📝 ${t('leave_my_title')}</h2><div class="desc">${t('leave_my_desc')}</div>
   <div class="row" style="align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px">
     <div><label>${t('dsub_from')}</label><input id="mlv_from" type="date"></div>
     <div><label>${t('dsub_to')}</label><input id="mlv_to" type="date"></div>
     <div style="min-width:130px"><label>${t('leave_type_label')}</label><select id="mlv_type">${leaveTypeOptions()}</select></div>
     <div style="flex:1;min-width:140px"><label>${t('leave_reason')}</label><input id="mlv_reason" style="width:100%" placeholder="${t('leave_reason_ph')}"></div>
     <div><button onclick="applyMyLeave()" style="background:#0e9f6e;color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600">＋ ${t('leave_apply')}</button></div>
   </div><div id="myleavebox"></div></div>`; }
async function loadCover(){const box=document.getElementById('coverbox');if(!box)return;cover=await api('GET','/api/timetable/cover?day='+subDay);
  if(!cover.need.length){box.innerHTML='<div class="note">'+t('no_cover',{day:DD()[subDay]})+'</div>';return;}
  box.innerHTML=`<table><tr><th>${t('class_')}</th><th>${t('th_period')}</th><th>${t('subject')}</th><th>${t('th_absent_teacher')}</th><th>${t('th_assign_proxy')}</th></tr>${
    cover.need.map(n=>`<tr><td>${(classes.find(c=>c.id===n.class_id)||{}).name}</td><td>P${n.period_index+1}</td><td>${n.subj}</td>
      <td><span class="pill proxy">${tName(n.teacher_id)}</span></td>
      <td><select onchange="assignProxy(${n.class_id},${n.period_index},this.value)"><option value="">${t('opt_pick_free')}</option>${n.free.map(f=>`<option value="${f.id}" ${n.proxy_teacher_id===f.id?'selected':''}>${f.name}</option>`).join('')}</select></td></tr>`).join('')}</table>
    <div class="small" style="margin-top:8px">${t('proxy_note')}</div>`;}
async function assignProxy(class_id,period,v){await api('POST','/api/timetable/substitute',{day:subDay,class_id,period,proxy_teacher_id:v===''?null:+v});toast();loadCover();}

// ---------- LIVE MONITOR ----------
function monitor(){return `<div class="card"><h2>${t('monitor_title')}</h2>
   <div class="desc">${t('monitor_desc')}</div>
   <div class="row" style="margin-bottom:6px">
     <div><label>${t('lbl_sim_day')}</label><select id="mday" onchange="monDay=this.value===''?null:+this.value;refreshMonitor()"><option value="">${t('opt_now')}</option>${WD().map((i)=>`<option value="${i}" ${monDay===i?'selected':''}>${DD()[i]}</option>`).join("")}</select></div>
     <div><label>${t('lbl_sim_time')}</label><input type="time" id="mtime" value="${monTime||''}" onchange="monTime=this.value;refreshMonitor()"></div>
     <button class="ghost" onclick="monDay=null;monTime=null;refreshMonitor()">${t('btn_real_time')}</button></div>
   <div class="legend"><span><span class="pill live">${t('st_live')}</span> ${t('legend_running')}</span><span><span class="pill break">${t('st_break')}</span></span><span><span class="pill idle">${t('st_idle')}</span></span><span><span class="pill proxy">${t('st_proxy')}</span> ${t('legend_absent_covered')}</span></div>
   <div class="mon-grid" id="mongrid">Loading…</div></div>`;}
async function refreshMonitor(){const g=document.getElementById('mongrid');if(!g)return;let u='/api/timetable/monitor';if(monDay!=null&&monTime)u+=`?day=${monDay}&time=${monTime}`;const d=await api('GET',u);
  g.innerHTML=d.classes.map(c=>`<div class="mon ${c.status}"><div class="cn">${c.name}</div><div><span class="pill ${c.status}">${t('st_'+c.status)}</span></div><div class="info">${c.text}</div></div>`).join("");}

if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }); }
boot();
